  quote: '9.7. Участник УЦ обязуется: 1) сохранять конфиденциальную информацию; 2) не разглашать конфиденциальную информацию
    и использовать ее только в цел ях, для которых она была передана (получена); 3) соблюдать и принимать установленные УЦ
    меры по охране конфиденциальной информации; 4) хранение и использование конфиденциальной информации должно ос уществляться
    Участником УЦ в местах, обеспечивающих физическую сохранность конфиденциальной информации и авторизацию доступа; 5) исключить
    доступ к конфиденциальной информации всех лиц, кроме лица, уполномоченного владеть доступом к Закрытому ключу ЭЦП; 6)
    любая попытка извлечения конфиденциальной информации за пределы мест ее хранения/использования не допускается; 7) запрещается
    оставлять конфиденциальную информацию без присмотра; 8) конфиденциальную информацию, во время работы (выполнения действий,
    операций) использовать так, чтобы исключить возможность ознакомления с нею лиц, не уполномоченных н а такое ознакомление
    (доступ); 9) копирование или иное воспроизведение конфиденциальной информации, вк лючая любые выписки и цитаты, допускается
    лишь с согласия УЦ. При этом неудачные или ненужные копии и иные результаты воспроизведения конфиденциальной информации
    подлежат обязательному у ничтожению. В отношении копий и иных результатов воспроизведения конфиденциальной информации
    Участник УЦ обязан придерживаться тех же мер защиты, как и в отношении оригиналов;'
  requirement: Для конфиденциальной информации УЦ предусмотрены физическая сохранность, контроль доступа и запрет оставления
    без присмотра. Пункт 9.2 исключает определённые публичные сведения.
  limits: Участники удостоверяющего центра и информация в рамках его деятельности. Связь экранов или книги с процессами УЦ
    и конфиденциальность не установлены. Подпункт 25 определяет участников УЦ, а не политику безопасности.
  kind: fortebank_public_document
  quote_verified: true
  source: review 2026-10-17
