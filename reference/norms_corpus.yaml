n231_p75:
  short: НБРК №231, пункт 75
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 75
  url: https://adilet.zan.kz/rus/docs/V1900019680#z221
  quote: 75. Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также
    лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность
    наличных денег.
  heading: Параграф 8. Порядок осуществления кассовых операций по хранению наличных денег
  spec: V1900019680:75
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p76:
  short: НБРК №231, пункт 76
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 76
  url: https://adilet.zan.kz/rus/docs/V1900019680#z222
  quote: 76. Ключи и (или) коды электронных и механических замков от двери кладовой и (или) сейфовой комнаты банка хранятся
    у лиц, ответственных за сохранность наличных денег.
  heading: Параграф 8. Порядок осуществления кассовых операций по хранению наличных денег
  spec: V1900019680:76
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p77:
  short: НБРК №231, пункт 77
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 77
  url: https://adilet.zan.kz/rus/docs/V1900019680#z223
  quote: 77. Наличные деньги в кладовой и (или) сейфовой комнате хранятся раздельно по виду валюты, по номиналам банкнот и
    монет в металлических шкафах, стеллажах, сейфах, тележках.
  heading: Параграф 8. Порядок осуществления кассовых операций по хранению наличных денег
  spec: V1900019680:77
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p80:
  short: НБРК №231, пункт 80
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 80
  url: https://adilet.zan.kz/rus/docs/V1900019680#z226
  quote: 80. Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой
    и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем
    месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола),
    определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования.
  heading: Параграф 8. Порядок осуществления кассовых операций по хранению наличных денег
  spec: V1900019680:80
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p9:
  short: НБРК №231, пункт 9
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 9
  url: https://adilet.zan.kz/rus/docs/V1900019680#z78
  quote: 9. Банк обеспечивает наличие специальных оборудований для определения платежности и подлинности банкнот при осуществлении
    кассовых операций.
  heading: Параграф 1. Организация работы по осуществлению кассовых операций
  spec: V1900019680:9
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p98:
  short: НБРК №231, пункт 98
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 98
  url: https://adilet.zan.kz/rus/docs/V1900019680#z268
  quote: 98. Бригада работников подразделения инкассации банка, инкассаторской организации состоит из не менее трех человек.
    Водитель-инкассатор обеспечивает сохранность сумок с банкнотами, монетами и ценностями и ведет наблюдение за работой старшего
    бригады и инкассатора-сборщика. Инкассатор-сборщик осуществляет прием и сдачу сумок клиентов, старший бригады обеспечивает
    его безопасность при переносе, транспортировке от автомобильного транспорта до клиента и обратно.
  heading: Параграф 1. Организация осуществления операций по инкассации банкнот, монет и ценностей
  spec: V1900019680:98
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p99:
  short: НБРК №231, пункт 99
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 99
  url: https://adilet.zan.kz/rus/docs/V1900019680#z269
  quote: '99. Допускается формировать бригаду инкассаторов из двух человек – инкассатора-сборщика и водителя-инкассатора в
    следующих случаях:

    1) наличия в автомобильном транспорте видеокамер, запись которого доступна в режиме онлайн-просмотра руководителю или
    дежурному инкассатору подразделения инкассации банка, инкассаторской организации;

    2) применения кейсов и контейнеров, оснащенных специальной краской.'
  heading: Параграф 1. Организация осуществления операций по инкассации банкнот, монет и ценностей
  spec: V1900019680:99
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n14_p16:
  short: НБРК №14, пункт 16
  document: Об утверждении Правил организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
    Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация
    банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании
    лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  act: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 27 февраля 2020 года № 20075.
  clause: пункт 16
  url: https://adilet.zan.kz/rus/docs/V2000020075
  quote: '16. Устройство помещения кассы (касс) соответствуют следующим параметрам:

    1) каждая касса имеет отдельный вход с закрывающейся на замок дверью;

    2) стены, потолок и пол кассы оборудуются защитными средствами, обеспечивающими безопасность кассового работника;

    3) передняя часть кассы имеет оконный проем, оборудованный защитными средствами, обеспечивающими безопасность кассового
    работника и исключающие возможность хищения наличных денег и ценностей;

    4) передняя часть кассы оборудуется специальными транспортирующими устройствами для передачи наличных денег и ценностей.
    Механизм приведения в действие и фиксации транспортирующего устройства находится внутри кассы в исправном состоянии.

    Допускается оборудовать нижнюю переднюю часть кассы инкассаторским бункером, позволяющим принимать и выдавать более 10
    (десяти) пачек банкнот и (или) 5 (пяти) мешков монет;

    5) между кассами оборудуются перегородки, отделяющие кассы и соответственно рабочие места кассовых работников между собой;

    6) касса оборудуется видеокамерами системы видеонаблюдения;

    7) касса оборудуется переговорным устройством (микрофоном).

    Сноска. Пункт 16 - в редакции постановления Правления Национального Банка РК от 19.12.2022

    № 125

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).

    17. Исключен постановлением Правления Национального Банка РК от 24.12.2024

    № 88

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 3. Порядок устройства помещений банков, инкассаторских организаций, предназначенных для осуществления кассовых
    операций, операций по инкассации банкнот, монет и ценностей
  spec: V2000020075:16
  source_sha256: 89b91567941acfa3d4fca1d374f04b1716cdf20fab43bd4d50ca7074b17ee16d
  source: corpus 2026-10-17
