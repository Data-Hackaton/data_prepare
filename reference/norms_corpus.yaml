  clause: пункт 12
  url: https://adilet.zan.kz/rus/docs/V1900019680#z81
  quote: '12. Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке,
    установленном внутренними документами банка.

    Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих
    функции фото и видео фиксации.

    Сноска. Пункт 12 – в редакции постановления Правления Национального Банка РК от 10.11.2025

    № 71

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 1. Организация работы по осуществлению кассовых операций
  spec: V1900019680:12
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p122:
  short: НБРК №231, пункт 122
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 122
  url: https://adilet.zan.kz/rus/docs/V1900019680#z333
  quote: 122. Хранение банкнот, монет и ценностей в подразделениях инкассации банка, инкассаторских организациях осуществляется
    в кладовых или сейфовых комнатах соответствующих требованиям, установленным Правилами организации охраны и устройства
    помещений.
  heading: Параграф 4. Порядок осуществления хранения банкнот, монет и ценностей
  spec: V1900019680:122
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p123:
  short: НБРК №231, пункт 123
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 123
  url: https://adilet.zan.kz/rus/docs/V1900019680#z334
  quote: '123. Вместе с инкассированными банкнотами, монетами и ценностями работники подразделения инкассации банка, инкассаторской
    организации размещают и закрывают в одном из сейфов (металлических шкафов) в кладовой или сейфовой комнате явочные карточки,
    доверенность, служебные удостоверения.

    В случае наличия нескольких маршрутов в течение рабочего дня, размещение и закрытие в одном из сейфов (металлических шкафов)
    в кладовой или сейфовой комнате доверенности и служебного удостоверения работников подразделения инкассации банка, инкассаторской
    организации осуществляется после завершения последнего маршрута за рабочий день.

    Сноска. Пункт 123 - в редакции постановления Правления Национального Банка РК от 10.11.2025

    № 71

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 4. Порядок осуществления хранения банкнот, монет и ценностей
  spec: V1900019680:123
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p14:
  short: НБРК №231, пункт 14
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 14
  url: https://adilet.zan.kz/rus/docs/V1900019680#z83
  quote: 14. Банк обеспечивает осуществление кассовых операций кассовыми работниками, лицами, ответственными за сохранность
    наличных денег, в соответствии с их должностными обязанностями, а также распределение их должностных обязанностей, исключающее
    конфликт интересов и условия его возникновения, совершение хищения наличных денег и ценностей и других противоправных
    действий.
  heading: Параграф 1. Организация работы по осуществлению кассовых операций
  spec: V1900019680:14
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p15:
  short: НБРК №231, пункт 15
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 15
  url: https://adilet.zan.kz/rus/docs/V1900019680#z84
  quote: '15. Передача наличных денег между кассовыми работниками банка отражается в документе учета принятых и выданных наличных
    денег и ценностей, который содержит следующие сведения:

    1) дата передачи наличных денег;

    2) фамилия, имя, отчество (при его наличии), должность и подпись кассового работника, передающего наличные деньги;

    3) сумма наличных денег цифрами и прописью, количество, вид наличных денег;

    4) фамилия, имя, отчество (при его наличии), должность и подпись кассового работника, получающего наличные деньги.'
  heading: Параграф 1. Организация работы по осуществлению кассовых операций
  spec: V1900019680:15
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p19:
  short: НБРК №231, пункт 19
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 19
  url: https://adilet.zan.kz/rus/docs/V1900019680#z104
  quote: '19. Кассовый работник банка осуществляет следующие действия:

    1) проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо
    данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;

    2) принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность
    наличных денег в соответствии с пунктами 57 и 58 Правил;

    3) проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися
    образцами подписей;

    4) сверяет соответствие суммы, указанной в приходном кассовом документе, с общей суммой фактически принятых наличных денег;

    5) подписывает все экземпляры приходного кассового документа, проставляет штамп кассового работника банка на всех экземплярах
    приходного кассового документа;

    6) выдает клиенту документ, подтверждающий проведение кассовой операции по приему наличных денег.

    Сноска. Пункт 19 - в редакции приказа постановления Правления Национального Банка РК от 28.02.2022

    № 19

    (вводится в действие по истечении девяноста календарных дней после дня первого официального опубликования настоящего постановления);
    с изменением, внесенным постановлением Правления Национального Банка РК от 10.11.2025

    № 71

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:19
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p20:
  short: НБРК №231, пункт 20
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 20
  url: https://adilet.zan.kz/rus/docs/V1900019680#z111
  quote: '20. Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.

    На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в
    специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для
    хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).'
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:20
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p21:
  short: НБРК №231, пункт 21
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 21
  url: https://adilet.zan.kz/rus/docs/V1900019680#z113
  quote: 21. В случае если клиент вносит наличные деньги в кассу банка по нескольким приходным кассовым документам, кассовый
    работник принимает наличные деньги по каждому приходному кассовому документу отдельно.
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:21
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p22:
  short: НБРК №231, пункт 22
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 22
  url: https://adilet.zan.kz/rus/docs/V1900019680#z114
  quote: 22. Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:22
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p23:
  short: НБРК №231, пункт 23
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 23
  url: https://adilet.zan.kz/rus/docs/V1900019680#z115
  quote: '23. Принятые в течение рабочего дня наличные деньги кассовый работник формирует, упаковывает и сдает по приходным
    кассовым документам заведующему кассой или лицу, осуществляющему функции заведующего кассой, в порядке, установленном
    внутренними документами банка.

    Допускается передача принятых наличных денег заведующему кассой или лицу, осуществляющему функции заведующего кассой,
    в течение рабочего дня несколько раз.'
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:23
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p24:
  short: НБРК №231, пункт 24
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 24
  url: https://adilet.zan.kz/rus/docs/V1900019680#z117
  quote: '24. Кассовые операции по приему наличных денег клиента от подразделения инкассации банка или инкассаторской организации
    осуществляется кассовым работником банка на основании препроводительного документа, соответствующего требованиям пункта
    106 Правил.

    Кассовый работник:

    1) проверяет указание на препроводительном документе необходимых сведений, предусмотренных пунктом 106 Правил;

    2) осуществляет регистрацию суммы принимаемых наличных денег в порядке, установленном внутренними документами банка;

    3) проверяет целостность сумки;

    4) проверяет правильность пломбирования сумки.'
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:24
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p25:
  short: НБРК №231, пункт 25
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 25
  url: https://adilet.zan.kz/rus/docs/V1900019680#z123
  quote: '25. В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации
    банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности.

    При обнаружении недостачи или излишка составляется акт о результатах пересчета для принятия мер по выявлению причин недостачи
    или излишков в порядке, установленном внутренними документами банка.'
  heading: Параграф 2. Порядок осуществления кассовых операций по приему наличных денег
  spec: V1900019680:25
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p31:
  short: НБРК №231, пункт 31
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 31
  url: https://adilet.zan.kz/rus/docs/V1900019680#z144
  quote: '31. Кассовый работник банка осуществляет следующие действия:

    1) проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность, либо данным, подтверждающим
    (идентифицирующим) личность клиента, полученным посредством сервиса цифровых документов;

    2) проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися
    образцами подписей;

    3) подготавливает сумму наличных денег, подлежащую выдаче;

    4) пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги;

    5) подписывает все экземпляры расходного кассового документа и проставляет штамп кассового работника банка на всех экземплярах
    расходного кассового документа;

    6) выдает клиенту документ, подтверждающий проведение кассовой операции по выдаче наличных денег.

    Сноска. Пункт 31 - в редакции постановления Правления Национального Банка РК от 28.02.2022

    № 19

    (вводится в действие по истечении девяноста календарных дней после дня первого официального опубликования настоящего постановления);
    с изменением, внесенным постановлением Правления Национального Банка РК от 10.11.2025

    № 71

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:31
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p32:
  short: НБРК №231, пункт 32
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 32
  url: https://adilet.zan.kz/rus/docs/V1900019680#z150
  quote: '32. Кассовый работник выдает клиенту банкноты полными, неполными пачками и (или) отдельными корешками банкнот по
    обозначенным на упаковке суммам без полистного пересчета при условии сохранения неповрежденной упаковки. Банкноты из неполных,
    а также поврежденных корешков выдаются кассовым работником полистным пересчетом.

    Монеты, упакованные в мешки, выдаются по надписям на ярлыках, прикрепленных к мешкам, а упакованные в пакеты (тюбики,
    коробки) – по надписям на них. Монеты из неполных мешков выдаются кассовым работником с пересчетом по кружкам.'
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:32
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p33:
  short: НБРК №231, пункт 33
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 33
  url: https://adilet.zan.kz/rus/docs/V1900019680#z152
  quote: 33. Кассовый работник осуществляет выдачу наличных денег клиентам только в упаковке банка. Допускается выдача наличных
    денег в упаковке Национального Банка Республики Казахстан (далее – Национальный Банк) или другого банка, если порядок
    урегулирования претензий по выявленным недостачам, излишкам, неплатежным и сомнительным наличным деньгам, определен в
    договоре корреспондентского банковского счета, заключенном между банками.
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:33
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p34:
  short: НБРК №231, пункт 34
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 34
  url: https://adilet.zan.kz/rus/docs/V1900019680#z153
  quote: 34. Обмен наличных денег одного номинала на другие по требованию клиента допускается после осуществления выдачи клиенту
    подготовленных наличных денег.
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:34
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p35:
  short: НБРК №231, пункт 35
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 35
  url: https://adilet.zan.kz/rus/docs/V1900019680#z154
  quote: 35. Клиент пересчитывает полученные наличные деньги, не отходя от кассы, или в помещении для пересчета наличных денег
    клиентами в присутствии кассового работника или контролирующего работника. При выявлении в результате пересчета недостачи
    или излишков наличных денег кассовым работником или контролирующим работником составляется акт недостачи или излишка по
    форме, определенной банком самостоятельно. Заявление клиента о недостаче, выявлении неплатежных, сомнительных наличных
    денег удовлетворению не подлежат, если они не были пересчитаны им, не отходя от кассы банка, под наблюдением кассового
    работника, выдавшего наличные деньги или контролирующего работника.
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:35
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p37:
  short: НБРК №231, пункт 37
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 37
  url: https://adilet.zan.kz/rus/docs/V1900019680#z157
  quote: 37. Остаток наличных денег после рабочего дня кассовый работник пересчитывает, сортирует, упаковывает и сдает с расходными
    кассовыми документами заведующему кассой или лицу, осуществляющему функции заведующего кассой, для проверки подшивки в
    кассовые документы дня в порядке, установленном внутренними документами банка.
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:37
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p38:
  short: НБРК №231, пункт 38
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 38
  url: https://adilet.zan.kz/rus/docs/V1900019680#z158
  quote: 38. Кассовые операции по выдаче наличных денег клиента подразделениям инкассации банка или инкассаторской организации
    осуществляется кассовым работником на основании препроводительного документа, соответствующего требованиям пункта 106
    Правил.
  heading: Параграф 3. Порядок осуществления кассовых операций по выдаче, размену и обмену наличных денег
  spec: V1900019680:38
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p41:
  short: НБРК №231, пункт 41
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 41
  url: https://adilet.zan.kz/rus/docs/V1900019680#z162
  quote: 41. Банки осуществляют кассовые операции по пересчету и сортировке наличных денег на оборудовании, имеющем функцию
    проверки не менее двух машиночитаемых защитных признаков банкнот и монет, установленных Правилами определения платежности
    банкнот и монет национальной валюты Республики Казахстан, утвержденными постановлением Правления Национального Банка Республики
    Казахстан от 29 ноября 2017 года № 230, зарегистрированным в Реестре государственной регистрации нормативных правовых
    актов под номером № 16120 (далее – Правила № 230).
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:41
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p42:
  short: НБРК №231, пункт 42
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 42
  url: https://adilet.zan.kz/rus/docs/V1900019680#z163
  quote: 42. Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником в присутствии
    контролирующего работника, за исключением случаев совершения кассовых операций по приему и выдаче наличных денег клиенту.
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:42
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p43:
  short: НБРК №231, пункт 43
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 43
  url: https://adilet.zan.kz/rus/docs/V1900019680#z164
  quote: '43. Сортировка наличных денег осуществляется по номиналам и по степени износа. Банкноты сортируются по номиналам,
    на годные к обращению, ветхие, изъятые и (или) изымаемые из обращения.

    Банк осуществляет дополнительно сортировку банкнот по годам выпуска для сдачи в территориальный филиал Национального Банка.

    Монеты сортируются по номиналам, на годные к обращению, дефектные (поврежденные), изъятые и (или) изымаемые из обращения.'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:43
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p45:
  short: НБРК №231, пункт 45
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 45
  url: https://adilet.zan.kz/rus/docs/V1900019680#z168
  quote: 45. Банкноты и монеты, годные к обращению, упаковываются отдельно от ветхих банкнот и дефектных (поврежденных) монет,
    а также от изъятых и (или) изымаемых из обращения банкнот и монет.
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:45
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p46:
  short: НБРК №231, пункт 46
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 46
  url: https://adilet.zan.kz/rus/docs/V1900019680#z169
  quote: '46. Каждые сто листов банкнот одного номинала укладываются лицевой стороной вверх в одну сторону, формируются в
    корешки и обандероливаются крестообразно или одной поперечной бандеролью в зависимости от способа упаковки корешков в
    пачку.

    На бандероли указываются номинал, сумма, дата формирования, штамп или иной код, а также подпись (подписи) кассового работника
    (бригады кассовых работников), производившего (производивших) пересчет, сортировку и упаковку банкнот. На бандеролях ветхих
    банкнот дополнительно проставляется штамп "Ветхие".'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:46
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p47:
  short: НБРК №231, пункт 47
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 47
  url: https://adilet.zan.kz/rus/docs/V1900019680#z171
  quote: '47. Каждые десять корешков банкнот одного номинала упаковываются в пачку по одной тысяче листов, которые снабжаются
    верхней и нижней накладками.

    На верхней накладке к пачке с банкнотами указываются наименование, банковский идентификационный код банка, номинал, сумма,
    количество банкнот, дата упаковки, штамп или код, а также подпись (подписи) кассового работника (бригады кассовых работников),
    производившего (производивших) пересчет, сортировку и упаковку банкнот.

    На верхней накладке пачки с ветхими банкнотами дополнительно проставляется штамп "Ветхие".'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:47
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p48:
  short: НБРК №231, пункт 48
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 48
  url: https://adilet.zan.kz/rus/docs/V1900019680#z174
  quote: '48. Сформированная пачка банкнот обвязывается шпагатом без узлов и надрывов, крестообразно двойной вязкой на четыре
    глухих узла, на концах шпагата кассовым работником банка накладывается пломба и пломбируется пломбиратором с оттиском
    кода кассового работника (бригады кассовых работников), производившего (производивших) пересчет, сортировку и упаковку
    банкнот.

    При упаковке пачек с банкнотами в полиэтиленовый пакет, полиэтиленовый пакет заваривается на вакуумном упаковщике, на
    заварочном шве проставляется банковский идентификационный код и код кассового работника (бригады кассовых работников),
    производившего (производивших) пересчет, сортировку и упаковку банкнот.'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:48
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p49:
  short: НБРК №231, пункт 49
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 49
  url: https://adilet.zan.kz/rus/docs/V1900019680#z176
  quote: '49. Оставшиеся после пересчета и сортировки банкнот листы, неполные корешки, неполные пачки передаются для объединения
    и упаковки кассовым работникам.

    Кассовые работники полистно пересчитывают принятые для объединения банкноты и формируют из них полные корешки и пачки
    банкнот.

    Оставшиеся банкноты упаковываются в пачку, состоящую из банкнот разных номиналов. Банкноты в пачке обандероливаются одной
    общей бандеролью без оформления реквизитов, предусмотренных частью второй пункта 46 Правил.'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:49
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p50:
  short: НБРК №231, пункт 50
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 50
  url: https://adilet.zan.kz/rus/docs/V1900019680#z179
  quote: 50. Отдельные корешки с банкнотами упаковываются в неполные пачки одного номинала или в пачки с банкнотами разного
    номинала, в количестве не более десяти корешков в пачке, которая снабжается верхней и нижней накладками. На верхней накладке
    указываются наименование, банковский идентификационный код банка, количество и сумма банкнот каждого номинала, общая сумма
    вложенных банкнот, дата упаковки, штамп или код, а также подпись кассового работника, производившего пересчет, сортировку
    и упаковку банкнот. На пачках, состоящих из корешков или листов разного номинала, дополнительно проставляется штамп "Сборная".
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:50
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p51:
  short: НБРК №231, пункт 51
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 51
  url: https://adilet.zan.kz/rus/docs/V1900019680#z503
  quote: '51. Пересчитанные и отсортированные по номиналам монеты кассовый работник упаковывает в мешки, пакеты, тюбики.

    Количество монет, упаковываемых в пакеты или тюбики, устанавливается банками самостоятельно. Пакеты и тюбики подлежат
    упаковке в мешки без наружных швов и повреждений.

    Сумма монет, упаковываемых в один мешок, устанавливается по номиналу в количестве:

    1 теңге – 4000 (четыре тысячи) штук;

    2 теңге – 4000 (четыре тысячи) штук;

    5 теңге – 3000 (три тысячи) штук;

    10 теңге – 2500 (две тысячи пятьсот) штук;

    20 теңге – 2500 (две тысячи пятьсот) штук;

    50 теңге – 1500 (одна тысяча пятьсот) штук;

    100 теңге – 1000 (одна тысяча) штук;

    200 теңге – 750 (семьсот пятьдесят) штук.

    Сноска. Пункт 51 – в редакции постановления Правления Национального Банка РК от 30.06.2026

    № 78

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:51
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p52:
  short: НБРК №231, пункт 52
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 52
  url: https://adilet.zan.kz/rus/docs/V1900019680#z190
  quote: 52. Горловина мешка прошивается вместе с ярлыком и плотно завязывается шпагатом без узлов и надрывов. Концы шпагата
    завязываются глухим узлом, поверх которого накладывается пломба и пломбируется пломбиратором с оттиском кода кассового
    работника (бригады кассовых работников), производившего (производивших) пересчет, сортировку и упаковку монет.
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:52
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p53:
  short: НБРК №231, пункт 53
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 53
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 53. На прикрепленном к мешку ярлыке указываются наименование, банковский идентификационный код банка, номинал, сумма,
    количество монет, дата упаковки, штамп или код, а также подпись (подписи) кассового работника (бригады кассовых работников),
    производившего (производивших) пересчет, сортировку и упаковку монет. На ярлыках, прикрепляемых к мешкам с дефектными
    (поврежденными) монетами, дополнительно проставляется штамп "Дефектные". На ярлыках, прикрепляемых к сборным мешкам с
    монетами, дополнительно указывается номинал, количество и сумма монет каждого номинала, общая сумма вложения и проставляется
    штамп "Сборный".
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:53
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p55:
  short: НБРК №231, пункт 55
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 55
  url: https://adilet.zan.kz/rus/docs/V1900019680#z193
  quote: '55. Для загрузки наличных денег в устройства, функционирующие в автоматическом режиме, наличные деньги упаковываются
    в кассеты полистно, кассеты закрываются на ключ и пломбируются способом, обеспечивающим сохранность наличных денег и исключающим
    возможность несанкционированного вскрытия кассет. Выбор видов пломб (бумажные пломбы, пластиковые номерные пломбы, пломбы
    наклейки, пломбы с красящими веществами и т.д.) для опечатывания кассет осуществляется банками самостоятельно.

    Сноска. Пункт 55 – в редакции постановления Правления Национального Банка РК от 10.11.2025

    № 71

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 4. Порядок осуществления кассовых операций по пересчету, сортировке и упаковке наличных денег
  spec: V1900019680:55
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p57:
  short: НБРК №231, пункт 57
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 57
  url: https://adilet.zan.kz/rus/docs/V1900019680#z196
  quote: 57. Банк при осуществлении кассовых операций проверяет платежность банкнот и монет в соответствии с Правилами № 230.
  heading: Параграф 5. Порядок работы с сомнительными, неплатежными, имеющими признаки подделки наличными деньгами
  spec: V1900019680:57
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
