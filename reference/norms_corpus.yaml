    года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
  clause: пункт 1
  url: https://adilet.zan.kz/rus/docs/V2400034348#z18
  quote: 1. Настоящая Инструкция по организации антитеррористической защиты расчетно-кассовых отделений банков второго уровня,
    уязвимых в террористическом отношении, (далее – Инструкция) разработана в соответствии с пунктом 1 статьи 10-2 Закона
    Республики Казахстан "О противодействии терроризму".
  heading: Глава 1. Общие положения
  spec: V2400034348:1
  source_sha256: 6c50928b202602e19988795c66abf9ac23b57da8251fe212202cdd3ef9c1a772
  source: corpus 2026-10-17
n21_p14:
  short: АРРФР №21, пункт 14
  document: Об утверждении Инструкции по организации антитеррористической защиты расчетно-кассовых отделений банков второго
    уровня, уязвимых в террористическом отношении
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2024
    года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
  clause: пункт 14
  url: https://adilet.zan.kz/rus/docs/V2400034348#z63
  quote: '14. Пропускной режим предназначен для того, чтобы исключить:

    1) проникновение в расчетно-кассовое отделение или его части (зоны) посторонних лиц с противоправными намерениями;

    2) пронос (ввоз) и вынос (вывоз) с территории расчетно-кассового отделения предметов и веществ легковоспламеняющихся,
    отравляющих веществ, огнестрельного оружия и предметов, использование которых представляет опасность для расчетно-кассового
    отделения и находящихся лиц. Перечень предметов, запрещенных к проносу в расчетно-кассовое отделение, уязвимое в террористическом
    отношении, определен в приложении 2 к Инструкции.'
  heading: Глава 2. Требования к организации пропускного режима в рассчетно-кассовых отделениях
  spec: V2400034348:14
  source_sha256: 6c50928b202602e19988795c66abf9ac23b57da8251fe212202cdd3ef9c1a772
  source: corpus 2026-10-17
n21_p15:
  short: АРРФР №21, пункт 15
  document: Об утверждении Инструкции по организации антитеррористической защиты расчетно-кассовых отделений банков второго
    уровня, уязвимых в террористическом отношении
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2024
    года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
  clause: пункт 15
  url: https://adilet.zan.kz/rus/docs/V2400034348#z66
  quote: '15. Пропускной режим предусматривает:

    1) организацию пункта и (или) поста охраны и (или) пропуска с функцией контроля на входах (выходах) в расчетно-кассовое
    отделение;

    2) порядок пропуска в расчетно-кассовое отделение и (или) его части (зоны) работников и посетителей;

    3) зонирование расчетно-кассового отделения (устанавливается не менее двух основных зон: первая зона – здания, территории,
    помещения, доступ в которые работникам, посетителям не ограничен; вторая зона – здания и (или) помещения доступ в которые
    разрешен работникам и посетителям согласно порядку организации пропускного режима рассчетно-кассового отделения);

    4) определение перечня лиц актом руководителя расчетно-кассового отделения, имеющих право беспрепятственного допуска в
    расчетно-кассовое отделение;

    5) определение перечня лиц актом руководителя расчетно-кассового отделения, допускаемых в зоны ограниченного доступа в
    расчетно-кассовое отделение;

    6) введение и (или) организацию пропускной системы, способной обеспечить контроль управления допуском работников и посетителей
    в расчетно-кассовое отделение и отдельные зоны согласно порядку организации пропускного режима в рассчетно-кассовом отделении;

    7) определение перечня предметов, запрещенных к проносу в расчетно-кассовое отделение;

    8) охрану критических зон расчетно-кассового отделения;

    9) контроль за местами возможного массового пребывания людей в расчетно-кассовом отделении.'
  heading: Глава 2. Требования к организации пропускного режима в рассчетно-кассовых отделениях
  spec: V2400034348:15
  source_sha256: 6c50928b202602e19988795c66abf9ac23b57da8251fe212202cdd3ef9c1a772
  source: corpus 2026-10-17
n21_p18:
  short: АРРФР №21, пункт 18
  document: Об утверждении Инструкции по организации антитеррористической защиты расчетно-кассовых отделений банков второго
    уровня, уязвимых в террористическом отношении
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2024
    года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
  clause: пункт 18
  url: https://adilet.zan.kz/rus/docs/V2400034348#z85
  quote: '18. В целях исключения проноса в расчетно-кассовое отделение взрывчатых, легковоспламеняющихся, отравляющих веществ,
    огнестрельного оружия и предметов, использование которых представляет опасность, в рассчетно-кассовом отделении проводится
    досмотр работников, посетителей и транспортных средств расчетно-кассового отделения с использованием специальных технических
    средств на наличие у них указанных веществ, оружия и предметов. Досмотр осуществляется путем предъявления требования на
    визуальный осмотр предметов, предназначенных для проноса, а также прохождение через стационарный металлодетектор и обследование
    ручным металлодетектором.

    При выявлении визуальным осмотром и (или) в результате реагирования металлодетектора запрещенных к проносу предметов,
    предусмотренных приложением 2 к Инструкции, информируются территориальные органы внутренних дел и национальной безопасности
    Республики Казахстан.'
  heading: Глава 2. Требования к организации пропускного режима в рассчетно-кассовых отделениях
  spec: V2400034348:18
  source_sha256: 6c50928b202602e19988795c66abf9ac23b57da8251fe212202cdd3ef9c1a772
  source: corpus 2026-10-17
n21_p19:
  short: АРРФР №21, пункт 19
  document: Об утверждении Инструкции по организации антитеррористической защиты расчетно-кассовых отделений банков второго
    уровня, уязвимых в террористическом отношении
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2024
    года № 21. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
  clause: пункт 19
  url: https://adilet.zan.kz/rus/docs/V2400034348#z87
  quote: '19. На основании порядка организации пропускного режима расчетно-кассового отделения субъект охранной деятельности
    разрабатывает должностную инструкцию сотрудника охраны, которая в обязательном порядке предусматривает:

    1) проверку документов и характер ввозимых (вывозимых) грузов при пропуске на территорию (с территории) расчетно-кассового
    отделения;

    2) проверку документов и цели прибытия лиц из организаций, посещающих расчетно-кассовое отделение по служебным делам,
    а также осуществление соответствующих записей в книге посетителей расчетно-кассового отделения;

    3) регулярный обход (согласно графику обхода) территории на предмет проверки внутренних помещений, осмотра периметра расчетно-кассового
    отделения и обследование ограждений на предмет их повреждений, выявления посторонних, взрывоопасных и подозрительных предметов;

    4) немедленный доклад руководителю расчетно-кассового отделения и своему непосредственному руководителю субъекта охранной
    деятельности обо всех обнаруженных нарушениях;

    5) действия сотрудников охраны расчетно-кассового отделения исходя из оснащенности расчетно-кассового отделения при выявлении
    лиц, пытающихся в нарушение порядка пропускного режима, установленного в рассчетно-кассовом отделении, проникнуть на территорию
    расчетно-кассового отделения и (или) совершить противоправные действия в отношении работников расчетно-кассового отделения,
    при обнаружении неизвестного автотранспорта, длительное время припаркованного в непосредственной близости у периметра
    расчетно-кассового отделения.'
  heading: Глава 2. Требования к организации пропускного режима в рассчетно-кассовых отделениях
  spec: V2400034348:19
  source_sha256: 6c50928b202602e19988795c66abf9ac23b57da8251fe212202cdd3ef9c1a772
  source: corpus 2026-10-17
n53_p116:
  short: АРРФР №53, пункт 116
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 116
  url: https://adilet.zan.kz/rus/docs/V2600038336#z347
  quote: '116. Используемое банком, организацией антивирусное программное обеспечение соответствует следующим требованиям:

    1) обнаружение вирусов на основе известных сигнатур;

    2) обнаружение вирусов на основе эвристического анализа (поиска характерных для вирусов команд и поведенческого анализа);

    3) сканирование сменных носителей при подключении;

    4) запуск сканирования и обновления антивирусной базы по расписанию;

    5) наличие централизованной консоли администрирования и мониторинга;

    6) блокирование для пользователя возможности прерывания функционирования антивирусного программного обеспечения, а также
    процессов обновления антивирусного программного обеспечения и плановой проверки на отсутствие вирусов;

    7) для виртуальной среды – использование антивирусным программным обеспечением встроенных функций безопасности виртуальных
    сред, при отсутствии таких возможностей – подтверждение производителя о тестировании антивирусного программного обеспечения
    в виртуальных средах, используемых банком, организацией;

    8) для мобильных устройств и иных устройств, используемых вне периметра защиты банка, организации, использование антивирусного
    программного обеспечения со встроенной функцией межсетевого экранирования.'
  heading: Параграф 9. Требования к процессу обеспечения антивирусной защиты
  spec: V2600038336:116
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p18:
  short: АРРФР №53, пункт 18
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 18
  url: https://adilet.zan.kz/rus/docs/V2600038336#z113
  quote: '18. Подразделение по безопасности осуществляет следующие функции:

    1) реализует меры физической и технической безопасности в банке, организации, в том числе организует пропускной и внутриобъектовый
    режим;

    2) проводит профилактические мероприятия, направленные на минимизацию рисков возникновения угроз информационной безопасности
    при приеме на работу и увольнении работников банка, организации.'
  heading: Глава 2. Требования к организации системы управления информационной безопасностью
