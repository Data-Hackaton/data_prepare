    с активной сессией в системе, без присмотра;
  requirement: Аналогичное требование о выходе и присмотре за активной сессией имело номер 35(3).
  limits: Пользователь Онлайн-платформы; историческая редакция. Не складывать с 2025 как независимое обязательство. Дата съёмки
    неизвестна.
