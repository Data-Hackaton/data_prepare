  clause: пункт 4
  url: https://adilet.zan.kz/rus/docs/V1500010889#z71
  quote: 4. Электроустановки необходимо содержать в технически исправном состоянии, обеспечивающем безопасные условия труда.
  heading: Глава 1. Общие положения
  spec: V1500010889:4
  source_sha256: cc739b628f1684ea10aba7e4ba865e80fcc01133f635acabeebd8872fa7f6248
  source: corpus 2026-10-17
n246_p3:
  short: Минэнерго №246 от 30.03.2015, пункт 3
  document: Об утверждении Правил технической эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 30 марта 2015 года № 246. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 6 мая 2015 года № 10949.
  clause: пункт 3
  url: https://adilet.zan.kz/rus/docs/V1500010949#z52
  quote: '3. Эксплуатацию электроустановок потребителей осуществляет подготовленный электротехнический персонал.

    В зависимости от объема и сложности работ по эксплуатации электроустановок у потребителей создается энергослужба, укомплектованная
    соответствующим по квалификации электротехническим персоналом. Допускается проводить эксплуатацию электроустановок по
    договору со специализированной организацией, осуществляющей деятельность по эксплуатации электроустановок (далее – специализированная
    организация).'
  heading: Глава 2. Организация технической эксплуатации электроустановок потребителей
  spec: V1500010949:3
  source_sha256: 7f1ae89fa2c006d40058b787ff86c60fd10055e189e9bc6da3184444ad3c01f0
  source: corpus 2026-10-17
n246_p4:
  short: Минэнерго №246 от 30.03.2015, пункт 4
  document: Об утверждении Правил технической эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 30 марта 2015 года № 246. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 6 мая 2015 года № 10949.
  clause: пункт 4
  url: https://adilet.zan.kz/rus/docs/V1500010949#z53
  quote: '4. Для непосредственного выполнения обязанностей по организации эксплуатации электроустановок руководитель юридического
    лица соответствующим документом назначает ответственного за эксплуатацию электроустановок (далее – ответственный за электроустановки)
    и его заместителя, а физические лица – владельцы электроустановок напряжением выше 1000 вольт (далее – В) заключают договора
    на обслуживание электроустановок со специализированными организациями на которых возлагается ответственность за безопасную
    эксплуатацию.

    Физическим лицам – владельцам электроустановок напряжением ниже 1000 В ответственные за электроустановки не назначаются,
    эксплуатация электроустановок осуществляется в соответствии с действующим законодательством Республики Казахстан в области
    электроэнергетики, за исключением владельцев электрозаярдных станций, которые вне зависимости от класса напряжения электроустановок
    заключают договора на обслуживание электроустановок со специализированными организациями на которых возлагается ответственность
    за безопасную эксплуатацию.

    У потребителей, установленная мощность электроустановок которых не превышает 10 киловольтампер (далее – кВА), работник,
    замещающий ответственного за электроустановки, не назначается.

    Ответственный за электроустановки и его заместитель назначаются из числа руководителей и специалистов потребителя.

    При наличии у потребителя должности главного энергетика обязанности ответственного за электроустановки возлагаются на
    него.

    Сноска. Пункт 4 с изменением, внесенным приказом Министра энергетики РК от 17.01.2025

    № 22-н/қ

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 2. Организация технической эксплуатации электроустановок потребителей
  spec: V1500010949:4
  source_sha256: 7f1ae89fa2c006d40058b787ff86c60fd10055e189e9bc6da3184444ad3c01f0
  source: corpus 2026-10-17
n246_p7:
  short: Минэнерго №246 от 30.03.2015, пункт 7
  document: Об утверждении Правил технической эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 30 марта 2015 года № 246. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 6 мая 2015 года № 10949.
  clause: пункт 7
  url: https://adilet.zan.kz/rus/docs/V1500010949#z56
  quote: '7. По представлению ответственного за электроустановками руководитель потребителя назначает ответственных за электроустановками
    структурных подразделений (филиалов).

    Взаимоотношения и распределение обязанностей между ответственными за электроустановками структурных подразделений и ответственным
    за электроустановки потребителя отражаются в их должностных инструкциях.'
  heading: Глава 2. Организация технической эксплуатации электроустановок потребителей
  spec: V1500010949:7
  source_sha256: 7f1ae89fa2c006d40058b787ff86c60fd10055e189e9bc6da3184444ad3c01f0
  source: corpus 2026-10-17
