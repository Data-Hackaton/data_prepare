  act: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 27 февраля 2020 года № 20075.
  clause: пункт 18
  url: https://adilet.zan.kz/rus/docs/V2000020075#z79
