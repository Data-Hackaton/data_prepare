n14_p18:
  short: НБРК №14, пункт 18
  document: Об утверждении Правил организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
    Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация
    банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании
