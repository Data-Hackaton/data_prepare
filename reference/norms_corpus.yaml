n231_p101:
  short: НБРК №231, пункт 101
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 101
  url: https://adilet.zan.kz/rus/docs/V1900019680#z273
  quote: '101. Руководитель или дежурный инкассатор подразделения инкассации банка, инкассаторской организации перед выездом
    бригады работников подразделения инкассации банка, инкассаторской организации по маршруту инкассации проводит инструктаж
    для выполнения задания и выдает:

    1) инкассатору-сборщику:

    доверенность по форме согласно приложению 4 к Правилам;

    явочную карточку по форме согласно приложению 2 к Правилам;

    служебное удостоверение работника подразделения инкассации банка, инкассаторской организации;

    штамп банка, инкассаторской организации с обозначением номера маршрута;

    2) старшему бригады:

    порожние сумки;

    служебное удостоверение работника подразделения инкассации банка, инкассаторской организации.

    После окончания маршрута инкассации бригада работников подразделения инкассации банка, инкассаторской организации возвращает
    документы, указанные в настоящем пункте, руководителю подразделения инкассации банка, инкассаторской организации или дежурному
    инкассатору.'
  heading: Параграф 1. Организация осуществления операций по инкассации банкнот, монет и ценностей
  spec: V1900019680:101
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p103:
  short: НБРК №231, пункт 103
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 103
  url: https://adilet.zan.kz/rus/docs/V1900019680#z284
  quote: 103. Бригада работников подразделения инкассации банка, инкассаторской организации обеспечивается экипировкой, индивидуальными
    средствами защиты, в том числе бронежилетами, касками (шлемами), а также служебным оружием.
  heading: Параграф 1. Организация осуществления операций по инкассации банкнот, монет и ценностей
  spec: V1900019680:103
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p105:
  short: НБРК №231, пункт 105
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 105
  url: https://adilet.zan.kz/rus/docs/V1900019680#z287
  quote: 105. Банкноты, монеты и ценности, подлежащие инкассации, упаковываются в сумки с составлением препроводительного
    документа.
  heading: Параграф 2. Порядок осуществления приема, сбора, доставки и сдачи банкнот, монет и ценностей
  spec: V1900019680:105
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
