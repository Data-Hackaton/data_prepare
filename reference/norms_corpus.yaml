n927_p17:
  short: МЗСР №927 от 30.11.2015, пункт 17
  document: Об утверждении Правил разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 ноября 2015 года № 927. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12534.
  clause: пункт 17
  url: https://adilet.zan.kz/rus/docs/V1500012534#z28
  quote: 17. Инструкции утверждаются работодателем после согласования со службой безопасности и охраны труда или ответственным
    лицом и другими заинтересованными структурными подразделениями, должностными лицами и представителями работников.
  heading: 4. Утверждение и пересмотр инструкции
  spec: V1500012534:17
  source_sha256: 7c7ea9a4ea03111f70c4bf67956cdb84412d3bd81b47c700c99ce9b08f6fe71e
  source: corpus 2026-10-17
n927_p19:
  short: МЗСР №927 от 30.11.2015, пункт 19
  document: Об утверждении Правил разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 ноября 2015 года № 927. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12534.
  clause: пункт 19
  url: https://adilet.zan.kz/rus/docs/V1500012534#z30
  quote: '19. Пересмотр Инструкции по профессиям или видам работ проводится не реже одного раза в 3 года.

    Инструкции подлежат пересмотру досрочно в следующих случаях:

    1) при изменении законов, государственных стандартов и нормативных правовых актов Республики Казахстан;

    2) при внедрении новой техники и технологии;

    3) по результатам расследования несчастных случаев на производстве, аварий и катастроф.

    По результатам пересмотра определяется необходимость внесения изменений и дополнений в Инструкции.

    Сноска. Пункт 19 с изменением, внесенным приказом Министра труда и социальной защиты населения РК от 15.06.2026

    № 242

    (вводится в действие с 01.07.2026).'
  heading: 4. Утверждение и пересмотр инструкции
  spec: V1500012534:19
  source_sha256: 7c7ea9a4ea03111f70c4bf67956cdb84412d3bd81b47c700c99ce9b08f6fe71e
  source: corpus 2026-10-17
n927_p2:
  short: МЗСР №927 от 30.11.2015, пункт 2
  document: Об утверждении Правил разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 ноября 2015 года № 927. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12534.
  clause: пункт 2
  url: https://adilet.zan.kz/rus/docs/V1500012534#z10
  quote: 2. Инструкция по безопасности и охране труда работодателя (далее – Инструкция) представляет собой акт работодателя,
    детализирующий применение законодательства в области безопасности и охраны труда при выполнении работ в производственных
    помещениях, на территории предприятия, строительных площадках, транспортных средствах и в иных местах организации, где
    производятся эти работы или выполняются служебные обязанности.
  heading: Правила разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем 1. Общие положения
  spec: V1500012534:2
  source_sha256: 7c7ea9a4ea03111f70c4bf67956cdb84412d3bd81b47c700c99ce9b08f6fe71e
  source: corpus 2026-10-17
n927_p20:
  short: МЗСР №927 от 30.11.2015, пункт 20
  document: Об утверждении Правил разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 ноября 2015 года № 927. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12534.
  clause: пункт 20
  url: https://adilet.zan.kz/rus/docs/V1500012534#z31
  quote: 20. Если в течение установленного пунктом 19 настоящих Правил срока условия труда работников не изменились, то действие
    Инструкции продлевается на следующий срок, о чем делается запись на первой странице Инструкции (ставится штамп "Пересмотрено",
    ФИО (при его наличии) дата и подпись лица, ответственного за пересмотр Инструкции).
  heading: 4. Утверждение и пересмотр инструкции
  spec: V1500012534:20
  source_sha256: 7c7ea9a4ea03111f70c4bf67956cdb84412d3bd81b47c700c99ce9b08f6fe71e
  source: corpus 2026-10-17
n927_p3:
  short: МЗСР №927 от 30.11.2015, пункт 3
  document: Об утверждении Правил разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 ноября 2015 года № 927. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12534.
  clause: пункт 3
  url: https://adilet.zan.kz/rus/docs/V1500012534#z12
  quote: '3. Разработка Инструкции осуществляется работодателем как для каждой профессии на участке, в цехе, службе, лаборатории
    и организации в целом, так и на отдельные виды работ (работа на высоте, испытания) и рабочие места, согласно перечню,
    который составляется службой безопасности и охраны труда или специалистом по безопасности и охране труда (далее - ответственное
    лицо) при участии руководителей заинтересованных структурных подразделений работодателя и представителей работников.

    Разработка Инструкции осуществляется также специалистами научных учреждений и учебных центров в области безопасности и
    охраны труда на договорной основе по заявке работодателя (организации).

    Сноска. Пункт 3 с изменением, внесенным приказом Министра труда и социальной защиты населения РК от 30.03.2023

    № 98

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: 2. Разработка инструкции по безопасности и охране труда
  spec: V1500012534:3
  source_sha256: 7c7ea9a4ea03111f70c4bf67956cdb84412d3bd81b47c700c99ce9b08f6fe71e
  source: corpus 2026-10-17
n927_p5:
  short: МЗСР №927 от 30.11.2015, пункт 5
  document: Об утверждении Правил разработки, утверждения и пересмотра инструкции по безопасности и охране труда работодателем
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 ноября 2015 года № 927. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12534.
  clause: пункт 5
  url: https://adilet.zan.kz/rus/docs/V1500012534#z14
  quote: 5. Инструкция разрабатывается на основе нормативов по безопасности и охране труда с учетом требований безопасности,
    изложенных в эксплуатационной и ремонтной документации заводов-изготовителей оборудования, а также в технологической документации
    работодателя и условий производства.
  heading: 2. Разработка инструкции по безопасности и охране труда
  spec: V1500012534:5
  source_sha256: 7c7ea9a4ea03111f70c4bf67956cdb84412d3bd81b47c700c99ce9b08f6fe71e
  source: corpus 2026-10-17
n1019_p4:
  short: МЗСР №1019 от 25.12.2015, пункт 4
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 4
  url: https://adilet.zan.kz/rus/docs/V1500012665#z107
  quote: 4. Работники, принятые на работу, а также переводимые на другую работу, проходят обучение с последующей проверкой
    знаний по вопросам безопасности и охраны труда в сроки, установленные работодателем, но не позднее одного месяца после
    заключения трудового договора или изменения его условий.
  heading: Глава 1. Общие положения
  spec: V1500012665:4
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p5:
  short: МЗСР №1019 от 25.12.2015, пункт 5
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 5
  url: https://adilet.zan.kz/rus/docs/V1500012665#z109
  quote: 5. Очередное обучение и проверка знаний у работников по безопасности и охране труда осуществляется не реже одного
    раза в год.
  heading: Глава 2. Порядок и сроки проведения обучения и проверки знаний в области безопасности и охраны труда работников,
    за исключением руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:5
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p56:
  short: МЗСР №1019 от 25.12.2015, пункт 56
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 56
  url: https://adilet.zan.kz/rus/docs/V1500012665#z238
  quote: '56. Вводный инструктаж по безопасности и охране труда проводят со вновь принимаемыми на работу работниками, независимо
    от их образования, стажа работы по данной профессии или должности.

    В целях безопасности труда вводный и первичный инструктаж по безопасности и охране труда проводят с временными работниками,
    командированными, учащимися и студентами, прибывшими на производственное обучение или практику.

    Также вводный инструктаж проводится посетителям, при посещении ими производственных площадок и работникам подрядных организаций,
    производящих работы на территории организаций, эксплуатирующих опасные производственные объекты.'
  heading: Глава 4. Порядок и сроки проведения инструктирования по вопросам безопасности и охраны труда работников, руководителей
    и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:56
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p6:
  short: МЗСР №1019 от 25.12.2015, пункт 6
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 6
  url: https://adilet.zan.kz/rus/docs/V1500012665#z110
  quote: '6. Работники, не прошедшие обучение и проверку знаний по безопасности и охраны труда, к работе не допускаются.

    При перемещении работника на другое рабочее место либо в другое структурное подразделение в пределах профессии (должности)
    повторное обучение и проверка знаний требований безопасности и охраны труда не требуются в случае, если сохраняются условия
    труда работника.'
  heading: Глава 2. Порядок и сроки проведения обучения и проверки знаний в области безопасности и охраны труда работников,
    за исключением руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:6
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p61:
  short: МЗСР №1019 от 25.12.2015, пункт 61
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
