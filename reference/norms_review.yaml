n231_p101:
  short: Правила №231, п.101
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.101, пп.1–2 и последний абзац
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '101. Руководитель или дежурный инкассатор подразделения инкассации банка, инкассаторской организации перед выездом
    бригады работников подразделения инкассации банка, инкассаторской организации по маршруту инкассации проводит инструктаж
    для выполнения задания и выдает:

    1) инкассатору-сборщику:

    доверенность по форме согласно приложению 4 к Правилам;

    явочную карточку по форме согласно приложению 2 к Правилам;

    служебное удостоверение работника подразделения инкассации банка, инкассаторской организации;

    штамп банка, инкассаторской организации с обозначением номера маршрута;

    2) старшему бригады:

    порожние сумки;

    служебное удостоверение работника подразделения инкассации банка, инкассаторской организации.

    После окончания маршрута инкассации бригада работников подразделения инкассации банка, инкассаторской организации возвращает
    документы, указанные в настоящем пункте, руководителю подразделения инкассации банка, инкассаторской организации или дежурному
    инкассатору.'
  requirement: Руководитель/дежурный инкассатор до выезда инструктирует бригаду и выдаёт документы/принадлежности; после маршрута
    документы возвращаются.
  limits: Адресат — подразделение инкассации перед выездом/после маршрута. Пункт не требует от кассира при каждой сумке проверить
    удостоверение и не доказывает наличие/отсутствие полномочий по карточке в кадре.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p12:
  short: Правила №231, п.12
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.12, абз.1–2
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '12. Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке,
    установленном внутренними документами банка.

    Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих
    функции фото и видео фиксации.'
  requirement: Личные вещи, деньги и ценности работников хранят вне кассового узла; допускается внос лекарств, медицинских
    изделий и средств связи без фото/видео.
  limits: Нужны статус личной вещи и кассового узла. В пункте нет отдельного буквального запрета питья/еды. Карман внутри
    узла не является хранением вне него; средство связи без фото/видео прямо допускается.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p14:
  short: Правила №231, п.14
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.14
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 14. Банк обеспечивает осуществление кассовых операций кассовыми работниками, лицами, ответственными за сохранность
    наличных денег, в соответствии с их должностными обязанностями, а также распределение их должностных обязанностей, исключающее
    конфликт интересов и условия его возникновения, совершение хищения наличных денег и ценностей и других противоправных
    действий.
  requirement: Банк обеспечивает выполнение кассовых операций работниками согласно должностным обязанностям и распределяет
    обязанности без конфликта интересов и условий хищения.
  limits: Нужны должностные документы и роли. Вход и работа за столом не доказывают отсутствие полномочий. Это не пункт о
    закрытии двери.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p19:
  short: Правила №231, п.19
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.19, пп.1–6; идентификация — пп.1; документы — пп.3–6
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '19. Кассовый работник банка осуществляет следующие действия:

    1) проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо
    данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;

    2) принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность
    наличных денег в соответствии с пунктами 57 и 58 Правил;

    3) проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися
    образцами подписей;

    4) сверяет соответствие суммы, указанной в приходном кассовом документе, с общей суммой фактически принятых наличных денег;

    5) подписывает все экземпляры приходного кассового документа, проставляет штамп кассового работника банка на всех экземплярах
    приходного кассового документа;

    6) выдает клиенту документ, подтверждающий проведение кассовой операции по приему наличных денег.'
  requirement: При приёме денег кассир визуально идентифицирует клиента по документу либо данным из сервиса цифровых документов,
    пересчитывает/проверяет деньги и выполняет документальные действия пп.3–6.
  limits: 'Нет видимого физического ID — не равно нет идентификации: цифровые данные могли быть получены ранее. Карточка не
    доказывает удостоверение. Нечитаемые/невидимые бумаги не устанавливают отсутствие документации или выдачи подтверждения;
    каждый подпункт оценивается отдельно.'
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p20:
  short: Правила №231, п.20
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: 'п.20: абз.1 — клиент; абз.2 — ранее принятые деньги'
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '20. Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.

    На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в
    специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для
    хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).'
  requirement: Приём и пересчёт — в присутствии клиента. Ранее принятые деньги хранят в специальных устройствах, закрывающихся
    на ключ.
  limits: Нужно различить приёмную операцию, деньги текущего и прежнего клиента. Нет буквального общего запрета двум посетителям
    находиться у кассы, отдельного постоянного режима дверцы сейфа или обязательного изъятия ключа.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p24:
  short: Правила №231, п.24
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.24, пп.1–4
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '24. Кассовые операции по приему наличных денег клиента от подразделения инкассации банка или инкассаторской организации
    осуществляется кассовым работником банка на основании препроводительного документа, соответствующего требованиям пункта
    106 Правил.

    Кассовый работник:

    1) проверяет указание на препроводительном документе необходимых сведений, предусмотренных пунктом 106 Правил;

    2) осуществляет регистрацию суммы принимаемых наличных денег в порядке, установленном внутренними документами банка;

    3) проверяет целостность сумки;

    4) проверяет правильность пломбирования сумки.'
  requirement: Инкассированные клиентские деньги принимают по препроводительному документу; проверяют его сведения, регистрируют
    сумму, проверяют целостность и пломбу сумки.
  limits: Нужны инкассационная доставка и стадия приёма. Удостоверение и препроводительный документ различны. Нет требования
    немедленного пересчёта любой сумки; нечитаемый элемент на сумке не означает отсутствие документа.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p25:
  short: Правила №231, п.25
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.25, абз.1–2
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '25. В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации
    банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности.

    При обнаружении недостачи или излишка составляется акт о результатах пересчета для принятия мер по выявлению причин недостачи
    или излишков в порядке, установленном внутренними документами банка.'
  requirement: При нарушенной целостности сумку вскрывают и пересчитывают при инкассаторе; недостачу/излишек оформляют актом.
  limits: Необходимое условие — обнаруженное нарушение целостности. Без него пункт не обязывает немедленно пересчитать любую
    сумку до первого помещения в сейф.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p37:
  short: Правила №231, п.37
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.37
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 37. Остаток наличных денег после рабочего дня кассовый работник пересчитывает, сортирует, упаковывает и сдает с расходными
    кассовыми документами заведующему кассой или лицу, осуществляющему функции заведующего кассой, для проверки подшивки в
    кассовые документы дня в порядке, установленном внутренними документами банка.
  requirement: После рабочего дня кассир пересчитывает, сортирует, упаковывает и сдаёт остаток наличных и расходные документы
    заведующему кассой/замещающему.
  limits: Краткий уход или выключение света не доказывают конец рабочего дня; весь маршрут сдачи в короткой сцене не виден.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p41:
  short: Правила №231, п.41
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.41
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 41. Банки осуществляют кассовые операции по пересчету и сортировке наличных денег на оборудовании, имеющем функцию
    проверки не менее двух машиночитаемых защитных признаков банкнот и монет, установленных Правилами определения платежности
    банкнот и монет национальной валюты Республики Казахстан, утвержденными постановлением Правления Национального Банка Республики
    Казахстан от 29 ноября 2017 года № 230, зарегистрированным в Реестре государственной регистрации нормативных правовых
    актов под номером № 16120 (далее – Правила № 230).
  requirement: Пересчёт и сортировку выполняют на оборудовании с проверкой не менее двух машиночитаемых защитных признаков.
  limits: Нужны функции оборудования и выполненные проверки. Отдельный УФ-прибор не обязателен, если требование выполняет
    основная машина. Пункт не задаёт срок пересчёта любой инкассаторской сумки до первого хранения.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p43:
  short: Правила №231, п.43
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.43, абз.1–3
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '43. Сортировка наличных денег осуществляется по номиналам и по степени износа. Банкноты сортируются по номиналам,
    на годные к обращению, ветхие, изъятые и (или) изымаемые из обращения.

    Банк осуществляет дополнительно сортировку банкнот по годам выпуска для сдачи в территориальный филиал Национального Банка.

    Монеты сортируются по номиналам, на годные к обращению, дефектные (поврежденные), изъятые и (или) изымаемые из обращения.'
  requirement: Деньги сортируют по номиналу и износу; банкноты также по пригодности/изъятию, а для сдачи филиалу НБРК дополнительно
    по годам выпуска.
  limits: Число стопок не устанавливает номиналы и состояние. Одна итоговая стопка не доказывает несортированность; годы выпуска
    требуются для сдачи территориальному филиалу НБРК.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p59:
  short: Правила №231, п.59
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.59, абз.1–4
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '59. При обнаружении сомнительных банкнот и монет кассовый работник в присутствии клиента и заведующего кассой или
    лица, осуществляющего его функции, составляет акт о приеме на экспертизу сомнительных банкнот и монет в двух экземплярах
    по форме, определенной банком самостоятельно, в котором указываются дата, фамилия, имя, отчество (при его наличии) кассового
    работника банка, обнаружившего сомнительные банкноты и монеты, фамилия, имя, отчество (при его наличии) клиента, номинал
    банкнот и монет, номера и серии банкнот, а также характерные признаки сомнительности банкнот и монет, один из которых
    остается в банке, второй выдается клиенту.

    Сомнительные банкноты и монеты в течение пяти рабочих дней направляются на экспертизу в филиал Национального Банка.

    В случае получении от филиала Национального Банка результатов экспертизы о признании банкнот и монет платежными, осуществляется
    возврат банкнот и монет клиенту на основании его экземпляра акта о приеме на экспертизу сомнительных банкнот и монет.

    В случае признания банкнот и монет неплатежными, банкноты и монеты возврату не подлежат, клиенту выдается результат экспертизы
    банкнот и монет.'
  requirement: Сомнительные деньги оформляются на экспертизу и направляются в течение пяти рабочих дней; признанные платёжными
    возвращаются, неплатёжными — нет.
  limits: Нужна установленная сомнительность. Возврат части наличных не доказывает сомнительность, подделку, нарушение процедуры
    или присвоение.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p61:
  short: Правила №231, п.61
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.61
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 61. Банкноты и монеты, имеющие признаки подделки, клиенту не возвращаются, сумма принятых банкнот и монет на банковский
    счет клиента не зачисляется.
  requirement: Деньги с признаками подделки не возвращают клиенту и не зачисляют на его счёт.
  limits: Обязательны установленные признаки подделки. В X-1 причина возврата и свойства денег неизвестны; подтверждённой
    нарушенной нормы нет.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p74:
  short: Правила №231, п.74
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.74
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 74. Банки обеспечивают хранение наличных денег в кладовых и (или) сейфовой комнате после их учета в автоматизированной
    цифровой системе в соответствии с внутренними документами банка.
  requirement: После учёта в автоматизированной цифровой системе банк хранит наличные в кладовой/сейфовой комнате по внутренним
    документам.
  limits: Нужны наличные, их учёт и стадия хранения. Сейфовая комната — помещение, а не любой настольный сейф. Неизвестное
    содержимое сумки не подтверждает условия.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p80:
  short: Правила №231, п.80
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.80
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 80. Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой
    и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем
    месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола),
    определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования.
  requirement: Банк устанавливает внутренний порядок хранения/выдачи/передачи перечисленных ценностей, печатей, ключей, кодов,
    пломбираторов, клише и штампов, исключающий несанкционированное использование.
  limits: Применимый внутренний порядок ForteBank отсутствует. Нет буквального требования всегда вынимать ключ или всегда
    хранить штамп в сейфе; журнал не является автоматически штампом/печатью. Для открытой дверцы — лишь контекст.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n14_p16:
  short: Правила №14 (охрана и устройство помещений), п.16
  document: Об утверждении Правил организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
    Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация
    банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании
    лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  act: №14 от 2020-02-24
  clause: п.16, пп.1; временная редакция до 01.01.2027
  url: https://adilet.zan.kz/rus/docs/V2000020075
  quote: '16. Устройство помещения кассы (касс) соответствуют следующим параметрам:

    1) каждая касса имеет отдельный вход с закрывающейся на замок дверью;'
  requirement: Каждая касса имеет отдельный вход с дверью, закрывающейся на замок.
  limits: Требование к устройству. Открытое положение не доказывает отсутствие замка/отдельного входа или нарушение буквального
    постоянного режима закрытия. Для Х-30/31/32/33 — контекст; нужны назначение помещения и внутренний режим.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n14_p8:
  short: Правила №14 (охрана и устройство помещений), п.8
  document: Об утверждении Правил организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
    Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация
    банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании
    лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  act: №14 от 2020-02-24
  clause: п.8, абз.1–2
  url: https://adilet.zan.kz/rus/docs/V2000020075
  quote: '8. Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним
    закрывающимся служебным входом.

    Допускается оборудовать дополнительный закрывающийся вход для осуществления погрузочно-разгрузочных работ с наличными
    деньгами и ценностями в боксе или на погрузочно-разгрузочной площадке.'
  requirement: Кассовый узел изолируется одним закрывающимся служебным входом; для погрузки/разгрузки допускается дополнительный
    закрывающийся вход.
  limits: Норма устройства/изоляции. Нет буквальной команды закрывать дверь перед каждым началом работы; открытое положение
    и неизвестные роли — косвенный контекст риска, не доказанный внутренний режим.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n55_p83:
  short: Правила пожарной безопасности №55, п.83
  document: Об утверждении Правил пожарной безопасности
  act: №55 от 2022-02-21
  clause: п.83, абз.1–2
  url: https://adilet.zan.kz/rus/docs/V2200026867
  quote: '83. Электрические установки и электрические приборы в помещениях по окончании рабочего времени (смены) обесточиваются.

    Остаются под напряжением аварийное освещение, установки пожаротушения и противопожарного водоснабжения, пожарная и охранно-пожарная
    сигнализация. Электрические установки и электротехнические изделия (в том числе в жилых помещениях) допускается оставлять
    под напряжением, если это обусловлено их функциональным назначением и (или) предусмотрено требованиями инструкции по эксплуатации
    заводов-изготовителей.'
  requirement: В конце рабочего времени/смены электроприборы обесточивают; есть исключения для названных аварийных/пожарных
    систем и по функции/инструкции изготовителя.
  limits: Нужны конец смены, питание и отсутствие исключения. Ноутбук может работать от аккумулятора; светящийся экран, закрытая
    крышка или выключенный свет не доказывают наличие/отсутствие сетевого питания.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n53_p71:
  short: Требования к информационной безопасности банков №53, п.71
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: №53 от 2026-04-03
  clause: п.71, пп.9; вместе с п.72
  url: https://adilet.zan.kz/rus/docs/V2600038336
  quote: 9) при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает сеанс работы
    пользователя либо блокирует рабочую станцию или ноутбук с возможностью разблокировки только при вводе аутентификационных
    данных пользователя.
  requirement: При неактивности более 30 минут ИС автоматически завершает сеанс или блокирует станцию/ноутбук с разблокировкой
    по аутентификационным данным.
  limits: Это автоматическая функция после >30 минут, не универсальный немедленный ручной Win+L. Короткий ролик не проверяет
    таймаут, активную сессию и исключения п.72.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n53_p72:
  short: Требования к информационной безопасности банков №53, п.72
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: №53 от 2026-04-03
  clause: п.72, пп.1–2
  url: https://adilet.zan.kz/rus/docs/V2600038336
  quote: '72. Требования пункта 71 Требований не применяются в случаях, когда:

    1) информационная система интегрирована в части аутентификации с информационной системой, соответствующей требованиям
    пункта 71 Требований;

    2) функции одной информационной системы минимизируют риск неавторизованного доступа в другой информационной системе.'
  requirement: П.71 не применяется при интеграции аутентификации с соответствующей системой или минимизации риска неавторизованного
    доступа функциями другой ИС.
  limits: Нужны архитектура и конфигурация ИС. Вид экрана не устанавливает наличие/отсутствие исключения; пункт не разрешает
    произвольно оставлять рабочее место без защиты.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p42:
  short: Правила №231, п.42
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.42
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 42. Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником в присутствии
    контролирующего работника, за исключением случаев совершения кассовых операций по приему и выдаче наличных денег клиенту.
  requirement: Пересчёт, сортировка и упаковка выполняются при контролирующем работнике, кроме операций приёма/выдачи денег
    клиенту.
  limits: 'Порог суммы/размера отсутствует. Сначала нужна классификация стадии: самостоятельная обработка либо исключённый
    приём/выдача клиенту. Один видимый человек не доказывает отсутствие контролирующего вне поля камеры; роль присутствующего
    также надо установить.'
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p10_1:
  short: Правила №231, п.10-1
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.10-1
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: 10-1. Кассовые операции с использованием цифровых документов осуществляются в соответствии с требованиями Цифрового
    кодекса Республики Казахстан (далее – Цифровой кодекс) и Закона Республики Казахстан "О кибербезопасности" (далее – Закон
    о кибербезопасности).
  requirement: Кассовые операции с цифровыми документами выполняются по требованиям Цифрового кодекса и Закона о кибербезопасности.
  limits: Не является освобождением от идентификации или кассовой документации. Отсутствие бумаги в кадре не устанавливает
    отсутствие документа, но цифровое оформление также нужно подтвердить.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
n231_p17:
  short: Правила №231, п.17
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: №231 от 2019-11-29
  clause: п.17, пп.1–2
  url: https://adilet.zan.kz/rus/docs/V1900019680
  quote: '17. Кассовые операции по приему наличных денег от клиентов осуществляются кассовым работником на основании следующих
    приходных кассовых документов:

    1) объявление на взнос наличных денег;

    2) приходный кассовый ордер.'
  requirement: Приём денег от клиентов осуществляется на основании объявления на взнос наличных или приходного кассового ордера.
  limits: Нужна именно приёмная клиентская операция; неизвестны документальный маршрут и цифровое оформление. Видимого отсутствия
    бумаги недостаточно.
  kind: kazakhstan_regulation
  quote_verified: true
  source: review 2026-10-17
