tk_p81_3:
  short: Трудовой кодекс №414-V, статья 81, пункт 3
  document: Трудовой кодекс Республики Казахстан
  act: Кодекс Республики Казахстан от 23 ноября 2015 года № 414-V ЗРК.
  clause: статья 81, пункт 3
  url: https://adilet.zan.kz/rus/docs/K1500000414#z528
  quote: 3. Время перерыва для отдыха и приема пищи не включается в рабочее время. На работах, где по условиям производства
    предоставление перерыва невозможно, работодатель обязан обеспечить работнику возможность отдыха и приема пищи в рабочее
    время в специально оборудованном месте. Перечень таких работ, порядок и место для отдыха и приема пищи устанавливаются
    коллективным договором или актами работодателя.
  heading: Статья 81. Перерыв для отдыха и приема пищи
  spec: K1500000414:81.3
  source_sha256: 56ac42bbd68a7f2b68e50f18f0dc2215ede0ffbf8f251125640e5002af2f069d
  source: corpus 2026-10-17
n222_p19:
  short: Минэнерго №222 от 19.03.2015, пункт 19
  document: Об утверждении Правил техники безопасности при эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 19 марта 2015 года № 222. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 29 апреля 2015 года № 10889.
  clause: пункт 19
  url: https://adilet.zan.kz/rus/docs/V1500010889#z89
  quote: '19. Единоличный осмотр электроустановок выполняют оперативный персонал, находящийся на дежурстве, а также административно-технический
    персонал с V группой по электробезопасности.

    Единоличным осмотром электроустановок административно-техническому персоналу предоставляется распоряжением по предприятию.'
  heading: Параграф 2. Оперативное обслуживание. Осмотры электроустановок
  spec: V1500010889:19
  source_sha256: cc739b628f1684ea10aba7e4ba865e80fcc01133f635acabeebd8872fa7f6248
  source: corpus 2026-10-17
n222_p20:
  short: Минэнерго №222 от 19.03.2015, пункт 20
  document: Об утверждении Правил техники безопасности при эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 19 марта 2015 года № 222. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 29 апреля 2015 года № 10889.
  clause: пункт 20
  url: https://adilet.zan.kz/rus/docs/V1500010889#z90
  quote: '20. Работники, не имеющие разрешение единоличного осмотра электроустановки, допускаются в помещение электроустановки
    в сопровождении работников, перечисленных в пункте 19 настоящих Правил.

    Контроль за безопасностью работников, допущенных к работе в электроустановках, осуществляет сопровождающий работник.'
  heading: Параграф 2. Оперативное обслуживание. Осмотры электроустановок
  spec: V1500010889:20
  source_sha256: cc739b628f1684ea10aba7e4ba865e80fcc01133f635acabeebd8872fa7f6248
  source: corpus 2026-10-17
n222_p26:
  short: Минэнерго №222 от 19.03.2015, пункт 26
  document: Об утверждении Правил техники безопасности при эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 19 марта 2015 года № 222. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 29 апреля 2015 года № 10889.
  clause: пункт 26
  url: https://adilet.zan.kz/rus/docs/V1500010889#z96
  quote: 26. Двери помещений электроустановок, камер, щитов и сборок оборудуются запирающими устройствами. При производстве
    работ в камерах, щитах и сборках последние не запираются.
  heading: Параграф 2. Оперативное обслуживание. Осмотры электроустановок
  spec: V1500010889:26
  source_sha256: cc739b628f1684ea10aba7e4ba865e80fcc01133f635acabeebd8872fa7f6248
  source: corpus 2026-10-17
n222_p27:
  short: Минэнерго №222 от 19.03.2015, пункт 27
  document: Об утверждении Правил техники безопасности при эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 19 марта 2015 года № 222. Зарегистрирован в Министерстве юстиции
    Республики Казахстан 29 апреля 2015 года № 10889.
  clause: пункт 27
  url: https://adilet.zan.kz/rus/docs/V1500010889#z97
  quote: '27. Ключи от электроустановок находятся на учете у оперативного персонала. В электроустановках без местного оперативного
    персонала ключи находятся на учете у административно-технического персонала.

    Ключи пронумеровываются и хранятся в запираемом ящике. Один комплект ключей – запасной. Ключи выдаются под расписку:

    1) работникам, имеющим право единоличного осмотра – от всех помещений;

    2) при допуске – руководителю и производителю работ (наблюдающему) – от помещений, в которых предстоит работать.

    Ключи от камер в электроустановках напряжением выше 1000 В при допуске выдаются допускающему из числа оперативного персонала

    Ключи подлежат возврату руководителем, производителем работ (наблюдающим) ежедневно по окончании работ, при осмотре электроустановок
    – по завершении осмотра.

    В электроустановках без местного оперативного персонала ключи возвращаются не позднее следующего рабочего дня после осмотра
    или полного окончания работ.

    Выдача и возврат ключей учитываются в специальном журнале произвольной формы или в оперативном журнале.'
  heading: Параграф 2. Оперативное обслуживание. Осмотры электроустановок
  spec: V1500010889:27
  source_sha256: cc739b628f1684ea10aba7e4ba865e80fcc01133f635acabeebd8872fa7f6248
  source: corpus 2026-10-17
n222_p4:
  short: Минэнерго №222 от 19.03.2015, пункт 4
  document: Об утверждении Правил техники безопасности при эксплуатации электроустановок потребителей
  act: Приказ Министра энергетики Республики Казахстан от 19 марта 2015 года № 222. Зарегистрирован в Министерстве юстиции
