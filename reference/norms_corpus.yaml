n231_p58:
  short: НБРК №231, пункт 58
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 58
  url: https://adilet.zan.kz/rus/docs/V1900019680#z197
  quote: 58. Банк при осуществлении кассовых операций проверяет платежность наличной иностранной валюты по образцам иностранной
    валюты, представленным банками-эмитентами, либо справочным и информационным материалам о признаках платежности иностранной
    валюты, полученным из официальных источников банков-эмитентов и других организаций, занимающихся распространением такой
    информации в соответствии с требованиями Правил осуществления обменных операций с наличной иностранной валютой в Республике
    Казахстан, утвержденных постановлением Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49,
    зарегистрированным в Реестре государственной регистрации нормативных правовых актов под № 18545.
  heading: Параграф 5. Порядок работы с сомнительными, неплатежными, имеющими признаки подделки наличными деньгами
