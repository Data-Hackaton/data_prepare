    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 53
  url: https://adilet.zan.kz/rus/docs/V2600038336#z182
  quote: 53. Организационные и технические меры, обеспечивающие защиту рабочих станций, ноутбуков и мобильных устройств банка,
    организации, а также носителей информации и сетевой инфраструктуры определяются банком, организацией в соответствии с
    главой 9 Требований.
  heading: Глава 5. Требования к обеспечению безопасности информационной инфраструктуры
  spec: V2600038336:53
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p56:
  short: АРРФР №53, пункт 56
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 56
  url: https://adilet.zan.kz/rus/docs/V2600038336#z187
  quote: 56. Банк, организация обеспечивает информационную безопасность при доступе к информационным активам банка, организации
    лиц, не являющихся работниками или клиентами банка, организации (далее – третьи лица).
  heading: Глава 7. Требования к обеспечению информационной безопасности при доступе третьих лиц к информационным активам
    банка, организации
  spec: V2600038336:56
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p57:
  short: АРРФР №53, пункт 57
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 57
  url: https://adilet.zan.kz/rus/docs/V2600038336#z188
  quote: 57. Доступ к информационным активам банка, организации третьих лиц предоставляется на период и в объеме, определяемыми
    проводимыми работами на основании соглашения, договора, включающего условия о соблюдении требований к информационной безопасности,
    за исключением случаев, предусмотренных законодательством Республики Казахстан. В соглашениях, договорах, заключаемых
    с третьими лицами, содержатся положения о конфиденциальности, условия о возмещении ущерба, возникшего вследствие нарушения
    информационной безопасности, а также сбоев в работе информационных систем и нарушения их безопасности, вызванных действием
    или бездействием третьих лиц.
  heading: Глава 7. Требования к обеспечению информационной безопасности при доступе третьих лиц к информационным активам
    банка, организации
  spec: V2600038336:57
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p59:
  short: АРРФР №53, пункт 59
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 59
  url: https://adilet.zan.kz/rus/docs/V2600038336#z190
  quote: '59. В целях обеспечения контроля деятельности третьих лиц предусматриваются, как минимум, одна из следующих организационных
    и (или) программно-технических мер:

    1) проверка результата деятельности третьих лиц;

    2) осуществление деятельности третьих лиц только в присутствии работников банка, организации;

    3) ведение аудиторского следа по действиям третьих лиц;

    4) запись сессии доступа к информационным активам банка, организации.'
  heading: Глава 7. Требования к обеспечению информационной безопасности при доступе третьих лиц к информационным активам
    банка, организации
  spec: V2600038336:59
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p71:
  short: АРРФР №53, пункт 71
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 71
  url: https://adilet.zan.kz/rus/docs/V2600038336#z230
  quote: '71. В информационных системах банка, организации применяются следующие параметры функции по управлению паролями
    и блокировками учетных записей пользователей:

    1) минимальная длина пароля – значение данного параметра составляет не менее 8 символов. Проверка пароля на соответствие
    данному параметру производится при каждой смене пароля, в случае несоответствия – выдается уведомление пользователю;

    2) сложность пароля – возможность проверки наличия в пароле как минимум трех групп символов: строчных букв, заглавных
    букв, цифровых значений, специальных символов. Проверка пароля на соответствие данному параметру производится при каждой
    смене пароля, в случае несоответствия – выдается уведомление пользователю;

    3) история пароля –- новый пароль не повторяет как минимум семь предыдущих паролей. Проверка пароля на соответствие данному
    параметру производится при каждой смене пароля, в случае несоответствия выдается уведомление пользователю;

    4) минимальный срок действия пароля – 1 (один) рабочий день;

    5) максимальный срок действия пароля – не более 60 (шестидесяти) календарных дней. Проверка пароля на соответствие данному
    параметру производится при каждом входе в информационную систему и смене пароля. В случае, если до истечения максимального
    срока действия остается 7 (семь) и менее календарных дней, пользователю выдается соответствующее уведомление. По истечении
    максимального срока действия пароля информационная система блокирует доступ и требует обязательную смену пароля;

    6) при первом входе в информационную систему либо после смены пароля администратором информационная система запрашивает
    у пользователя смену пароля с невозможностью отклонить данную процедуру. Данное правило превалирует над правилом о сроке
    действия пароля;

    7) в случае отсутствия активности пользователя в информационной системе более 30 (тридцати) календарных дней его учетная
    запись автоматически блокируется;

    8) при последовательном пятикратном вводе неправильного пароля учетная запись пользователя временно блокируется;

    9) при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает сеанс работы
    пользователя либо блокирует рабочую станцию или ноутбук с возможностью разблокировки только при вводе аутентификационных
    данных пользователя.'
  heading: Параграф 2. Требования к процессу управления паролями и блокировками учетных записей пользователей в информационных
    системах
  spec: V2600038336:71
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p72:
  short: АРРФР №53, пункт 72
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 72
  url: https://adilet.zan.kz/rus/docs/V2600038336#z240
  quote: '72. Требования пункта 71 Требований не применяются в случаях, когда:

    1) информационная система интегрирована в части аутентификации с информационной системой, соответствующей требованиям
    пункта 71 Требований;

    2) функции одной информационной системы минимизируют риск неавторизованного доступа в другой информационной системе.'
  heading: Параграф 2. Требования к процессу управления паролями и блокировками учетных записей пользователей в информационных
    системах
  spec: V2600038336:72
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p73:
  short: АРРФР №53, пункт 73
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 73
  url: https://adilet.zan.kz/rus/docs/V2600038336#z243
  quote: '73. Процесс управления паролями и учетными записями определяется банком, организацией и включает:

    1) управление администраторами информационных систем учетными записями пользователей информационных систем и сменой их
    паролей;

    2) подачу и рассмотрение заявок на создание учетных записей, а также изменения пароля при возникновении нештатной ситуации;

    3) подачу заявок на изменение или удаление учетных записей;

    4) идентификацию лиц, подающих заявки на создание, изменение или удаление учетных записей, а также изменение пароля;

    5) недопущение неправомерной передачи паролей третьим лицам, а также администраторам информационных систем и иным работникам
    банка, организации;

    6) недопущение работы в информационных системах под чужими учетными записями, за исключением предоставления доступа к
    чужой учетной записи в целях обеспечения непрерывности деятельности по согласованию с подразделением по информационной
    безопасности в указанный промежуток времени при обеспечении точной идентификации пользователя.'
  heading: Параграф 2. Требования к процессу управления паролями и блокировками учетных записей пользователей в информационных
    системах
  spec: V2600038336:73
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p75:
  short: АРРФР №53, пункт 75
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 75
  url: https://adilet.zan.kz/rus/docs/V2600038336#z254
  quote: '75. Для защиты информации при использовании внешних носителей электронной информации применяются любой из следующих
    методов, включая, но не ограничиваясь ими:

    1) организационный: обеспечение осведомленности персонала, ограничение количества работников, имеющих доступ к записи
    на внешние носители информации;

    2) программно-технический: использование программно-технических средств, обеспечивающих ограничение, контроль и шифрование
    записи информации на внешние носители, отключение неиспользуемых портов ввода-вывода и устройств записи внешних носителей
    на рабочих станциях персонала банка, организации и серверах.'
  heading: Параграф 3. Требования к процессу обеспечения безопасности информации
  spec: V2600038336:75
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p76:
  short: АРРФР №53, пункт 76
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 76
  url: https://adilet.zan.kz/rus/docs/V2600038336#z257
  quote: '76. Для защиты информации при использовании бумажных носителей применяются любой из следующих методов, включая,
    но не ограничиваясь ими:

    1) организационный: ограничения, определяемые банком, организацией, обеспечение осведомленности персонала, ограничение
    количества работников, имеющих доступ к работе с документами, содержащими защищаемую информацию;

    2) программно-технический: использование программно-технических средств, обеспечивающих контроль вывода информации на
    бумажные носители.'
  heading: Параграф 3. Требования к процессу обеспечения безопасности информации
  spec: V2600038336:76
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
n53_p78:
  short: АРРФР №53, пункт 78
  document: Об утверждении Требований к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики
    Казахстан и организаций, осуществляющих отдельные виды банковских операций
  act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 3 апреля 2026
    года № 53. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
  clause: пункт 78
  url: https://adilet.zan.kz/rus/docs/V2600038336#z263
  quote: '78. Уничтожение защищаемой информации производится методами, исключающими ее восстановление, с использованием любого
    из следующих методов уничтожения информации в зависимости от типа носителя:

    1) физическое уничтожение носителя информации;

    2) электромагнитное воздействие на носитель информации (для магнитных носителей);

    3) программное уничтожение электронной информации специализированными программными средствами.'
  heading: Параграф 3. Требования к процессу обеспечения безопасности информации
  spec: V2600038336:78
  source_sha256: 8d3ffc326265de22e160bcee437c58d5aa954951ab7922db2cd596089b07898c
  source: corpus 2026-10-17
law73_p23_1:
  short: Закон о документах, удостоверяющих личность №73-V, статья 23, пункт 1
  document: О документах, удостоверяющих личность
  act: Закон Республики Казахстан от 29 января 2013 года № 73-V.
  clause: статья 23, пункт 1
  url: https://adilet.zan.kz/rus/docs/Z1300000073#z155
  quote: 1. В случаях и порядке, установленных законами Республики Казахстан, документы, удостоверяющие личность, изымаются
    должностными лицами органов предварительного следствия, дознания, а также должностными лицами в ходе административного
    производства и оформления утраты и лишения гражданства.
  heading: Статья 23. Изъятие и использование документов, удостоверяющих личность
  spec: Z1300000073:23.1
  source_sha256: 8ac1510232eacf7a015d11c0a67e271d2220d598ddb0a85286dcbc2ba00ab7a1
  source: corpus 2026-10-17
law73_p23_2:
  short: Закон о документах, удостоверяющих личность №73-V, статья 23, пункт 2
  document: О документах, удостоверяющих личность
  act: Закон Республики Казахстан от 29 января 2013 года № 73-V.
  clause: статья 23, пункт 2
  url: https://adilet.zan.kz/rus/docs/Z1300000073#z157
  quote: 2. Запрещается принятие в залог документов, удостоверяющих личность.
  heading: Статья 23. Изъятие и использование документов, удостоверяющих личность
