  quote: '2.1.5-1. Прием, пересчет и зачислени е инкассированных денег на Счет Клиента осуществляется в соответствии с действующими
    тарифами Банка . Зачисление производится не позднее следующего операционного дня на Счет Клиента с соблюдением требований
