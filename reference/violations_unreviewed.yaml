# Видео с меткой «нарушение», для которых тип не дан организаторами. Тип определён по кадрам в окне ±4 с
# от размеченной секунды (контактные листы) и сравнением с чистыми видео той же сцены. confirmed: false —
# человек не подтверждал. Журнал действий не заведён: эти видео — честная проверка L2+L3 (decision.eval).
#   rule  — правило L2/L3, которое должно сработать; null — тип пока не ловится (нет признака в L1).
#   norm  — id из norms.yaml; null — пункт не найден (не выдумываем).
# Сцены: A/B — стол у стекла, камера из-за спины кассира или сбоку; E — стол повёрнут, машинка справа.

