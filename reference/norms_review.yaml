  act: null
  clause: пп.2.14–2.17; два п.2.15 в самом документе
  url: https://prod-one-strapi.s3.eu-north-1.amazonaws.com/Obshhie_usloviya_po_schetam_240726_Final_Utv_sajt_1_819c71eebf.pdf
  quote: '2.14. Операции с наличными деньгами включает в себя прием, пересчет, размен, обмен, выдачу, сортировку и хранение
    Банком банкнот и монет, находящиеся в обращении в национальной и иностранной валюте в порядке и случаях, предусмотренных
    законодательством РК. 2.15. Прием и выдача наличных денег осуществляются: - через операционную кассу филиала Банка; -
    через кассу пересчета филиала Банка; - через АТМ/ТС; - через Автокассу. 2.15. В случаях, предусмотренных внутренними документами
    Банка или законодательством РК, Клиент предоставляет Банку предварительную заявку на получение наличных денег, а также
    документы, подтверждающие цел ь их получения за 1 (один) рабочий день до их получения, и принимает наличные деньги в банкнотах
    и монетах, имеющихся в Банке. 2.16. В случае наличия в кассе необходимой суммы наличных денег Клиенту, то выдача денег
    осуществляется в день обращения Клиента без предварительной заявки. 2.17. Клиент/Банк вправе при получении/приеме наличных
    денег заявлять претензии о недостаче, излишках, об обнаружении сомнительных, неплатёжеспособных и имеющих признаки подд
    елки денежных знаков, выявленных при пересчете наличных денег в помещении Банка и в присутствии кассового работника Банка
    /представителя Клиента.'
  requirement: Описаны наличные операции, каналы приёма/выдачи, заявки и претензии при пересчёте в присутствии сторон.
  limits: Клиенты, присоединившиеся к соответствующим условиям счетов. Нет универсального срока немедленного пересчёта любой
    сумки. В оригинале два пункта 2.15; нумерация сохранена.
  kind: fortebank_public_document
  quote_verified: true
  source: review 2026-10-17
