n230_p4:
  short: НБРК №230, пункт 4
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 4
  url: https://adilet.zan.kz/rus/docs/V1700016120#z22
  quote: 4. К платежным банкнотам относятся подлинные банкноты, не утратившие силу законного платежного средства, не изъятые
    из обращения и изымаемые из обращения, сохранившие не менее 70% (семидесяти процентов) от установленных Национальным Банком
    Республики Казахстан (далее – Национальный Банк) размеров банкнот, и знаки (письменные или цифровые), обозначающие их
    номинал и имеющие незначительные повреждения (если они не препятствуют определению подлинности банкнот), в том числе ветхие.
  heading: Глава 2. Определение платежности банкнот и монет национальной валюты Республики Казахстан, имеющих силу законного
    средства платежа
  spec: V1700016120:4
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n49_p11:
  short: НБРК №49, пункт 11
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 11
  url: https://adilet.zan.kz/rus/docs/V1900018545#z54
  quote: '11. Требования к помещению, оборудованию, персоналу обменного пункта (за исключением автоматизированного обменного
    пункта):

    1) организация охраны и устройство помещения обменного пункта осуществляются в соответствии с требованиями, установленными
    в Правилах организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан,
    Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет
    и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии
    Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой, утвержденных постановлением
    Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14, зарегистрированным в Реестре государственной
    регистрации нормативных правовых актов под № 20075;

    2) операционная касса обменного пункта оборудуется системой видеонаблюдения, обеспечивающей запись и хранение информации
    процесса осуществления деятельности обменного пункта в течение 90 (девяноста) календарных дней на технических устройствах,
    обеспечивающих резервное копирование архива видео данных и защиту архива от удаления и редактирования, при этом в зоне
    видимости видеонаблюдения находятся рабочая зона кассира и клиент, а соответствующие устройства устанавливаются в местах,
    обеспечивающих отсутствие помех для видеонаблюдения и возможность визуальной идентификации национальной и иностранной
    валюты.

    Юридическое лицо, имеющее право на осуществление обменных операций с наличной иностранной валютой, обеспечивает наличие
    и сохранность видеозаписей (видеоархивов), в соответствии с требованиями настоящего подпункта;

    3) рабочее место кассира оборудуется аппаратно-программным комплексом либо контрольно-кассовым аппаратом и программным
    обеспечением для ведения учета обменных операций в соответствии с требованиями Правил, а также техническими средствами
    для определения подлинности денежных знаков, обеспечивающими проверку банкноты в ультрафиолетовом свете (контроль люминесценции
    бумаги и иное) и проверку банкноты на наличие магнитных меток;

    4) соответствие руководителя уполномоченной организации (ее филиала) требованиям, предусмотренным пунктом 6-1 Правил.

    Сноска. Пункт 11 - в редакции постановления Правления Национального Банка РК от 20.12.2021

    № 118

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования); с изменениями,
    внесенными постановлением Правления Национального Банка РК от 26.09.2023

    № 72

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 2. Квалификационные требования к уполномоченным организациям
  spec: V1900018545:11
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p33:
  short: НБРК №49, пункт 33
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 33
  url: https://adilet.zan.kz/rus/docs/V1900018545#z111
  quote: '33. Юридическое лицо, имеющее право на осуществление обменных операций с наличной иностранной валютой, в процессе
    осуществления деятельности обменного пункта обеспечивает выполнение требований к помещению, оборудованию, персоналу обменного
    пункта (за исключением автоматизированного обменного пункта), установленных пунктами 6-1 и 11 Правил.

    Сноска. Пункт 33 - в редакции постановления Правления Национального Банка РК от 26.09.2023

    № 72

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 5. Требования к деятельности по осуществлению обменных операций с наличной иностранной валютой
  spec: V1900018545:33
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p34:
  short: НБРК №49, пункт 34
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 34
  url: https://adilet.zan.kz/rus/docs/V1900018545#z112
  quote: 34. В обменном пункте не проводятся обменные операции, если в результате возникших обстоятельств (технического сбоя,
    поломки или других причин) помещение обменного пункта, оборудование для функционирования обменного пункта и (или) персонал
    обменного пункта не соответствуют требованиям пункта 11 Правил.
  heading: Глава 5. Требования к деятельности по осуществлению обменных операций с наличной иностранной валютой
  spec: V1900018545:34
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p39:
  short: НБРК №49, пункт 39
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 39
  url: https://adilet.zan.kz/rus/docs/V1900018545#z121
  quote: '39. В каждом обменном пункте в доступном для обозрения клиентами месте размещается следующая информация:

    1) копия лицензии на обменные операции с наличной иностранной валютой на казахском и русском языках, за исключением случаев,
    когда получение лицензии не требуется в соответствии с частью второй подпункта 1) пункта 3 статьи 4 Закона Республики
    Казахстан "О банках и банковской деятельности в Республике Казахстан";

    2) для уполномоченных организаций - копия действительного приложения к действительной лицензии, выданного территориальным
    филиалом Национального Банка на данный обменный пункт;

    3) для уполномоченных банков - копия письменного подтверждения территориального филиала Национального Банка (для обменных
    пунктов, получивших такое подтверждение), либо копия свидетельства обменного пункта, (для обменных пунктов, получивших
    свидетельство обменного пункта до введения в действие Правил);

    4) информационный стенд для клиентов (размером не менее 0,4 метра в высоту и 0,4 метра в ширину), содержащий сведения
    о курсе покупки и (или) курсе продажи наличной иностранной валюты за теңге, установленные для каждой иностранной валюты,
    с которой в обменном пункте проводятся операции по покупке и (или) продаже.

    Установка информационного стенда для клиентов, содержащего сведения о курсе покупки и (или) курсе продажи наличной иностранной
    валюты за теңге, осуществляется внутри помещения обменного пункта или непосредственно возле операционной кассы обменного
    пункта.

    Не допускается размещение указанного информационного стенда вне помещения обменного пункта, в том числе на крышах и внешних
    сторонах зданий или сооружений, стационарных, передвижных и выносных стендах. Данный информационный стенд также должен
    быть недоступен визуальному обзору на открытом пространстве за пределами помещения обменного пункта, только если обменный
    пункт не располагается в зданиях и сооружениях многофункционального назначения (в том числе деловых центрах), в зданиях
    железнодорожных вокзалов, казино, внутри аэровокзалов международных аэропортов, на территории автомобильных, морских и
    речных пунктов пропуска через Государственную границу Республики Казахстан.

    Допускается размещение информации о курсе покупки и (или) курсе продажи наличной иностранной валюты за теңге на мониторе
    автоматизированного обменного пункта.

    5) информация для клиентов обменного пункта по форме согласно приложению 10 к Правилам, содержащая сведения о территориальном
    филиале Национального Банка, осуществляющем контроль за деятельностью обменного пункта, и о возможности направления жалобы
    в данный территориальный филиал Национального Банка при наличии замечаний к работе данного обменного пункта;

    6) копия акта Национального Банка, устанавливающего пределы отклонения курса покупки от курса продажи иностранной валюты
    за тенге по операциям, проводимым через обменные пункты, в период действия такого акта;

    7) информация о кассире (фамилия, имя, отчество (при его наличии), осуществляющем обслуживание клиентов (за исключением
    автоматизированного обменного пункта);

    8) информация об интернет-ресурсе юридического лица, имеющего право на осуществление обменных операций с наличной иностранной
    валютой (при его наличии).

    Допускается размещение информации, предусмотренной в подпункте 1), 3) и 6) настоящего пункта на интернет-ресурсе юридического
    лица, имеющего право на осуществление обменных операций с наличной иностранной валютой.

    По требованию физического лица кассир обменного пункта представляет информацию об основных признаках годных к обращению
    и негодных к обращению банкнот, о порядке и условиях принятия на инкассо неплатежных или негодных к обращению банкнот
    иностранной валюты (за исключением автоматизированного обменного пункта).

    Сноска. Пункт 39 - в редакции постановления Правления Национального Банка РК от 23.06.2025

    № 34

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования); с изменениями,
    внесенными постановлениями Правления Национального Банка РК от 02.12.2025

    № 93

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 30.06.2026

    № 78

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 5. Требования к деятельности по осуществлению обменных операций с наличной иностранной валютой
  spec: V1900018545:39
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p41:
  short: НБРК №49, пункт 41
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 41
  url: https://adilet.zan.kz/rus/docs/V1900018545#z138
  quote: '41. В помещениях операционных касс обменных пунктов не допускается присутствие посторонних лиц. Деньги, не относящиеся
    к деятельности юридического лица, имеющего право на осуществление обменных операций с наличной иностранной валютой, хранятся
    в специально отведенной комнате или шкафах, расположенных вне помещения операционной кассы обменного пункта.

    Сноска. Пункт 41 - в редакции постановления Правления Национального Банка РК от 02.12.2025

    № 93

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 5. Требования к деятельности по осуществлению обменных операций с наличной иностранной валютой
  spec: V1900018545:41
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p42:
  short: НБРК №49, пункт 42
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 42
  url: https://adilet.zan.kz/rus/docs/V1900018545#z141
  quote: '42. В обменных пунктах проводятся операции по покупке и (или) продаже наличной иностранной валюты в соответствии
    с курсами покупки, продажи, установленными на основании распоряжения об установлении курсов.

    Распоряжение об установлении курсов содержит курсы покупки, продажи для всех видов валют, с которыми в обменном пункте
    проводятся обменные операции, с указанием даты и времени (определяемого в часах и минутах) начала действия данного распоряжения.

    В одном распоряжении об установлении курсов разрешается одновременно устанавливать различные курсы в зависимости от сумм
    проводимых обменных операций.'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:42
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p46:
  short: НБРК №49, пункт 46
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 46
  url: https://adilet.zan.kz/rus/docs/V1900018545#z155
  quote: 46. В течение всего периода действия распоряжения об установлении курсов по всем видам валют, с которыми в обменном
    пункте проводятся обменные операции, на информационном стенде для клиентов размещаются курсы покупки и (или) продажи валют,
    указанные в данном распоряжении.
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:46
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p51:
  short: НБРК №49, пункт 51
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 51
  url: https://adilet.zan.kz/rus/docs/V1900018545#z164
  quote: '51. По обменным операциям, проведенным через обменные пункты (в том числе автоматизированные обменные пункты) фиксация
    данных клиента, за исключением юридического адреса клиента, в журнале реестров осуществляется на основании данных документа,
    удостоверяющего личность клиента, предусмотренного подпунктами 1) , 2) , 3) , 4) , 9) и 11) пункта 1 статьи 6 Закона Республики
    Казахстан "О документах, удостоверяющих личность" либо данных, подтверждающих (идентифицирующих) личность клиента, полученных
    посредством сервиса цифровых документов.

    По обменным операциям, проведенным через обменные пункты (в том числе автоматизированные обменные пункты), на сумму, превышающую
    эквивалент 500 000 (пятисот тысяч) теңге по курсу проведения обменной операции, в журнале реестров фиксируются:

    индивидуальный идентификационный номер клиента;

    данные документа, удостоверяющего личность клиента – вид документа, дата выдачи, номер документа, срок действия (в случае
    неприсвоения индивидуального идентификационного номера в соответствии с законодательством Республики Казахстан);

    юридический адрес клиента (государство, населенный пункт, улица, номер дома, номер квартиры (при наличии));

    фамилия, имя и отчество клиента (при его наличии) (имя и отчество указываются полностью).

    По обменным операциям, проведенным через обменные пункты (в том числе автоматизированные обменные пункты), на сумму, не
    превышающую эквивалент 500 000 (пятисот тысяч) теңге по курсу проведения обменной операции, в журнале реестров фиксируются
    фамилия, имя и отчество (при его наличии) (имя и отчество указываются полностью) и индивидуальный идентификационный номер
    клиента (при наличии).

    Сноска. Пункт 51 - в редакции постановления Правления Национального Банка РК от 30.06.2026

    № 78

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:51
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p53:
  short: НБРК №49, пункт 53
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 53
  url: https://adilet.zan.kz/rus/docs/V1900018545#z172
  quote: '53. Не устанавливаются ограничения в приеме находящихся в обращении денежных знаков по номиналу и годам эмиссии
    при проведении обменных операций, а также не осуществляется отказ физическим лицам в проведении обменной операции при
    наличии в обменном пункте наличной иностранной и наличной национальной валюты в сумме, необходимой для проведения обменной
    операции, за исключением случаев, предусмотренных статьей 13 Закона о ПОД/ФТ/ФРОМУ, или непредставления документа, удостоверяющего
    личность клиента, либо данных, подтверждающих (идентифицирующих) личность клиента, полученных посредством сервиса цифровых
    документов, в соответствии с частью третьей пункта 51 Правил.

    При отказе физическому лицу в проведении обменной операции по причине отсутствия в обменном пункте наличной национальной
    или наличной иностранной валюты, на которую в обменном пункте были установлены курсы покупки и (или) продажи, по требованию
    физического лица кассиром обменного пункта выдается справка в произвольной форме с указанием вида и суммы валюты, отсутствующей
    в обменном пункте, даты и времени выдачи справки. Справка подписывается кассиром обменного пункта и регистрируется в порядке,
    установленном внутренними правилами юридического лица, имеющего право на осуществление обменных операций с наличной иностранной
    валютой, (его филиала).

    Сноска. Пункт 53 - в редакции постановления Правления Национального Банка РК от 02.12.2025

    № 93

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:53
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p54:
  short: НБРК №49, пункт 54
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 54
  url: https://adilet.zan.kz/rus/docs/V1900018545#z174
  quote: '54. Обменный пункт (автоматизированный обменный пункт) подтверждает проведение обменной операции выдачей контрольного
    чека в соответствии с подпунктом 2) пункта 1 статьи 111 Налогового Кодекса Республики Казахстан (далее – Налоговый кодекс).

    Сноска. Пункт 54 - в редакции постановления Правления Национального Банка РК от 02.12.2025

    № 93

    (вводится в действие с 01.01.2026).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:54
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p57:
  short: НБРК №49, пункт 57
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 57
  url: https://adilet.zan.kz/rus/docs/V1900018545#z177
  quote: 57. Комиссионное вознаграждение при покупке и (или) продаже наличной иностранной валюты, являющейся законным платежным
    средством в стране эмитента, а также при обмене наличной иностранной валюты ранних годов эмиссии на наличную иностранную
    валюту более поздних годов эмиссии не взимается.
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:57
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p58:
  short: НБРК №49, пункт 58
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 58
  url: https://adilet.zan.kz/rus/docs/V1900018545#z178
  quote: '58. К основным признакам законного платежного средства относятся наличие на банкноте наименования эмиссионного банка,
    номера и серии, номинала цифрами и прописью, основного рисунка лицевой и оборотной стороны, а также элементов защиты от
    подделки (водяной знак, магнитные метки, внедренные в бумагу цветные волокна, включая видимые в ультрафиолетовых лучах
    конфетти, защитные нити, микротекст, люминесцирующие рисунки и другие элементы защиты от подделки).

    Страной-эмитентом валюты могут быть установлены иные либо дополнительные требования к выпущенным банкнотам.

    Юридическое лицо, имеющее право на осуществление обменных операций с наличной иностранной валютой, (его филиал) самостоятельно
    приобретает справочные и информационные материалы по определению подлинности и платежности банкнот у лиц, занимающихся
    тиражированием данного вида продукции.

    Сноска. Пункт 58 с изменением, внесенным постановлением Правления Национального Банка РК от 31.12.2019

    № 265

    (вводится в действие по истечении двадцати одного календарного дня после дня его официального опубликования).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:58
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p59:
  short: НБРК №49, пункт 59
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 59
  url: https://adilet.zan.kz/rus/docs/V1900018545#z181
  quote: '59. Годными к обращению законными платежными средствами признаются банкноты иностранной валюты, являющиеся законным
    средством наличного платежа на территории соответствующей страны эмитента (группы стран эмитента), а также соответствующие
    полному описанию, указанному в справочных материалах страны эмитента (группы стран эмитента).

    Сноска. Пункт 59 - в редакции постановления Правления Национального Банка РК от 26.09.2023

    № 72

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:59
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p60:
  short: НБРК №49, пункт 60
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 60
  url: https://adilet.zan.kz/rus/docs/V1900018545#z187
  quote: '60. Банкноты иностранной валюты признаются негодными к обращению, если они не соответствуют требованиям, предусмотренным
    пунктом 59 Правил, и (или) имеющие следующие повреждения:

    1) разорванные на части (в том числе склеенные липкой лентой);

    2) обожженные или прожженные;

    3) залитые красящими веществами площадью более 1 (одного) квадратного сантиметра;

    4) потертости и загрязнения, а также пятна, приведшие к свечению бумаги в ультрафиолетовых лучах ярко синим и (или) фиолетовым
    светом, самое крупное из которых в самой широкой части диаметром более 2 см или ободок по краю банкноты шириной более
    0,5 см;

    5) умышленного характера:

    изменены основные рисунки, в частности, портреты людей, удалена защитная нить;

    наличие посторонней надписи (надписей), состоящей из 2 (двух) и более знаков (символов), в том числе видимых в ультрафиолетовых
    лучах, за исключением знаков препинания;

    наличие более 2 (двух) отпечатков штампов и (или) штампов, свидетельствующих о том, что банкнота иностранной валюты является
    неподлинной или образцом;

    наличие сквозного отверстия (отверстий), прокола (проколов) диаметром более 1 (одного) миллиметра;

    6) утраченные углы или куски (площадью более 1 (одного) квадратного сантиметра);

    7) более 3 (трех) надрывов (в том числе заклеенных (склеенных) липкой лентой), длиной, превышающих одну четвертую часть
    ширины (длины) банкноты;

    8) изменившие геометрические размеры более чем на 3 (три) миллиметра, как в сторону уменьшения, так и в сторону увеличения;

    9) явный печатный брак (отсутствие или ненадлежащее расположение водяного знака или защитной нити, непропечатка или смазанность
    изображений);

    10) разрыхлены и (или) потеряли жесткость.

    Неплатежными признаются банкноты иностранной валюты, выведенные из обращения после даты, объявленной банком-эмитентом
    соответствующего иностранного государства.

    Сноска. Пункт 60 - в редакции постановления Правления Национального Банка РК от 26.09.2023

    № 72

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:60
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p60_1:
  short: НБРК №49, пункт 60-1
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 60-1
  url: https://adilet.zan.kz/rus/docs/V1900018545#z1963
  quote: '60-1. В случае невозможности отнесения к категории годных и (или) негодных к обращению банкнот иностранной валюты
    согласно пунктам 59 и 60 Правил, юридическое лицо, имеющее право на осуществление обменных операций с наличной иностранной
    валютой (его филиал), определяет степень годности и (или) негодности к обращению банкнот иностранной валюты согласно справочным
    рекомендациям стран эмитента центральных банков.

    Сноска. Правила дополнены пунктом 60-1 в соответствии с постановлением Правления Национального Банка РК от 26.09.2023

    № 72

    (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:60-1
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n49_p61:
  short: НБРК №49, пункт 61
  document: Об утверждении Правил осуществления обменных операций с наличной иностранной валютой в Республике Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 4 апреля 2019 года № 49. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 18 апреля 2019 года № 18545.
  clause: пункт 61
  url: https://adilet.zan.kz/rus/docs/V1900018545#z199
  quote: '61. Покупка и замена неплатежных, а также негодных к обращению банкнот иностранной валюты осуществляется уполномоченными
    банками, имеющими корреспондентские отношения и (или) договорные отношения с иностранными банками по осуществлению инкассовых
    операций с соответствующими иностранными валютами.

    Не допускается продажа клиентам уполномоченными банками неплатежных или негодных к обращению банкнот иностранной валюты,
    приобретенных и принятых в порядке замены. Указанные банкноты высылаются на инкассо в банки-эмитенты (иностранные банки)
    или сдаются на инкассо через их обслуживающие банки.

    В случае принятия на инкассо неплатежных или негодных к обращению банкнот иностранной валюты через свои обменные пункты
    уполномоченные банки предупреждают клиентов о размере комиссионного вознаграждения (включающего все расходы клиента) и
    возможности отказа банками-эмитентами (иностранными банками) в обмене указанных банкнот иностранной валюты, а также получают
    от клиента письменное согласие на условия инкассо. В случае отказа банка-эмитента (иностранного банка) в обмене отосланной
    иностранной валюты уполномоченные банки представляют клиенту соответствующие подтверждающие документы.

    Комиссионное вознаграждение, взимаемое за замену, покупку, прием на инкассо неплатежных или негодных к обращению банкнот
    иностранной валюты, устанавливается уполномоченными банками самостоятельно, но не должно превышать 10 (десяти) процентов
    от номинальной стоимости банкнот иностранной валюты, предъявляемых к обмену (покупке, приему на инкассо).'
  heading: Глава 6. Условия функционирования обменных пунктов
  spec: V1900018545:61
  source_sha256: af565d20ba223ad1230180e2c6656f020101c590da06aa538c249a709300a089
  source: corpus 2026-10-17
n231_p10_1:
  short: НБРК №231, пункт 10-1
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 10-1
  url: https://adilet.zan.kz/rus/docs/V1900019680#z457
  quote: '10-1. Кассовые операции с использованием цифровых документов осуществляются в соответствии с требованиями Цифрового
    кодекса Республики Казахстан (далее – Цифровой кодекс) и Закона Республики Казахстан "О кибербезопасности" (далее – Закон
    о кибербезопасности).

    Сноска. Правила дополнены пунктом 10-1 в соответствии с постановлением Правления Национального Банка РК от 19.12.2022

    № 125

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); в редакции
    постановления Правления Национального Банка РК от 16.03.2026

    № 25

    (вводится в действие с 12.07.2026).'
  heading: Параграф 1. Организация работы по осуществлению кассовых операций
  spec: V1900019680:10-1
