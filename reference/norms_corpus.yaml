tk_p184_2:
  short: Трудовой кодекс №414-V, статья 184, пункт 2
  document: Трудовой кодекс Республики Казахстан
  act: Кодекс Республики Казахстан от 23 ноября 2015 года № 414-V ЗРК.
  clause: статья 184, пункт 2
  url: https://adilet.zan.kz/rus/docs/K1500000414#z864
  quote: 2. Рабочее оборудование должно соответствовать нормам безопасности, установленным для данного вида оборудования,
    иметь соответствующие технические паспорта (сертификат), знаки предупреждения и обеспечиваться ограждениями или защитными
    устройствами для обеспечения безопасности работников на рабочих местах.
  heading: Статья 184. Требования безопасности рабочих мест
  spec: K1500000414:184.2
  source_sha256: 56ac42bbd68a7f2b68e50f18f0dc2215ede0ffbf8f251125640e5002af2f069d
  source: corpus 2026-10-17
tk_p184_2_1:
  short: Трудовой кодекс №414-V, статья 184, пункт 2-1
  document: Трудовой кодекс Республики Казахстан
  act: Кодекс Республики Казахстан от 23 ноября 2015 года № 414-V ЗРК.
  clause: статья 184, пункт 2-1
  url: https://adilet.zan.kz/rus/docs/K1500000414#z1383
  quote: 2-1. За ненадлежащее создание условий безопасности труда работодатель несет ответственность в соответствии с законами
    Республики Казахстан.
  heading: Статья 184. Требования безопасности рабочих мест
  spec: K1500000414:184.2-1
  source_sha256: 56ac42bbd68a7f2b68e50f18f0dc2215ede0ffbf8f251125640e5002af2f069d
  source: corpus 2026-10-17
tk_p184_3:
  short: Трудовой кодекс №414-V, статья 184, пункт 3
  document: Трудовой кодекс Республики Казахстан
  act: Кодекс Республики Казахстан от 23 ноября 2015 года № 414-V ЗРК.
  clause: статья 184, пункт 3
  url: https://adilet.zan.kz/rus/docs/K1500000414#z865
  quote: 3. Аварийные пути и выходы работников из помещения должны быть обозначены, оставаться свободными и выводить на открытый
    воздух либо в безопасную зону.
  heading: Статья 184. Требования безопасности рабочих мест
  spec: K1500000414:184.3
  source_sha256: 56ac42bbd68a7f2b68e50f18f0dc2215ede0ffbf8f251125640e5002af2f069d
  source: corpus 2026-10-17
tk_p184_4:
  short: Трудовой кодекс №414-V, статья 184, пункт 4
  document: Трудовой кодекс Республики Казахстан
  act: Кодекс Республики Казахстан от 23 ноября 2015 года № 414-V ЗРК.
  clause: статья 184, пункт 4
  url: https://adilet.zan.kz/rus/docs/K1500000414#z866
  quote: '4. Опасные зоны должны быть четко обозначены. Если рабочие места находятся в опасных зонах, в которых ввиду характера
    работы существует риск для работника, то такие места должны оснащаться устройствами, преграждающими доступ в эти зоны
    посторонним.

    По территории организации пешеходы и технологические транспортные средства должны перемещаться в безопасных условиях.'
  heading: Статья 184. Требования безопасности рабочих мест
  spec: K1500000414:184.4
  source_sha256: 56ac42bbd68a7f2b68e50f18f0dc2215ede0ffbf8f251125640e5002af2f069d
  source: corpus 2026-10-17
