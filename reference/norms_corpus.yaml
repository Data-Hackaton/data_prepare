  short: НБРК №231, пункт 59
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 59
  url: https://adilet.zan.kz/rus/docs/V1900019680#z198
  quote: '59. При обнаружении сомнительных банкнот и монет кассовый работник в присутствии клиента и заведующего кассой или
    лица, осуществляющего его функции, составляет акт о приеме на экспертизу сомнительных банкнот и монет в двух экземплярах
    по форме, определенной банком самостоятельно, в котором указываются дата, фамилия, имя, отчество (при его наличии) кассового
    работника банка, обнаружившего сомнительные банкноты и монеты, фамилия, имя, отчество (при его наличии) клиента, номинал
    банкнот и монет, номера и серии банкнот, а также характерные признаки сомнительности банкнот и монет, один из которых
    остается в банке, второй выдается клиенту.

    Сомнительные банкноты и монеты в течение пяти рабочих дней направляются на экспертизу в филиал Национального Банка.

    В случае получении от филиала Национального Банка результатов экспертизы о признании банкнот и монет платежными, осуществляется
    возврат банкнот и монет клиенту на основании его экземпляра акта о приеме на экспертизу сомнительных банкнот и монет.

    В случае признания банкнот и монет неплатежными, банкноты и монеты возврату не подлежат, клиенту выдается результат экспертизы
    банкнот и монет.'
  heading: Параграф 5. Порядок работы с сомнительными, неплатежными, имеющими признаки подделки наличными деньгами
  spec: V1900019680:59
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p60:
  short: НБРК №231, пункт 60
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 60
  url: https://adilet.zan.kz/rus/docs/V1900019680#z202
  quote: '60. Об обнаружении банкнот и монет, имеющих признаки подделки, сообщается в правоохранительные органы.

    Банкноты и монеты, имеющие признаки подделки, подлежат изъятию правоохранительными органами на основании протокола об
    изъятии банкнот и монет, имеющих признаки подделки, один экземпляр, которого выдается клиенту.'
  heading: Параграф 5. Порядок работы с сомнительными, неплатежными, имеющими признаки подделки наличными деньгами
  spec: V1900019680:60
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p61:
  short: НБРК №231, пункт 61
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 61
  url: https://adilet.zan.kz/rus/docs/V1900019680#z204
  quote: 61. Банкноты и монеты, имеющие признаки подделки, клиенту не возвращаются, сумма принятых банкнот и монет на банковский
    счет клиента не зачисляется.
  heading: Параграф 5. Порядок работы с сомнительными, неплатежными, имеющими признаки подделки наличными деньгами
  spec: V1900019680:61
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p63_4:
  short: НБРК №231, пункт 63-4
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 63-4
  url: https://adilet.zan.kz/rus/docs/V1900019680#z469
  quote: '63-4. Банк, инкассаторская организация принимает от клиента банкноты, окрашенные специальной краской, в соответствии
    с требованиями пункта 59 Правил.

    К акту о приеме на экспертизу сомнительных банкнот прилагается акт о срабатывании спецконтейнера, составленный в произвольной
    форме и подписанный клиентом, в котором указывается:

    1) дата обнаружения факта срабатывания спецконтейнера;

    2) обстоятельства обнаружения факта срабатывания спецконтейнера;

    3) причина окраски банкнот специальной краской (санкционированное или несанкционированное вскрытие спецконтейнера);

    4) характеристики специальной краски;

    5) наименование организации - изготовителя специальной краски.

    Акт о срабатывании спецконтейнера составляется в трех экземплярах, первый экземпляр из которых остается у клиента, второй
    экземпляр в банке, инкассаторской организации, третий экземпляр направляется вместе с окрашенными банкнотами в филиал
    Национального Банка.'
  heading: Параграф 5-1. Порядок работы с наличными деньгами, окрашенными специальной краской
  spec: V1900019680:63-4
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p63_5:
  short: НБРК №231, пункт 63-5
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 63-5
  url: https://adilet.zan.kz/rus/docs/V1900019680#z477
  quote: '63-5. Банком, инкассаторской организацией при передаче на экспертизу в филиал Национального Банка банкноты, окрашенные
    специальной краской, высушиваются, полистно пересчитываются и упаковываются в мешок без наружных швов, на ярлыке к которому
    проставляется:

    1) полное наименование банка, инкассаторской организации;

    2) банковский идентификационный код банка, инкассаторской организации;

    3) номиналы и количество банкнот, окрашенных специальной краской, по каждому номиналу;

    4) сумма банкнот, окрашенных специальной краской;

    5) дата упаковки банкнот, окрашенных специальной краской;

    6) фамилия, инициалы и подпись работника банка, инкассаторской организации, производившего упаковку банкнот, окрашенных
    специальной краской;

    7) штамп или надпись "Банкноты, окрашенные специальной краской".'
  heading: Параграф 5-1. Порядок работы с наличными деньгами, окрашенными специальной краской
  spec: V1900019680:63-5
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p64:
  short: НБРК №231, пункт 64
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 64
  url: https://adilet.zan.kz/rus/docs/V1900019680#z208
  quote: 64. После окончания рабочего дня заведующий кассой или лицо, осуществляющее его функции, на основании приходных и
    расходных кассовых документов, полученных от кассовых работников, составляет сводный документ о кассовых оборотах за день
    по форме, определенной банком самостоятельно, сверяет ее итоги с данными бухгалтерского учета и подшивает в кассовые документы
    дня.
  heading: Параграф 6. Порядок завершения дня и формирования кассовых документов
  spec: V1900019680:64
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
