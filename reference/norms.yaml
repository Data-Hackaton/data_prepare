# Нормативы для правил decision. Цитаты сверены с текстом на adilet.zan.kz 17.10.2026.
# Без подтверждённого документа норматив не заводим: правило ссылается на null и в отчёт без ссылки не выводится.

n231_p12:
  document: >-
    Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня,
    филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах,
    исключительной деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231
  clause: пункт 12
  url: https://adilet.zan.kz/rus/docs/V1900019680#z81
  quote: >-
    Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла
    в порядке, установленном внутренними документами банка.

n231_p20:
  document: >-
    Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня,
    филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах,
    исключительной деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231
  clause: пункт 20
  url: https://adilet.zan.kz/rus/docs/V1900019680#z111
  quote: >-
    Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.
    На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги
    хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ,
    предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).
