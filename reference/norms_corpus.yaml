n231_p106:
  short: НБРК №231, пункт 106
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 106
  url: https://adilet.zan.kz/rus/docs/V1900019680#z288
  quote: '106. Форма препроводительного документа устанавливается банком, осуществляющим инкассацию, банкнот, монет и ценностей,
    инкассаторской организацией, которая содержит следующие сведения:

    1) номер препроводительного документа;

    2) дата формирования сумки;

    3) наименование или фамилия, имя, отчество (при его наличии) клиента;

    4) наименование банка, принимающего сумку;

    5) общая сумма банкнот, монет и ценностей в сумке;

    6) опись банкнот, монет и ценностей по номиналам, количеству и сумме каждого номинала;

    7) номер пломбы, которым опломбирована сумка;

    8) фамилия, имя, отчество (при его наличии), должность и подпись клиента.

    Препроводительный документ составляется в трех экземплярах для клиента, банка и инкассатора-сборщика. После осуществления
    доставки и сдачи сумки препроводительный документ инкассатор-сборщик сдает препроводительный документ руководителю или
    дежурному инкассатору подразделения инкассации банка, инкассаторской организации, который подшивается в отдельную папку
    и хранится не менее 1 (одного) года.

    Сноска. Пункт 106 - в редакции постановления Правления Национального Банка РК от 10.11.2025

    № 71

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 2. Порядок осуществления приема, сбора, доставки и сдачи банкнот, монет и ценностей
  spec: V1900019680:106
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p107:
  short: НБРК №231, пункт 107
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 107
  url: https://adilet.zan.kz/rus/docs/V1900019680#z298
  quote: '107. Прием банкнот, монет и ценностей от клиентов осуществляется инкассатором-сборщиком, который проверяет:

    1) целостность сумки;

    2) правильность пломбирования (целостность шпагата, на котором закреплена пломба, ясность оттиска пломбиратора, тождественность
    его образцу);

    3) правильность заполнения явочной карточки клиентом;

    4) указание на препроводительном документе сведений, предусмотренных пунктом 106 Правил.

    Сноска. Пункт 107 с изменением, внесенным постановлением Правления Национального Банка РК от 19.12.2022

    № 125

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Параграф 2. Порядок осуществления приема, сбора, доставки и сдачи банкнот, монет и ценностей
  spec: V1900019680:107
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p108:
  short: НБРК №231, пункт 108
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 108
  url: https://adilet.zan.kz/rus/docs/V1900019680#z303
  quote: 108. В целях осуществления сбора банкнот, монет и ценностей старший бригады работников подразделения инкассации банка,
    инкассаторской организации принимает от инкассатора-сборщика явочную карточку и сумку с банкнотами, монетами и ценностями.
    Старший бригады работников подразделения инкассации банка, инкассаторской организации проверяет сумку в соответствии с
    пунктом 107 Правил, возвращает инкассатору-сборщику явочную карточку и выдает ему порожнюю сумку следующего клиента.
  heading: Параграф 2. Порядок осуществления приема, сбора, доставки и сдачи банкнот, монет и ценностей
  spec: V1900019680:108
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p111:
  short: НБРК №231, пункт 111
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 111
  url: https://adilet.zan.kz/rus/docs/V1900019680#z308
  quote: 111. Перевозка банкнот, монет и ценностей осуществляется при наличии доверенности на перевозку банкнот, монет и ценностей
    у старшего бригады работников подразделения инкассации банка, инкассаторской организации, подписанной руководителем банка,
    осуществляющего инкассацию, банкнот, монет и ценностей, инкассаторской организации или лицами, их замещающими, с указанием
    клиента, суммы перевозимых банкнот, монет и ценностей цифрами и прописью, инкассаторов, входящих в состав бригады, назначенной
    для перевозки банкнот, монет и ценностей, срока действия доверенности.
  heading: Параграф 3. Порядок осуществления перевозки банкнот, монет и ценностей
  spec: V1900019680:111
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p112:
  short: НБРК №231, пункт 112
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 112
  url: https://adilet.zan.kz/rus/docs/V1900019680#z309
  quote: '112. Прием банкнот, монет и ценностей бригадой работников подразделения инкассации банка, инкассаторской организации
    для перевозки осуществляется на основании расходных кассовых или внебалансовых ордеров, подписанных клиентом-отправителем
    с проверкой целостности упаковки пачки с банкнотами, мешка с монетами, количества корешков в каждой пачке с банкнотами,
    правильности сведений, указанных на накладке пачки с банкнотами и на ярлыке прикрепленному к мешку с монетами, целостности
    и ясности оттиска пломбиратора, клише на упаковке пачки с банкнотами.

    Пачки банкнот и мешки с монетами и ценностями, имеющие дефекты упаковки и оформления, обнаруженные бригадой работников
    подразделения инкассации банка, инкассаторской организации при их проверке, не принимаются.'
  heading: Параграф 3. Порядок осуществления перевозки банкнот, монет и ценностей
  spec: V1900019680:112
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
n231_p113:
  short: НБРК №231, пункт 113
  document: Об утверждении Правил осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
    второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной
    деятельностью которых является инкассация банкнот, монет и ценностей
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 3 декабря 2019 года № 19680.
  clause: пункт 113
  url: https://adilet.zan.kz/rus/docs/V1900019680#z311
  quote: '113. После проверки банкнот, монет и ценностей бригада работников подразделения инкассации банка, инкассаторской
    организации упаковывает их в сумки при присутствии клиента-отправителя.

    Горловина каждой сумки прошивается и плотно завязывается шпагатом, на концы шпагата прикрепляется ярлык из ткани, на котором
    указываются дата упаковки и порядковый номер сумки, соответствующий номеру в описи перевозимых банкнот, монет и ценностей
    по форме согласно приложению 5 к Правилам, концы шпагата завязываются глухим узлом, сумка пломбируется и ярлык на нем
    подписывается клиентом-отправителем.

    После приема банкнот, монет и ценностей бригада работников подразделения инкассации банка, инкассаторской организации
    расписываются в расходных кассовых или внебалансовых ордерах клиента-отправителя.'
  heading: Параграф 3. Порядок осуществления перевозки банкнот, монет и ценностей
  spec: V1900019680:113
  source_sha256: 1798a349b2326ba4c32a007a62db532ea6de906e71f0249a9de8dc81aa915de8
  source: corpus 2026-10-17
