law73_p6_4:
  short: Закон о документах, удостоверяющих личность №73-V, статья 6, пункт 4
  document: О документах, удостоверяющих личность
  act: Закон Республики Казахстан от 29 января 2013 года № 73-V.
  clause: статья 6, пункт 4
  url: https://adilet.zan.kz/rus/docs/Z1300000073#z216
  quote: '4. Документы, удостоверяющие личность, используемые и представляемые физическим и юридическим лицам посредством
    сервиса цифровых документов, равнозначны документам на бумажном носителе, кроме случаев, определенных законодательством
    Республики Казахстан в сфере документов, удостоверяющих личность.

    Сноска. Статья 6 с изменениями, внесенными законами РК от 04.07.2014 № 233-V (вводится в действие с 01.01.2015); от 13.05.2020

    № 327-VI

    (вводится в действие с 01.01.2021); от 14.07.2022

    № 141-VII

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 16.05.2024

    № 82-VIII

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Статья 6. Документы, удостоверяющие личность
  spec: Z1300000073:6.4
  source_sha256: 8ac1510232eacf7a015d11c0a67e271d2220d598ddb0a85286dcbc2ba00ab7a1
  source: corpus 2026-10-17
law94_p11_1:
  short: Закон о персональных данных №94-V, статья 11, пункт 1
  document: О персональных данных и их защите
  act: Закон Республики Казахстан от 21 мая 2013 года N 94-V.
  clause: статья 11, пункт 1
  url: https://adilet.zan.kz/rus/docs/Z1300000094#z27
  quote: 1. Собственники и (или) операторы, а также третьи лица, получающие доступ к персональным данным ограниченного доступа,
    обеспечивают их конфиденциальность путем соблюдения требований не допускать их распространения без согласия субъекта или
    его законного представителя либо наличия иного законного основания.
  heading: Статья 11. Конфиденциальность персональных данных
  spec: Z1300000094:11.1
  source_sha256: c340e815c5d11f01146820aab2e8f7d8168e378491e64da684d8e93a028436f6
  source: corpus 2026-10-17
law94_p11_2:
  short: Закон о персональных данных №94-V, статья 11, пункт 2
  document: О персональных данных и их защите
  act: Закон Республики Казахстан от 21 мая 2013 года N 94-V.
  clause: статья 11, пункт 2
  url: https://adilet.zan.kz/rus/docs/Z1300000094#z28
  quote: 2. Лица, которым стали известны персональные данные ограниченного доступа в связи с профессиональной, служебной необходимостью,
    а также трудовыми отношениями, обязаны обеспечивать их конфиденциальность.
  heading: Статья 11. Конфиденциальность персональных данных
  spec: Z1300000094:11.2
  source_sha256: c340e815c5d11f01146820aab2e8f7d8168e378491e64da684d8e93a028436f6
  source: corpus 2026-10-17
law94_p22_1:
  short: Закон о персональных данных №94-V, статья 22, пункт 1
  document: О персональных данных и их защите
  act: Закон Республики Казахстан от 21 мая 2013 года N 94-V.
  clause: статья 22, пункт 1
  url: https://adilet.zan.kz/rus/docs/Z1300000094#z54
  quote: '1. Собственник и (или) оператор, а также третье лицо обязаны принимать необходимые меры по защите персональных данных
    в соответствии с настоящим Законом и порядком, определяемым уполномоченным органом, обеспечивающие:

    1) предотвращение несанкционированного доступа к персональным данным;

    2) своевременное обнаружение фактов несанкционированного доступа к персональным данным, если такой несанкционированный
    доступ не удалось предотвратить;

    3) минимизацию неблагоприятных последствий несанкционированного доступа к персональным данным;

    4) предоставление доступа государственной технической службе к цифровым объектам, использующим, хранящим, обрабатывающим
    и распространяющим персональные данные ограниченного доступа, содержащиеся в цифровых ресурсах, для осуществления обследования
    обеспечения защищенности процессов хранения, обработки и распространения персональных данных ограниченного доступа, содержащихся
    в цифровых ресурсах в порядке, определяемом уполномоченным органом.

    5) регистрацию и учет действий, предусмотренных подпунктами 3), 4), 5) и 6) пункта 4 статьи 8 настоящего Закона.'
  heading: Статья 22. Обязанности собственника и (или) оператора, а также третьего лица по защите персональных данных
  spec: Z1300000094:22.1
  source_sha256: c340e815c5d11f01146820aab2e8f7d8168e378491e64da684d8e93a028436f6
  source: corpus 2026-10-17
law258_p69_1:
  short: Закон о банках №258-VIII, статья 69, пункт 1
  document: О банках и банковской деятельности в Республике Казахстан
  act: Закон Республики Казахстан от 16 января 2026 года № 258-VIII ЗРК.
  clause: статья 69, пункт 1
  url: https://adilet.zan.kz/rus/docs/Z2600000258#z1621
  quote: '1. Банковская тайна включает в себя сведения о клиентах и корреспондентах банков, их операциях и взаимоотношениях
    с банками, связанных с получением банковских услуг, в том числе без ограничения, информацию о (об):

    наличии, владельцах и номерах банковских счетов и корреспондентов банков;

    остатках и движении денег на этих счетах и счетах самого банка;

    ограничениях на перечисленных счетах (решениях и (или) распоряжениях государственных органов о приостановлении расходных
    операций, арестах, залогах);

    операциях клиентов и корреспондентов, и самого банка (за исключением общих условий осуществления банковской деятельности);

    наличии, владельцах, характере и стоимости имущества клиентов, находящегося на хранении в сейфовых ящиках, шкафах и помещениях
    банка;

    получении клиентами займов (кроме случаев, определенных настоящей статьей);

    проведении операций по платежам и (или) переводам денег, в том числе выполненным без открытия банковского счета.

    Не относятся к банковской тайне сведения о займах, выданных и (или) полученных ликвидируемым банком до начала процедуры
    его ликвидации.'
  heading: Статья 69. Банковская тайна
  spec: Z2600000258:69.1
  source_sha256: 6f4505e4cc4564f77ef384d7ea927692d8c2390fbc43d6a7411ef4c617237694
  source: corpus 2026-10-17
law258_p69_2:
  short: Закон о банках №258-VIII, статья 69, пункт 2
  document: О банках и банковской деятельности в Республике Казахстан
  act: Закон Республики Казахстан от 16 января 2026 года № 258-VIII ЗРК.
  clause: статья 69, пункт 2
  url: https://adilet.zan.kz/rus/docs/Z2600000258#z1630
  quote: 2. Банк гарантирует тайну об операциях и о счетах своих клиентов и корреспондентов, а также тайну имущества, находящегося
    на хранении в сейфовых ящиках, шкафах и помещениях банков, и иных сведений, составляющих банковскую тайну согласно настоящей
    статье.
  heading: Статья 69. Банковская тайна
  spec: Z2600000258:69.2
  source_sha256: 6f4505e4cc4564f77ef384d7ea927692d8c2390fbc43d6a7411ef4c617237694
  source: corpus 2026-10-17
