# Каталог нарушений по видео с меткой «нарушение» (source: reference_r0).
# Журнал действий в том же формате, что actions.yaml. `reference-actions` проверяет, что шаблоны
# сценариев (scenarios.yaml) ловят каждое нарушение: хотя бы один инвариант или шаг не по шаблону
# должен сработать рядом с размеченной секундой. Если не ловит — шаблон надо дополнить.
# confirmed: true — тип нарушения подтверждён человеком. label_t — секунда или список секунд (несколько эпизодов в видео).
# norm — id из norms.yaml, его дал человек; без norm берётся норматив сработавшего правила (если есть).

X-1:
  scene: A
  label_t: 22
  type: Присвоение части наличных
  description: >-
    Кассир забирает пачку из счётной машинки, делит её на две части (была одна пачка — стало две),
    одну часть отдаёт клиенту, вторую оставляет у себя внизу, у колен: ни в машинку, ни в сейф, ни клиенту.
  confirmed: true
  evidence: {split: [20.75, 21.75], give: [22.0, 23.0], keep: [23.0, 25.75]}
  instances:
    - scenario: client_service
      actions:
        - {t: 1, action: person_enter, actor: client}
        - {t: 5.5, t_end: 6.5, action: give, actor: client, object: id_card, target: cashier}
        - {t: 7, t_end: 8, action: inspect, actor: cashier, object: id_card}
        - {t: 9.5, t_end: 10.5, action: give, actor: client, object: banknotes, target: cashier}
        - {t: 14, t_end: 15, action: put, actor: cashier, object: banknotes, target: cash_machine}
        - {t: 19, t_end: 19.75, action: take, actor: cashier, object: banknotes, target: cash_machine}
        - {t: 20.75, t_end: 21.75, action: split_bundle, actor: cashier, object: banknotes}
        - {t: 22, t_end: 23, action: give, actor: cashier, object: banknotes, target: client}
        - {t: 23, t_end: 25.75, action: keep, actor: cashier, object: banknotes}

