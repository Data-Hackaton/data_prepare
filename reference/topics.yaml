# Сгенерировано python -m data_prepare.corpus_import из reference/normative_coverage — не править вручную.
# Корпус: Эталонные процедуры по открытым нормам РК, 2026-10-17. Модель восстановлена из публичных норм; не является утверждённым внутренним регламентом ForteBank.
# Процедуры проверки по темам. observability шага: partly_observable — видно частично, context_required — нужен контекст, not_visually_verifiable — по видео не проверяется.
# check — что установить человеку; limits — исключения и границы вывода.
personal_items:
  title: Личные вещи или личные деньги в кассовом узле
  domain: Кассовая операция
  procedure_type: standing_condition
  actor: Кассовый работник; банк устанавливает места хранения
  applicability: Предмет принадлежит работнику и находится именно в кассовом узле.
  expected_outcome: В кассовом узле отсутствует неподпадающее под исключения личное имущество работников.
  steps:
  - action: Разместить личные вещи, деньги и ценности вне кассового узла по установленному банком порядку.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p12
  - action: При проверке отличить личное имущество работника от имущества клиента и допускаемых предметов.
    kind: review_check
    observability: context_required
    norms:
    - n231_p12
  exceptions:
  - kind: express_normative_exception
    condition: Лекарственные средства, медицинские изделия, средства связи без фото- и видеофиксации.
    behavior: Допускается внос в кассовый узел.
    norms:
    - n231_p12
  check:
  - Принадлежность и функции предмета
  - Граница кассового узла
  limits: Нужно уверенно видеть личный предмет именно у сотрудника и в кассовом узле. Лекарства, медицинские изделия и средства
    связи без фото и видеофиксации допускаются. Вид телефона клиента не является нарушением этого пункта.
  norms:
  - n231_p12
deposit_count:
  title: Приём наличных без видимого пересчёта
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Приём наличных от клиента, а не отдельный служебный пересчёт или приём сумки.
  expected_outcome: Поступившие деньги пересчитаны и проверены при клиенте.
  steps:
  - action: Принять банкноты с полистным пересчётом, монеты — по кружкам, с проверкой подлинности и платёжности; п.19 пп.2).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p19
  - action: Принимать и пересчитывать наличные в присутствии клиента.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
  - action: Подтвердить полный этап пересчёта и результат, не заменяя его впечатлением от редких кадров.
    kind: review_check
    observability: context_required
    norms:
    - n231_p19
    - n231_p20
  exceptions:
  - kind: permitted_alternative
    condition: Применён машинный пересчёт.
    behavior: Проверять фактический пересчёт и проверку денег; ручное перелистывание не является единственным способом исполнения.
    norms:
    - n231_p19
    - n231_p20
  check:
  - Весь этап приёма
  - Движение и принадлежность денег
  - Результат работы прибора при наличии
  limits: Нужен весь эпизод приёма. Пересчёт может быть машинным. Отсутствие действия на редких кадрах не доказывает его отсутствия
    в видео.
  norms:
  - n231_p19
  - n231_p20
client_presence:
  title: Пересчёт принятой наличности без клиента
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Определены текущий клиент и операция приёма его денег.
  expected_outcome: Приём и пересчёт текущей суммы происходят в присутствии клиента.
  steps:
  - action: Принимать деньги в присутствии клиента.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
  - action: Пересчитывать принимаемые деньги при присутствующем клиенте; проверяющему учитывать весь ракурс и границы эпизода.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
  exceptions:
  - kind: applicability_limit
    condition: Это отдельный служебный пересчёт ранее принятых денег.
    behavior: Применить профиль control_count; требование присутствия именно этого клиента не переносится автоматически.
    norms:
    - n231_p20
  check:
  - Тип операции
  - Положение клиента на всём этапе
  limits: Нужно установить именно приём текущего клиента; отдельный служебный пересчёт регулируется иначе.
  norms:
  - n231_p20
previous_cash_storage:
  title: Ранее принятые деньги остаются вне устройства хранения
  domain: Кассовая операция
  procedure_type: standing_condition
  actor: Кассовый работник
  applicability: Деньги идентифицированы как ранее принятые, а не наличные текущего клиента.
  expected_outcome: Ранее принятые деньги находятся в предусмотренном устройстве хранения.
  steps:
  - action: На рабочем месте оставлять деньги текущего клиента; ранее принятые деньги хранить в предназначенном для хранения
      устройстве, закрывающемся на ключ.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
  - action: При проверке проследить, к какой операции относятся деньги и что является устройством хранения.
    kind: review_check
    observability: context_required
    norms:
    - n231_p20
  exceptions:
  - kind: applicability_limit
    condition: Открытие рабочего сейфа или ящика для выполнения операции.
    behavior: Само по себе не подтверждает несоблюдение п.20; пункт описывает вид устройства и хранение прежних денег.
    norms:
    - n231_p20
  check:
  - Связь денег с завершённой операцией
  - Устройство хранения
  limits: Отличить деньги прежнего клиента от наличности текущей операции. Пункт требует устройство, закрывающееся на ключ;
    краткое открытие ящика во время работы само по себе не нарушение.
  norms:
  - n231_p20
separate_receipts:
  title: Совместный приём денег по нескольким приходным документам
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Один клиент вносит деньги по нескольким приходным кассовым документам.
  expected_outcome: Приём разделён по приходным документам.
  steps:
  - action: Соотнести каждую принимаемую сумму с отдельным приходным документом.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p21
  - action: Принимать наличные по каждому приходному документу отдельно.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p21
  exceptions:
  - kind: evidence_limit
    condition: В кадре несколько листов, но несколько приходных документов не установлены.
    behavior: Не применять ветку нескольких документов по одному числу листов.
    norms:
    - n231_p21
  check:
  - Вид и количество приходных документов
  - Принадлежность каждой суммы
  limits: Число документов и связь денег с каждым из них должны быть видны. Несколько листов не обязательно несколько приходных
    документов.
  norms:
  - n231_p21
leave_workplace:
  title: Кассир покидает место до конца обслуживания
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Подтверждены приём наличных и незавершённое обслуживание клиента.
  expected_outcome: В период незавершённого обслуживания рабочее место не покинуто.
  steps:
  - action: Оставаться на рабочем месте до окончания обслуживания клиента.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p22
  - action: До оценки ухода установить окончание обслуживания и границы рабочего места.
    kind: review_check
    observability: context_required
    norms:
    - n231_p22
  exceptions:
  - kind: applicability_limit
    condition: Обслуживание завершено либо человек переместился внутри рабочего места.
    behavior: Пункт 22 сам по себе не доказывает нарушение; отдельные обязанности хранения проверяются отдельно.
    norms:
    - n231_p22
  check:
  - Непрерывный эпизод обслуживания
  - Границы места и момент ухода
  limits: Должны быть видны уход и незавершённое обслуживание. Поворот к сейфу или вставание в пределах рабочего места недостаточны.
  norms:
  - n231_p22
deposit_receipt:
  title: Не выдан документ о приёме денег
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Завершён приём наличных; известна применимая форма подтверждения.
  expected_outcome: Клиент получил надлежащее подтверждение приёма денег.
  steps:
  - action: Оформить подтверждение приёма наличных и выдать его клиенту; п.19 пп.6).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p19
  - action: Для цифрового варианта проверить применимость кассовой операции с цифровыми документами и факт предоставления
      документа.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p10_1
  exceptions:
  - kind: permitted_alternative
    condition: Используются цифровые документы по п.10-1.
    behavior: Отсутствие передачи бумажного листа не доказывает отсутствие подтверждения; надлежащая цифровая процедура требует
      проверки.
    norms:
    - n231_p10_1
    - n231_p19
  check:
  - Конец операции
  - Бумажный документ либо подтверждённая цифровая выдача
  limits: Пункт 19 подпункт 6. Нужен полный конец операции; проверить возможность цифрового документа по пункту 10-1.
  norms:
  - n231_p10_1
  - n231_p19
withdrawal_count:
  title: Выдача без пересчёта в присутствии клиента
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Выдача наличных клиенту; установлены вид денег и состояние упаковки.
  expected_outcome: Выдача сопровождается предусмотренным для данной упаковки пересчётом при клиенте.
  steps:
  - action: Пересчитать подготовленные к выдаче деньги в присутствии клиента и выдать; п.31 пп.4).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p31
  - action: Для выдачи по упаковке применить правила п.32; банкноты из неполных и повреждённых корешков пересчитывать полистно,
      монеты из неполных мешков — по кружкам.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p32
  exceptions:
  - kind: express_normative_exception
    condition: Предусмотренная п.32 неповреждённая упаковка пачек/корешков либо монет.
    behavior: Допускается выдача по обозначенным суммам/надписям без полистного пересчёта; проверить конкретный вид упаковки.
    norms:
    - n231_p32
  check:
  - Состояние упаковки
  - Полный эпизод выдачи
  - Присутствие клиента
  limits: Пункт 31 подпункт 4. Неповреждённые пачки и корешки допускают выдачу без полистного пересчёта по пункту 32; это
    обязательное исключение.
  norms:
  - n231_p31
  - n231_p32
withdrawal_receipt:
  title: Не выдан документ о выдаче денег
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Завершена выдача наличных клиенту.
  expected_outcome: Выдача денег подтверждена документом для клиента.
  steps:
  - action: Выдать клиенту документ о проведённой выдаче; п.31 пп.6).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p31
  - action: Проверить форму и способ предоставления подтверждения, включая применимый цифровой документооборот.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p10_1
  exceptions:
  - kind: permitted_alternative
    condition: Применим цифровой документ.
    behavior: Проверять предоставление документа по цифровой процедуре; бумажный лист не является единственным видимым признаком
      исполнения.
    norms:
    - n231_p10_1
    - n231_p31
  check:
  - Завершение выдачи
  - Подтверждение получения документа
  limits: Пункт 31 подпункт 6. По отсутствию бумажного листа нельзя исключить цифровое подтверждение.
  norms:
  - n231_p10_1
  - n231_p31
identity_procedure:
  title: Не наблюдается проверка документа клиента
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник; проверяющий не идентифицирует лица по записи
  applicability: Операция приёма или выдачи наличных; этап идентификации входит в наблюдаемый процесс.
  expected_outcome: Работник выполнил требуемую идентификацию; видеосистема не распознаёт личность клиента.
  steps:
  - action: При приёме провести визуальную идентификацию клиента по документу или данным сервиса цифровых документов; п.19
      пп.1).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p19
  - action: При выдаче применить идентификацию по п.31 пп.1); при оценке подтвердить используемый канал документа.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p31
  - action: Учитывать равнозначность документа из сервиса цифровых документов бумажному, кроме установленных законом случаев.
    kind: required_action
    observability: partly_observable
    norms:
    - law73_p6_4
  exceptions:
  - kind: evidence_limit
    condition: Нет видимой пластиковой карточки.
    behavior: Проверить цифровой канал; отсутствие карточки не доказывает отсутствие идентификации.
    norms:
    - law73_p6_4
    - n231_p19
    - n231_p31
  check:
  - Канал предъявления документа
  - Полный этап операции
  - Подтверждение проверки без биометрической идентификации моделью
  limits: Подпункт 1 соответствующего пункта. Возможны цифровые документы и проверка на экране. Лица не распознавать и не
    идентифицировать; отсутствие видимого удостоверения ещё не доказательство.
  norms:
  - n231_p19
  - n231_p31
  - law73_p6_4
cash_document_execution:
  title: Возможный пропуск подписи или штампа
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник; операционный работник при участии
  applicability: Определены приходная/расходная операция и применимая форма документа.
  expected_outcome: Документ оформлен с предусмотренными подписями и удостоверением для применимой формы.
  steps:
  - action: При приёме проверить подписи клиента и участвующего операционного работника по п.19 пп.3), подписать и проштамповать
      все экземпляры по пп.5).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p19
  - action: При выдаче проверить подписи по п.31 пп.2), подписать и проштамповать экземпляры по пп.5).
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p31
  - action: Для цифровых документов установить применимую процедуру оформления; не оценивать подлинность подписей по жестам.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p10_1
  exceptions:
  - kind: permitted_alternative
    condition: Документы оформляются в цифровом виде.
    behavior: Проверить надлежащее цифровое оформление; отсутствие рукописного движения или бумажного штампа отдельно не доказывает
      нарушение.
    norms:
    - n231_p10_1
    - n231_p19
    - n231_p31
  check:
  - Тип документа
  - Читаемые реквизиты или цифровой журнал
  - Участие операционного работника
  limits: Подпункты 3 и 5 пункта 19, подпункты 2 и 5 пункта 31. Содержание и подлинность подписей обычно неразличимы; возможны
    цифровые документы.
  norms:
  - n231_p10_1
  - n231_p19
  - n231_p31
exchange_sequence:
  title: Размен до завершения выдачи приготовленных денег
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Клиент требует размен уже подготовленной к выдаче суммы на другие номиналы.
  expected_outcome: Размен выполняется после выдачи приготовленных денег.
  steps:
  - action: Выдать клиенту подготовленные наличные.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p34
  - action: После выдачи выполнить требуемый размен одного номинала на другие.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p34
  exceptions:
  - kind: applicability_limit
    condition: Требование размена не установлено либо это подготовка первоначальной выдачи.
    behavior: Не объявлять изменение состава суммы нарушением п.34 без подтверждения ветки.
    norms:
    - n231_p34
  check:
  - Назначение операций
  - Последовательность выдачи и размена
  limits: Нужна последовательность выдачи и последующего размена. Без звука намерение клиента может быть неизвестно.
  norms:
  - n231_p34
control_count:
  title: Служебный пересчёт без контролирующего работника
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый и контролирующий работники
  applicability: Служебные пересчёт, сортировка или упаковка наличных.
  expected_outcome: На операции, подпадающей под п.42, присутствует контролирующий работник.
  steps:
  - action: Определить, относится ли операция к служебной обработке либо к приёму/выдаче клиенту.
    kind: applicability_check
    observability: context_required
    norms:
    - n231_p42
  - action: Служебные пересчёт, сортировку и упаковку проводить в присутствии контролирующего работника.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p42
  exceptions:
  - kind: express_normative_exception
    condition: Приём или выдача наличных непосредственно клиенту.
    behavior: 'Исключение п.42: обязательное присутствие контролирующего работника этим пунктом не устанавливается.'
    norms:
    - n231_p42
  check:
  - Тип операции
  - Полный обзор и подтверждение роли контролёра
  limits: Исключение прямо касается приёма и выдачи клиенту. Невидимый за пределами кадра контролёр исключает уверенный вывод.
  norms:
  - n231_p42
authentication_equipment:
  title: Не наблюдается проверка на счётном оборудовании
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Банк обеспечивает оборудование; кассовый работник выполняет проверку
  applicability: Определены операция, валюта и характеристики оборудования.
  expected_outcome: Деньги проверены предусмотренным для валюты способом на подходящем оборудовании.
  steps:
  - action: Обеспечить специальное оборудование для определения подлинности и платёжности.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p9
  - action: При приёме проверять деньги по п.19 пп.2); при пересчёте и сортировке использовать оборудование с проверкой не
      менее двух машиночитаемых признаков по п.41.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p19
    - n231_p41
  - action: Для тенге применять Правила №230; для иностранной валюты — официальные образцы/справочники и требования Правил
      №49.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p57
    - n231_p58
  exceptions:
  - kind: evidence_limit
    condition: Отдельная УФ-лампа не видна.
    behavior: Проверить функции применяемого оборудования; корпус устройства не доказывает ни наличие, ни отсутствие нужных
      проверок.
    norms:
    - n231_p9
    - n231_p41
    - n231_p58
  check:
  - Технические характеристики прибора
  - Вид валюты и операции
  - Результат проверки
  limits: Нельзя определять возможности оборудования по корпусу, отсутствие УФ-лампы не доказывает нарушения. Подлинность
    банкнот по общему виду не устанавливать.
  norms:
  - n231_p19
  - n231_p41
  - n231_p57
  - n231_p58
  - n231_p9
bag_acceptance:
  title: Пропуск проверки сумки или пломбы при приёме
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Кассир банка, инкассатор-сборщик или старший бригады — по стадии
  applicability: Установлены вид инкассации и роль принимающего.
  expected_outcome: Каждый приём сопровождается проверками, установленными для принимающего субъекта.
  steps:
  - action: Кассиру при приёме сумки проверить сведения препроводительного документа, зарегистрировать сумму, осмотреть целостность
      и пломбирование.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p24
  - action: Инкассатору-сборщику при приёме от клиента проверить сумку, пломбу и её соответствие образцу, явочную карточку
      и препроводительный документ.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p107
  - action: Старшему бригады принять карточку и сумку от сборщика, проверить по п.107, вернуть карточку и выдать порожнюю
      сумку следующего клиента.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p108
  exceptions:
  - kind: evidence_limit
    condition: В кадре только одна из стадий передачи.
    behavior: Применять действия соответствующей роли; отсутствие другой роли в данном эпизоде не является пропуском её процедуры.
    norms:
    - n231_p24
    - n231_p107
    - n231_p108
  check:
  - Роль принимающего
  - Непрерывный осмотр сумки/пломбы
  - Документы
  limits: 'Выбрать субъект: пункт 24 — кассир банка, 107 — инкассатор-сборщик, 108 — старший бригады. Нужен непрерывный эпизод
    осмотра и передачи.'
  norms:
  - n231_p107
  - n231_p108
  - n231_p24
bag_packaging:
  title: Передача на инкассацию без надлежащей сумки
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Клиент-отправитель; банк или организация, осуществляющая инкассацию
  applicability: Подтверждена инкассация, а не обычная выдача наличных клиенту.
  expected_outcome: Инкассируемые ценности подготовлены в сумке с надлежащим документом.
  steps:
  - action: Упаковать подлежащие инкассации банкноты, монеты и ценности в сумку, составить препроводительный документ.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p105
  - action: Указать все реквизиты п.106, включая номер, дату формирования, клиента и банк, общую сумму и опись, номер пломбы
      и подпись клиента.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p106
  - action: Оформить три экземпляра для клиента, банка и инкассатора-сборщика; после доставки сдать экземпляр руководителю/дежурному
      для хранения не менее года.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p106
  exceptions:
  - kind: applicability_limit
    condition: Обычная выдача клиенту или другая стадия операции.
    behavior: Не переносить обязанность сумки и трёх экземпляров на иную операцию.
    norms:
    - n231_p105
    - n231_p106
  check:
  - Тип передачи
  - Реквизиты и число экземпляров
  - Связь пломбы с сумкой
  limits: Нужно знать, что передача является инкассацией; обычная выдача клиенту не подпадает под правило.
  norms:
  - n231_p105
  - n231_p106
damaged_packaging:
  title: Приём для перевозки повреждённой упаковки
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Бригада инкассации при перевозке
  applicability: Применяется приём ценностей для перевозки по п.112–113.
  expected_outcome: Для перевозки не приняты ценности с обнаруженными дефектами упаковки.
  steps:
  - action: До принятия проверить упаковку, число корешков, накладки/ярлыки и пломбы согласно п.112.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p112
  - action: Не принимать пачки и мешки с обнаруженными дефектами упаковки и оформления.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p112
  - action: После проверки упаковать принятые ценности в сумки в присутствии отправителя и оформить по п.113.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p113
  exceptions:
  - kind: evidence_limit
    condition: Пломба размыта на записи либо упаковка скрыта.
    behavior: Присвоить статус недостаточной наблюдаемости, пока конкретный дефект не подтверждён.
    norms:
    - n231_p112
    - n231_p113
  check:
  - Подтверждённый дефект
  - Стадия приёма
  - Полный эпизод
  limits: Пункты относятся к перевозке. Дефект должен быть виден. Размытое изображение пломбы не является дефектом пломбы.
  norms:
  - n231_p112
  - n231_p113
collector_equipment:
  title: Возможное отсутствие экипировки инкассатора
  domain: Инкассация
  procedure_type: document_and_visual_review
  actor: Банк/инкассаторская организация обеспечивает бригаду
  applicability: Подтверждена инкассаторская бригада и применимость требования экипировки.
  expected_outcome: Обеспечение бригады требуемым комплектом подтверждено.
  steps:
  - action: Обеспечить бригаду экипировкой, индивидуальной защитой, включая бронежилеты и каски/шлемы, и служебным оружием.
    kind: required_action
    observability: context_required
    norms:
    - n231_p103
  - action: Сопоставить комплект выдачи/обеспечения и доступные наблюдения; не отождествлять невидимое оружие с отсутствующим.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p103
  exceptions:
  - kind: evidence_limit
    condition: Часть экипировки или сотрудник находятся вне кадра.
    behavior: Недостаточно данных для вывода об отсутствии обеспечения. Сам п.103 исключения для обычной одежды не устанавливает.
    norms:
    - n231_p103
  check:
  - Роль человека
  - Документы обеспечения и доступный обзор
  limits: Пункт требует обеспечения бронежилетами, касками и служебным оружием. По одному виду одежды не установить весь комплект
    и наличие скрытого оружия; подтвердить роль человека.
  norms:
  - n231_p103
collector_team:
  title: Возможный недостаточный состав бригады
  domain: Инкассация
  procedure_type: document_and_visual_review
  actor: Банк/инкассаторская организация и бригада
  applicability: Оценивается полный состав бригады, включая водителя вне кассового помещения.
  expected_outcome: Состав и распределение функций соответствуют основной норме или установленному исключению.
  steps:
  - action: Сформировать бригаду не менее чем из трёх человек и распределить функции водителя, сборщика и старшего.
    kind: required_action
    observability: context_required
    norms:
    - n231_p98
  - action: 'При оценке бригады из двух человек проверить применение случаев п.99: наличие в автомобиле видеокамер с онлайн-доступом
      руководителю/дежурному; применение кейсов и контейнеров со специальной краской. Условия конкретного маршрута должны
      быть подтверждены.'
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p99
  - action: Сверить полный состав и условия маршрута; не считать только видимых у окна людей.
    kind: review_check
    observability: context_required
    norms:
    - n231_p98
    - n231_p99
  exceptions:
  - kind: express_normative_exception
    condition: Применим предусмотренный п.99 случай.
    behavior: Допускается бригада из сборщика и водителя; условия исключения должны быть подтверждены.
    norms:
    - n231_p99
  check:
  - Состав маршрута
  - Роль водителя
  - Подтверждение основания п.99
  limits: 'Нельзя считать людей у окна полным составом бригады: водитель может быть вне кадра. Пункт 99 допускает двух человек
    в предусмотренных случаях.'
  norms:
  - n231_p98
  - n231_p99
vault_access:
  title: Доступ в кладовую или сейфовую комнату
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Ответственные за сохранность наличных и допущенные лица
  applicability: Объект — кладовая или сейфовая комната, а не любое рабочее место кассира.
  expected_outcome: Вход, ключи и передача ценностей находятся под предусмотренным контролем.
  steps:
  - action: Допускать ответственных за сохранность; иных лиц — на основании распоряжения руководителя и в сопровождении ответственных.
    kind: required_action
    observability: context_required
    norms:
    - n231_p75
  - action: Хранить ключи/коды двери у ответственных за сохранность.
    kind: required_action
    observability: context_required
    norms:
    - n231_p76
  - action: Хранение, выдачу и передачу ключей и ценностей выполнять по внутреннему порядку, исключающему несанкционированное
      использование.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p80
  exceptions:
  - kind: evidence_limit
    condition: Лицо не опознано на видео.
    behavior: Не считать его посторонним без проверки полномочий, распоряжения и сопровождения.
    norms:
    - n231_p75
    - n231_p80
  check:
  - Категория помещения
  - Распоряжение и полномочия
  - Порядок ключей
  limits: 'Нельзя автоматически называть человека посторонним: полномочия и распорядительные документы на видео не видны.
    Пункт 75 не относится к любому рабочему месту кассира.'
  norms:
  - n231_p75
  - n231_p76
  - n231_p80
secure_cash_area:
  title: Возможный недостаток изоляции кассового узла
  domain: Помещения и допуск
  procedure_type: premises_audit
  actor: Банк, подразделения организации помещений и безопасности
  applicability: Подтверждено реальное банковское помещение, вид операций, дата и применимая редакция требований.
  expected_outcome: Планировка и защита соответствуют применимой категории помещения и редакции.
  steps:
  - action: Изолировать кассовый узел закрывающимся служебным входом.
    kind: required_action
    observability: context_required
    norms:
    - n14_p8
  - action: Для кассы обеспечить отдельный вход, замок, защитные средства, исправное передающее устройство, перегородки, видеонаблюдение
      и переговорное устройство по п.16 в редакции на дату события.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n14_p16
    - n14_p16_transition_until_2027
  - action: При применении автоматических устройств отдельно проверить исключение из требования помещения кассы.
    kind: applicability_check
    observability: context_required
    norms:
    - n14_p18
  exceptions:
  - kind: express_normative_exception
    condition: Нужен вход для погрузочно-разгрузочных работ.
    behavior: Пункт 8 допускает дополнительный закрывающийся вход.
    norms:
    - n14_p8
  - kind: express_normative_exception
    condition: Операции проводятся с применением устройств, функционирующих автоматически.
    behavior: Пункт 18 не требует наличия помещений кассы.
    norms:
    - n14_p18
  - kind: applicability_limit
    condition: Дата до 01.01.2027.
    behavior: Учитывать примечание о временной редакции п.16; не применять будущую редакцию без проверки даты.
    norms:
    - n14_p16_transition_until_2027
  check:
  - Проект/паспорт помещения
  - Вид операций
  - Дата события
  - Проверка оборудования
  limits: Проверять устройство закрывающегося входа и средств защиты; постановочная площадка и открытый на секунду проход
    сами по себе не доказывают нарушение планировки реального банка.
  norms:
  - n14_p16
  - n14_p16_transition_until_2027
  - n14_p18
  - n14_p8
collection_area:
  title: Просмотр или доступ третьих лиц при погрузке
  domain: Помещения и допуск
  procedure_type: premises_audit
  actor: Банк и служба безопасности
  applicability: Место предназначено для погрузки/разгрузки инкассируемых ценностей.
  expected_outcome: Зона погрузки защищена от доступа и наблюдения третьих лиц.
  steps:
  - action: Оборудовать примыкающий к входу кассового узла бокс с закрывающейся на замок дверью либо погрузочно-разгрузочную
      площадку.
    kind: required_action
    observability: context_required
    norms:
    - n14_p21
  - action: Обеспечить ограничение доступа и просмотра третьими лицами процесса инкассации.
    kind: required_action
    observability: partly_observable
    norms:
    - n14_p21
  exceptions:
  - kind: permitted_alternative
    condition: Используется площадка вместо бокса.
    behavior: Пункт 21 допускает оба варианта при соблюдении ограничения доступа и просмотра.
    norms:
    - n14_p21
  check:
  - Назначение зоны
  - Планировка и обзор
  - Полномочия присутствующих
  limits: Правило относится к боксу или погрузочно-разгрузочной площадке. Не переносить его автоматически на любую передачу
    у кассового окна.
  norms:
  - n14_p21
cash_handover_record:
  title: Передача наличных между кассовыми работниками
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Передающий и принимающий кассовые работники
  applicability: Подтверждена передача наличных между кассовыми работниками банка.
  expected_outcome: Передача имеет предусмотренную запись с реквизитами обоих участников.
  steps:
  - action: Отразить передачу в документе учёта принятых и выданных наличных и ценностей.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p15
  - action: Указать дату, ФИО/должности и подписи обоих работников, сумму цифрами и прописью, количество и вид наличных.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p15
  - action: Сверить запись с данной передачей; отсутствие бумажного журнала в кадре не считать доказательством отсутствия
      учёта.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p15
  exceptions:
  - kind: evidence_limit
    condition: Передача не между кассовыми работниками либо документ находится вне кадра.
    behavior: Сначала установить субъект и учёт; не подменять отсутствие наблюдения отсутствием записи.
    norms:
    - n231_p15
  check:
  - Идентификация ролей без распознавания лиц
  - Документ учёта
  - Соответствие суммы и времени
  limits: Сам по себе отсутствующий в кадре бумажный журнал не доказывает отсутствие регистрации. Суммы, подписи и время должны
    быть читаемы.
  norms:
  - n231_p15
day_end_cash:
  title: Пересчет, сортировка, упаковка и сдача остатка в конце дня
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник; заведующий кассой/исполняющий функции
  applicability: Подтверждён конец рабочего дня, остаток и применимый порядок сдачи.
  expected_outcome: Наличные сданы, свод и документы оформлены надлежащими лицами в установленные сроки.
  steps:
  - action: Сформировать, упаковать и сдать принятые деньги по приходным документам заведующему; сдача возможна также несколько
      раз в течение дня.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p23
  - action: Остаток пересчитать, отсортировать, упаковать и сдать с расходными документами.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p37
  - action: Заведующему составить свод оборотов, сверить с бухгалтерским учётом и подшить документы.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p64
  - action: Формировать документы дня отдельно по приходу/расходу и валюте после окончания дня, не позднее следующего рабочего
      дня.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p66
    - n231_p67
  exceptions:
  - kind: permitted_alternative
    condition: Деньги уже сдавались в течение дня.
    behavior: Пункт 23 это допускает; нельзя требовать повторной сдачи тех же денег в финальном фрагменте.
    norms:
    - n231_p23
  - kind: applicability_limit
    condition: Подшивка не закончена перед уходом.
    behavior: Пункт 66 даёт срок до следующего рабочего дня; проверять фактический срок.
    norms:
    - n231_p66
  check:
  - Окончание дня
  - Остаток
  - Документы сдачи и учёта
  - Роль заведующего
  limits: Уход на несколько секунд не доказывает конец дня. Проводки и итоговую сверку без банковских систем не оценивать.
  norms:
  - n231_p23
  - n231_p37
  - n231_p64
  - n231_p66
  - n231_p67
counterfeit_return:
  title: Возврат клиенту банкнот с установленными признаками подделки
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Кассовый работник/банк; правоохранительные органы
  applicability: Установлены признаки подделки или подтверждена поддельность конкретных денег.
  expected_outcome: Деньги с подтверждённым соответствующим статусом не возвращены/не обменены; оформлено дальнейшее обращение.
  steps:
  - action: Сообщить о банкнотах/монетах с признаками подделки в правоохранительные органы; изъятие выполняется ими по протоколу
      с экземпляром клиенту.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p60
  - action: Не возвращать такие деньги клиенту и не зачислять принятую сумму на его счёт.
    kind: required_action
    observability: context_required
    norms:
    - n231_p61
  - action: Поддельные банкноты/монеты не обменивать и передать в правоохранительные органы.
    kind: required_action
    observability: context_required
    norms:
    - n230_p24
  exceptions:
  - kind: applicability_limit
    condition: Есть только визуальное подозрение или категория сомнительных денег.
    behavior: Не присваивать статус подделки; применить процедуру экспертизы при подтверждённой сомнительности.
    norms:
    - n231_p60
    - n231_p61
    - n230_p24
  check:
  - Результат проверки
  - Идентичность банкнот
  - Протокол/сообщение
  - Учёт отдельно
  limits: Цвет банкноты, возврат денег или прохождение через счетчик не доказывают подделку. Нужны читаемый результат проверки
    либо подтвержденный сценарий.
  norms:
  - n230_p24
  - n231_p60
  - n231_p61
suspect_expertise:
  title: Оформление приема сомнительных банкнот на экспертизу
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Кассовый работник, заведующий кассой, клиент и филиал НБРК
  applicability: 'Классификация по Правилам №230: повреждения затрудняют определение подлинности; для банкнот — сохранено
    более 50% площади.'
  expected_outcome: Сомнительные деньги приняты, документированы и направлены на экспертизу с последующим действием по результату.
  steps:
  - action: Подтвердить категорию сомнительных денег по п.29 и принять их на экспертизу по п.30.
    kind: required_action
    observability: context_required
    norms:
    - n230_p29
    - n230_p30
  - action: В присутствии клиента и заведующего составить акт в двух экземплярах с реквизитами п.59; экземпляр выдать клиенту.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p59
  - action: Направить деньги в филиал НБРК в течение пяти рабочих дней; дальнейший возврат/выдачу результата выполнить по
      итогам экспертизы.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p59
  exceptions:
  - kind: conditional_branch
    condition: Экспертиза признала деньги платёжными.
    behavior: Вернуть на основании экземпляра акта клиента.
    norms:
    - n231_p59
  - kind: conditional_branch
    condition: Признаны неплатёжными.
    behavior: Не возвращать банкноты/монеты; выдать результат экспертизы.
    norms:
    - n231_p59
  check:
  - Подтверждённая категория
  - Акт
  - Роли присутствующих
  - Дата отправки и результат
  limits: Не смешивать сомнительные, неплатежные и имеющие признаки подделки банкноты. Срок направления на экспертизу не проверяется
    коротким видео.
  norms:
  - n230_p29
  - n230_p30
  - n231_p59
dyed_notes:
  title: Обработка банкнот, окрашенных краской спецконтейнера
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Банк или инкассаторская организация; клиент подписывает акт
  applicability: Окрашивание вызвано специальной краской спецконтейнера, а не обычным пятном.
  expected_outcome: Специально окрашенные банкноты подготовлены к экспертизе и сопровождаются обоими актами.
  steps:
  - action: Принять окрашенные банкноты по процедуре п.59, приложив акт срабатывания спецконтейнера с реквизитами п.63-4.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p63_4
    - n231_p59
  - action: 'Оформить три экземпляра акта срабатывания: клиенту, банку/организации и для филиала НБРК вместе с банкнотами.'
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p63_4
  - action: Перед отправкой на экспертизу высушить, полистно пересчитать, упаковать в мешок без наружных швов; оформить ярлык
      с реквизитами и отметкой об окраске.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p63_5
  exceptions:
  - kind: applicability_limit
    condition: Происхождение краски не установлено.
    behavior: Не переносить специальную процедуру на любое загрязнение или цветовой артефакт видео.
    norms:
    - n231_p63_4
    - n231_p63_5
  check:
  - Акт срабатывания
  - Характер краски
  - Документы и упаковка
  - Стадия отправки
  limits: Любое пятно не равно срабатыванию спецконтейнера; для соответствующей стадии проверяются акт, просушка, полистный
    пересчет и специальная упаковка.
  norms:
  - n231_p59
  - n231_p63_4
  - n231_p63_5
cash_sorting:
  title: Сортировка по номиналам и состоянию
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Кассовый работник и ответственные за хранение
  applicability: Завершённая сортировка/упаковка или хранение; номиналы и состояние подтверждены.
  expected_outcome: Итоговая сортировка, упаковка и хранение соответствуют выбранному допустимому варианту.
  steps:
  - action: 'Сортировать деньги по номиналам и степени износа: отдельно годные, ветхие/дефектные, изъятые/изымаемые; для сдачи
      в НБРК дополнительно по годам выпуска банкнот.'
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p43
  - action: Упаковывать годные отдельно от ветхих, дефектных и изъятых/изымаемых.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p45
  - action: Сборные пачки оформить по п.50; в кладовой/сейфовой комнате хранить раздельно по валюте и номиналам.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p50
    - n231_p77
  exceptions:
  - kind: permitted_alternative
    condition: Нужна сборная пачка разных номиналов.
    behavior: Допускается до десяти корешков при накладках, раздельной описи номиналов и штампе «Сборная».
    norms:
    - n231_p50
  - kind: applicability_limit
    condition: Промежуточная стопка ещё пересчитывается.
    behavior: Не применять требования к завершённой упаковке до соответствующего этапа.
    norms:
    - n231_p43
    - n231_p45
    - n231_p50
  check:
  - Номиналы и состояние
  - Этап обработки
  - Маркировка готовой пачки
  limits: Временная общая стопка во время пересчета допустима. Пункт 50 прямо предусматривает сборные пачки с разными номиналами
    при требуемом оформлении; различие цвета не доказывает различие номиналов.
  norms:
  - n231_p43
  - n231_p45
  - n231_p50
  - n231_p77
unfit_recirculation:
  title: Возврат ветхих тенге в обращение
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Уполномоченный банк и кассовый работник
  applicability: Для тенге подтверждены платёжность и ветхость банкнот/дефектность монет.
  expected_outcome: Ветхие/дефектные деньги отделены и не выданы обратно в обращение.
  steps:
  - action: Классифицировать повреждения банкнот по п.10, монет — по п.11 Правил №230.
    kind: required_action
    observability: context_required
    norms:
    - n230_p10
    - n230_p11
  - action: Отсортировать платёжные ветхие/дефектные деньги, не выпускать в обращение и передать для обмена в филиал НБРК.
    kind: required_action
    observability: partly_observable
    norms:
    - n230_p12
  - action: Упаковать их отдельно от годных денег.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p45
  exceptions:
  - kind: applicability_limit
    condition: Платёжная ветхая банкнота принимается от клиента.
    behavior: Это не запрещённый повторный выпуск в обращение; различать приём и выдачу.
    norms:
    - n230_p12
    - n231_p45
  check:
  - Категория повреждения
  - Направление движения денег
  - Назначение упаковки
  limits: Не определять платежность по общему ракурсу. Прием ветхой платежной банкноты от клиента сам по себе правомерен.
  norms:
  - n230_p10
  - n230_p11
  - n230_p12
  - n231_p45
worn_acceptance:
  title: Отказ принимать платежные ветхие тенге
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Уполномоченный банк и кассовый работник
  applicability: Тенге; определены подлинность, сохранность и правовой статус денежного знака.
  expected_outcome: Платёжные ветхие деньги приняты; иная подтверждённая категория обработана по своему порядку.
  steps:
  - action: Определить платёжность банкнот по п.4, включая сохранность не менее 70% и предусмотренные признаки; не решать
      по общей картинке.
    kind: required_action
    observability: context_required
    norms:
    - n230_p4
  - action: Платёжные ветхие банкноты и дефектные монеты принимать для всех видов платежей и переводов без ограничений.
    kind: required_action
    observability: partly_observable
    norms:
    - n230_p15
  - action: При неплатёжности/утрате законного статуса учитывать п.25 и 28; сомнительные принимать и направлять на экспертизу
      по п.30.
    kind: conditional_action
    observability: context_required
    norms:
    - n230_p25
    - n230_p28
    - n230_p30
  exceptions:
  - kind: applicability_limit
    condition: Сомнительные деньги либо деньги с неплатёжным/незаконным статусом.
    behavior: Использовать соответствующую ветку; общий запрет отказа по ветхости не означает обязательного обычного приёма
      любой банкноты.
    norms:
    - n230_p25
    - n230_p28
    - n230_p30
  check:
  - Результаты проверки
  - Размер/повреждения
  - Причина отказа
  - Валюта
  limits: Без звука и читаемых документов причину возврата часто установить нельзя; неплатежные и сомнительные деньги имеют
    другой порядок обработки.
  norms:
  - n230_p15
  - n230_p25
  - n230_p28
  - n230_p30
  - n230_p4
bundle_formation:
  title: Формирование корешков и пачек банкнот
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Кассовый работник или бригада
  applicability: Формируется окончательная пачка банкнот; вариант упаковки установлен.
  expected_outcome: Готовая пачка отвечает конкретному допустимому варианту по количеству, оформлению и защите.
  steps:
  - action: Сформировать корешок из 100 листов одного номинала лицом вверх в одну сторону; обандеролить и указать реквизиты
      п.46, для ветхих — отметку.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p46
  - action: Сформировать полную пачку из 10 корешков/1000 листов с верхней и нижней накладками и реквизитами п.47.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p47
  - action: Упаковать шпагатом и пломбой либо в заваренный на вакуумном упаковщике пакет с кодами на шве по п.48.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p48
  - action: Остатки объединять с полистным пересчётом по п.49; неполные и сборные пачки оформлять по п.50, не более десяти
      корешков, с отметкой «Сборная» при разных номиналах.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p49
    - n231_p50
  exceptions:
  - kind: permitted_alternative
    condition: Неполные корешки/остатки или разные номиналы.
    behavior: Использовать варианты п.49–50, включая общую бандероль для предусмотренных остатков без реквизитов части 2 п.46;
      нельзя требовать от всех пачек 1000 листов одного номинала.
    norms:
    - n231_p49
    - n231_p50
  - kind: permitted_alternative
    condition: Вакуумная упаковка.
    behavior: Применяется альтернативный способ п.48; отсутствие шпагата само по себе не нарушение.
    norms:
    - n231_p48
  check:
  - Завершённая пачка
  - Пересчёт/номиналы
  - Бандероль, накладки, шов/пломба
  limits: Разрешены неполные и сборные пачки и разные способы упаковки. Не применять требования к готовой пачке к неупакованной
    промежуточной стопке.
  norms:
  - n231_p46
  - n231_p47
  - n231_p48
  - n231_p49
  - n231_p50
coin_packaging:
  title: Упаковка монет и маркировка мешков
  domain: Состояние и сортировка денег
  procedure_type: operator_procedure
  actor: Кассовый работник или бригада
  applicability: Монеты пересчитаны и отсортированы; определена тара и номинал.
  expected_outcome: Тара, количество и маркировка соответствуют виду упаковки монет.
  steps:
  - action: Упаковать монеты в мешки/пакеты/тюбики; количество в пакетах и тюбиках задаёт банк, они затем упаковываются в
      мешки без наружных швов и повреждений.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p51
  - action: 'Для мешка применять количества п.51: 1 и 2 ₸ — 4000; 5 ₸ — 3000; 10 и 20 ₸ — 2500; 50 ₸ — 1500; 100 ₸ — 1000;
      200 ₸ — 750 монет.'
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p51
  - action: Прошить горловину с ярлыком, завязать и опломбировать по п.52; указать на ярлыке реквизиты п.53.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p52
    - n231_p53
  exceptions:
  - kind: conditional_branch
    condition: Сборный мешок либо дефектные монеты.
    behavior: Проставить предусмотренную отметку и для сборного — номиналы, количества, суммы и общую сумму; не выводить состав
      из внешнего размера мешка.
    norms:
    - n231_p53
  check:
  - Вид тары
  - Пересчёт и номинал
  - Ярлык/пломба
  - Редакция на дату
  limits: Существуют мешки, пакеты и тюбики; требования различаются. Сумму или число монет по внешнему виду мешка не выводить.
  norms:
  - n231_p51
  - n231_p52
  - n231_p53
outgoing_packaging:
  title: Выдача наличных в надлежащей упаковке
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Выдача наличных клиенту в упаковке.
  expected_outcome: Деньги выданы в допустимой упаковке с соответствующим способом пересчёта.
  steps:
  - action: Проверить целостность и вид упаковки; применить пересчёт по п.32.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p32
  - action: Выдать деньги в упаковке банка с учётом допускаемых вариантов по п.33.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p33
  exceptions:
  - kind: express_normative_exception
    condition: Упаковка Национального Банка или другого банка.
    behavior: Учитывать предусмотренное п.33 условие урегулирования претензий договором корреспондентского счёта; не запрещать
      по одному чужому логотипу.
    norms:
    - n231_p33
  - kind: permitted_alternative
    condition: Предусмотренная неповреждённая упаковка.
    behavior: Допускается выдача по суммам на упаковке по п.32.
    norms:
    - n231_p32
  check:
  - Происхождение упаковки
  - Состояние пачки/корешка
  - Договорное условие при необходимости
  limits: Учитывать разрешенную упаковку Национального Банка и исключения самого пункта; отсутствие полистного пересчета целой
    пачки не равно нарушению.
  norms:
  - n231_p32
  - n231_p33
client_recount:
  title: Возможность пересчета полученных денег клиентом
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Клиент; кассовый или контролирующий работник
  applicability: Клиент пересчитывает полученные деньги или заявляет расхождение.
  expected_outcome: Проведённый клиентом пересчёт и выявленное расхождение обработаны по установленной процедуре.
  steps:
  - action: 'При пересчёте клиентом соблюдать предусмотренное место: не отходя от кассы либо в помещении для пересчёта в присутствии
      кассового/контролирующего работника.'
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p35
  - action: При выявлении недостачи/излишка кассовому или контролирующему работнику составить акт по форме банка.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p35
  - action: При рассмотрении заявления установить соблюдение условий пересчёта, предусмотренных п.35.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p35
  exceptions:
  - kind: applicability_limit
    condition: Клиент не пересчитывает полученное.
    behavior: Не превращать это в автоматически установленное нарушение кассира; п.35 регулирует процедуру пересчёта и заявления.
    norms:
    - n231_p35
  check:
  - Факт пересчёта
  - Место и присутствие работника
  - Акт и заявление
  limits: Пункт описывает порядок пересчета; нельзя превращать добровольный отказ клиента от пересчета в автоматически установленное
    нарушение кассира.
  norms:
  - n231_p35
damaged_bag_recount:
  title: Вскрытие и пересчет поврежденной инкассаторской сумки
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Кассир, передающий инкассатор; контролирующий работник при служебной обработке
  applicability: Нарушенная целостность инкассаторской сумки установлена до вскрытия.
  expected_outcome: Повреждённая сумка пересчитана с требуемыми участниками и оформлением расхождений.
  steps:
  - action: При приёме проверить документы, сумму, целостность и пломбирование по п.24.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p24
  - action: При повреждении вскрыть и пересчитать в присутствии работника инкассации; при расхождении составить акт.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p25
  - action: При пересчёте/сортировке использовать оборудование п.41 и присутствие контролирующего работника по п.42, учитывая
      исключение для операций с клиентом.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p41
    - n231_p42
  exceptions:
  - kind: applicability_limit
    condition: Сумка целая.
    behavior: Пункт 25 не устанавливает обязанность немедленно вскрывать каждую целую сумку.
    norms:
    - n231_p24
    - n231_p25
  - kind: express_normative_exception
    condition: Обычный приём/выдача наличных клиенту.
    behavior: Исключение п.42 оценивать по фактическому виду операции, не по названию сотрудника.
    norms:
    - n231_p42
  check:
  - Повреждение до вскрытия
  - Полный эпизод
  - Роли участников
  - Акт
  limits: Пункт 25 прямо относится к поврежденной сумке. Из него нельзя вывести обязанность немедленно вскрыть каждую целую
    сумку при приеме.
  norms:
  - n231_p24
  - n231_p25
  - n231_p41
  - n231_p42
received_bag_recount:
  title: Пересчет содержимого вскрытой сумки
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Кассовый и контролирующий работники
  applicability: Подтверждено, что начат этап вскрытия и служебного пересчёта принятой сумки.
  expected_outcome: На установленном этапе пересчёт выполнен с требуемыми средствами и контролем.
  steps:
  - action: Различить приём закрытой сумки по п.24 и обязательный пересчёт повреждённой по п.25.
    kind: applicability_check
    observability: context_required
    norms:
    - n231_p24
    - n231_p25
  - action: Выполнить служебный пересчёт/сортировку на оборудовании с предусмотренными функциями и в присутствии контролирующего
      работника.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p41
    - n231_p42
  - action: Для повреждённой сумки обеспечить присутствие инкассатора и акт при расхождении.
    kind: conditional_action
    observability: partly_observable
    norms:
    - n231_p25
  exceptions:
  - kind: applicability_limit
    condition: Целая сумка только принята и ещё не наступил этап пересчёта.
    behavior: Данные пункты не задают универсальный срок немедленного вскрытия; отсутствие пересчёта на передаче не считать
      доказанным пропуском.
    norms:
    - n231_p24
    - n231_p25
  - kind: express_normative_exception
    condition: Приём/выдача денег клиенту.
    behavior: Применимо исключение п.42 для контролирующего работника.
    norms:
    - n231_p42
  check:
  - Начало и конец служебного пересчёта
  - Состояние сумки
  - Роли и прибор
  limits: Редкие кадры не доказывают пропуск действия. Для целой сумки публичные пункты не устанавливают универсальный срок
    немедленного пересчета.
  norms:
  - n231_p24
  - n231_p25
  - n231_p41
  - n231_p42
collection_document_flow:
  title: Препроводительные документы при приеме и выдаче инкассации
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Клиент, банк, инкассатор — каждый на своей стадии
  applicability: Подтверждены инкассация, направление передачи и вид документа.
  expected_outcome: У каждой стадии передачи есть соответствующий документ и проверка его реквизитов.
  steps:
  - action: При подготовке инкассации упаковать ценности с препроводительным документом по п.105–106.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p105
    - n231_p106
  - action: Кассиру банка при приёме проверить сведения и зарегистрировать сумму по п.24; при выдаче инкассации использовать
      документ п.106 согласно п.38.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p24
    - n231_p38
  - action: Сборщику при приёме проверить явочную карточку и сведения препроводительного документа; обеспечить дальнейшее
      движение экземпляра по п.106.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p107
    - n231_p106
  - action: При цифровой форме проверить установленную процедуру кассовых документов.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p10_1
  exceptions:
  - kind: evidence_limit
    condition: Документ находится в кармане сумки или вне обзора.
    behavior: Проверить предусмотренные форму и передачу; отсутствие свободного бумажного листа в руке недостаточно для вывода.
      Эта оговорка не устанавливает самостоятельного разрешения заменить документы инкассации произвольным цифровым сообщением.
    norms:
    - n231_p24
    - n231_p38
    - n231_p106
    - n231_p10_1
  check:
  - Документ и его реквизиты
  - Направление передачи
  - Все экземпляры/цифровая процедура
  limits: Документ может быть прикреплен к сумке или цифровым. Переданная карточка не обязательно является удостоверением
    или препроводительным документом.
  norms:
  - n231_p10_1
  - n231_p105
  - n231_p106
  - n231_p107
  - n231_p24
  - n231_p38
collector_documents:
  title: Документы и полномочия инкассаторской бригады
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Руководитель/дежурный инкассатор; сборщик; старший бригады
  applicability: Различены сбор по маршруту и перевозка ценностей.
  expected_outcome: У участников имеются документы для соответствующего вида маршрута, возврат оформлен.
  steps:
  - action: Перед выездом провести инструктаж и выдать сборщику доверенность, явочную карточку, служебное удостоверение и
      штамп маршрута; старшему — порожние сумки и удостоверение.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p101
  - action: Для перевозки обеспечить доверенность у старшего с реквизитами отправителя, суммы, состава бригады и срока по
      п.111.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p111
  - action: По окончании маршрута вернуть документы руководителю или дежурному согласно п.101.
    kind: required_action
    observability: context_required
    norms:
    - n231_p101
  exceptions:
  - kind: evidence_limit
    condition: Виден только кассовый эпизод.
    behavior: Выдача перед выездом и возврат после маршрута могли происходить вне записи; наличие карточки не устанавливается
      по её размеру.
    norms:
    - n231_p101
    - n231_p111
  check:
  - Роль и вид маршрута
  - Реквизиты доверенности
  - Выдача и возврат
  limits: Пункт 101 регулирует выдачу документов бригаде. Он сам по себе не устанавливает показ удостоверения кассиру при
    каждой передаче сумки.
  norms:
  - n231_p101
  - n231_p111
collection_documents_storage:
  title: Хранение документов инкассации после маршрута
  domain: Инкассация
  procedure_type: operator_procedure
  actor: Работники подразделения инкассации/инкассаторской организации
  applicability: Этап хранения после инкассации и завершения маршрута.
  expected_outcome: Ценности и предусмотренные документы помещены под хранение на правильной стадии.
  steps:
  - action: Хранить инкассированные ценности в кладовой/сейфовой комнате, отвечающей требованиям устройства помещений.
    kind: required_action
    observability: context_required
    norms:
    - n231_p122
  - action: Вместе с ценностями разместить и закрыть в сейфе/металлическом шкафу явочные карточки, доверенность и служебные
      удостоверения.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p123
  - action: При нескольких маршрутах проверить специальный срок размещения доверенности и удостоверения.
    kind: review_check
    observability: context_required
    norms:
    - n231_p123
  exceptions:
  - kind: express_normative_exception
    condition: Несколько маршрутов за рабочий день.
    behavior: Доверенность и служебное удостоверение размещаются и закрываются после последнего маршрута; не требовать этого
      после каждого промежуточного.
    norms:
    - n231_p123
  check:
  - Число/этап маршрутов
  - Вид помещения
  - Назначение документов
  limits: Для нескольких маршрутов доверенность и служебное удостоверение размещаются после последнего маршрута; обычную рабочую
    книгу не считать явочной карточкой.
  norms:
  - n231_p122
  - n231_p123
cash_storage:
  title: Хранение учтенных наличных в кладовой или сейфовой комнате
  domain: Хранение
  procedure_type: operator_procedure
  actor: Банк и ответственные за сохранность наличных
  applicability: Учтённые деньги передаются на хранение, а не остаются в текущей операции.
  expected_outcome: Учтённые деньги хранятся в соответствующем месте с контролируемым доступом.
  steps:
  - action: После учёта в автоматизированной системе обеспечить хранение в кладовой/сейфовой комнате по внутренним документам.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p74
  - action: Ограничить вход по п.75, хранить деньги раздельно по валюте и номиналам в предусмотренных устройствах.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p75
    - n231_p77
  - action: Выдачу/передачу ценностей и ключей выполнять по внутреннему порядку, исключающему несанкционированное использование.
    kind: required_action
    observability: context_required
    norms:
    - n231_p80
  exceptions:
  - kind: applicability_limit
    condition: Это наличные текущего обслуживания, а не стадия хранения после учёта.
    behavior: Не требовать переноса каждой текущей купюры в кладовую на основании п.74.
    norms:
    - n231_p74
    - n231_p80
  check:
  - Стадия учёта/хранения
  - Категория помещения
  - Разделение наличных
  - Полномочия
  limits: Требования к сейфовой комнате нельзя автоматически переносить на каждое открытие небольшого рабочего сейфа.
  norms:
  - n231_p74
  - n231_p75
  - n231_p77
  - n231_p80
unattended_cash:
  title: Наличные или сумка с деньгами оставлены при уходе
  domain: Хранение
  procedure_type: operator_procedure
  actor: Кассовый работник и ответственные за хранение
  applicability: Установлены содержимое/принадлежность ценностей, стадия обслуживания и уход.
  expected_outcome: Для установленной стадии обеспечены обслуживание и предусмотренное хранение ценностей.
  steps:
  - action: При приёме завершить обслуживание до ухода; ранее принятые деньги держать в предусмотренном устройстве.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
    - n231_p22
  - action: На стадии хранения после учёта применить кладовую/сейфовую комнату и внутренний порядок передачи/защиты ценностей.
    kind: required_action
    observability: context_required
    norms:
    - n231_p74
    - n231_p80
  exceptions:
  - kind: evidence_limit
    condition: Сумка пуста, деньги относятся к текущему обслуживанию либо сотрудник не покинул рабочее место.
    behavior: Проверить соответствующую предпосылку, не считать любой оставленный предмет подтверждёнными деньгами без контроля.
    norms:
    - n231_p20
    - n231_p22
    - n231_p74
    - n231_p80
  check:
  - Содержимое и принадлежность
  - Начало/конец обслуживания
  - Факт ухода
  - Режим хранения
  limits: Пустая инкассаторская сумка не является деньгами. Пункт 22 применяется только до окончания обслуживания клиента.
  norms:
  - n231_p20
  - n231_p22
  - n231_p74
  - n231_p80
open_safe:
  title: Открытый рабочий сейф
  domain: Хранение
  procedure_type: standing_condition
  actor: Кассовый работник; ответственные за локальный порядок
  applicability: Определён рабочий сейф/ящик и стадия доступа к наличным.
  expected_outcome: Хранение и доступ соответствуют режиму устройства без неподтверждённого запрета его открывать.
  steps:
  - action: Хранить ранее принятые деньги в специальном устройстве, закрывающемся на ключ.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
  - action: Соблюдать внутренний порядок доступа к ценностям и ключам, исключающий несанкционированное использование.
    kind: required_action
    observability: context_required
    norms:
    - n231_p80
  - action: При проверке установить доступ постороннего или конкретное несоблюдение применимого порядка.
    kind: review_check
    observability: context_required
    norms:
    - n231_p20
    - n231_p80
  exceptions:
  - kind: applicability_limit
    condition: Краткое открытие рабочего сейфа при выполнении операции.
    behavior: Публичные пункты не устанавливают запрета любого открытого состояния; открытая дверца сама по себе недостаточна.
    norms:
    - n231_p20
    - n231_p80
  check:
  - Назначение устройства
  - Стадия операции
  - Правила доступа
  - Наличие доступных ценностей
  limits: Краткое открытие во время операции само по себе не запрещено. Прямое универсальное требование закрывать дверь после
    каждого действия в этих пунктах не сформулировано.
  norms:
  - n231_p20
  - n231_p80
keys_stamps:
  title: Ключи, печати и штампы оставлены доступными
  domain: Хранение
  procedure_type: operator_procedure
  actor: Ответственные за сохранность; кассовый работник
  applicability: Определены вид ключа/кода/штампа и его назначение.
  expected_outcome: Ключи и средства удостоверения находятся под установленным контролем.
  steps:
  - action: Ключи и коды двери кладовой/сейфовой комнаты хранить у ответственных за сохранность.
    kind: required_action
    observability: context_required
    norms:
    - n231_p76
  - action: Рабочие ключи, печати, штампы, пломбираторы и ценности хранить, выдавать и передавать по порядку банка, исключающему
      несанкционированное использование.
    kind: required_action
    observability: context_required
    norms:
    - n231_p80
  - action: Сопоставить фактическую доступность с конкретным порядком и полномочиями лица.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n231_p80
  exceptions:
  - kind: evidence_limit
    condition: В кадре связка ключей неизвестного назначения.
    behavior: Не применять требования к ключу кладовой к любому ключу и не выдумывать обязательное единственное место хранения.
    norms:
    - n231_p76
    - n231_p80
  check:
  - Назначение ключа/штампа
  - Полномочия
  - Внутренний порядок и доступность
  limits: Пункт 80 требует внутреннего порядка, исключающего несанкционированное использование; он не предписывает единственное
    место хранения. Пункт 76 относится к двери кладовой/сейфовой комнаты.
  norms:
  - n231_p76
  - n231_p80
service_overlap:
  title: Параллельное обслуживание клиентов и риск смешения операций
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Различены текущие и предыдущие операции, клиенты и приходные документы.
  expected_outcome: Прослеживаются раздельные суммы/документы и соблюдены условия обслуживания.
  steps:
  - action: Принимать/пересчитывать текущую сумму при клиенте, ранее принятые деньги хранить в специальном устройстве.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p20
  - action: Деньги по нескольким приходным документам принимать отдельно.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p21
  - action: Не покидать рабочее место до завершения обслуживания в процедуре приёма.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p22
  exceptions:
  - kind: evidence_limit
    condition: Рядом стоят несколько людей или лежат несколько листов.
    behavior: Это не самостоятельный запрет параллельного общения; требуются факты смешения приёма по документам или несоблюдения
      конкретного пункта.
    norms:
    - n231_p20
    - n231_p21
    - n231_p22
  check:
  - Связь денег с клиентами
  - Документы
  - Полный ход обслуживания
  limits: Нахождение двух людей у окна либо прием документа второго клиента само по себе не запрещены названными пунктами.
    Отдельный запрет любой параллельной консультации не подтвержден.
  norms:
  - n231_p20
  - n231_p21
  - n231_p22
atm_cash:
  title: Наличные для устройств с автоматической обработкой
  domain: Кассовая операция
  procedure_type: operator_procedure
  actor: Уполномоченные работники банка/инкассации; банк отвечает за устройство
  applicability: Устройство функционирует автоматически; установлен режим загрузки либо повторного использования денег.
  expected_outcome: Кассеты, персонал, годность денег и функции устройства соответствуют его режиму.
  steps:
  - action: Подготовить банкноты для загрузки в кассеты полистно; кассеты закрыть на ключ и опломбировать с защитой от несанкционированного
      вскрытия.
    kind: required_action
    observability: partly_observable
    norms:
    - n231_p55
  - action: Поручить загрузку/изъятие ответственным работникам по внутреннему порядку; загружать только годные к обращению
      деньги.
    kind: required_action
    observability: context_required
    norms:
    - n231_p69
    - n231_p71
  - action: Для устройства с повторным использованием принятых денег обеспечить распознавание не менее двух машиночитаемых
      признаков.
    kind: conditional_action
    observability: not_visually_verifiable
    norms:
    - n231_p72
  exceptions:
  - kind: permitted_alternative
    condition: Банк выбрал иной допустимый вид пломбы.
    behavior: Пункт 55 оставляет выбор банку; бумажная пломба не является единственным вариантом.
    norms:
    - n231_p55
  - kind: applicability_limit
    condition: Устройство не предусматривает повторного использования принятых денег.
    behavior: Не переносить условное требование п.72 без проверки конструкции.
    norms:
    - n231_p72
  check:
  - Модель устройства
  - Опломбирование кассеты
  - Назначенные работники
  - Результаты проверки денег
  limits: Не распространять требования к банкоматам на любой счетчик; наличие функций проверки и качество банкнот нуждаются
    в отдельном подтверждении.
  norms:
  - n231_p55
  - n231_p69
  - n231_p71
  - n231_p72
fx_access:
  title: Посторонние лица и посторонние деньги в операционной кассе обменного пункта
  domain: Валютные операции
  procedure_type: standing_condition
  actor: Работники и ответственные за операционную кассу обменного пункта
  applicability: Подтверждена именно операционная касса обменного пункта и полномочия присутствующих.
  expected_outcome: В операционной кассе находятся уполномоченные лица и относящиеся к деятельности деньги.
  steps:
  - action: Не допускать присутствия посторонних лиц в операционной кассе.
    kind: required_action
    observability: context_required
    norms:
    - n49_p41
  - action: Деньги, не относящиеся к деятельности уполномоченного юридического лица, хранить в отдельной комнате или шкафах
      вне операционной кассы.
    kind: required_action
    observability: partly_observable
    norms:
    - n49_p41
  exceptions:
  - kind: applicability_limit
    condition: Помещение не является операционной кассой обменного пункта либо полномочия человека неизвестны.
    behavior: Сначала установить область применения и роль; внешний вид не определяет постороннего.
    norms:
    - n49_p41
  check:
  - Категория помещения
  - Права доступа
  - Принадлежность денег
  limits: Нельзя применять этот пункт к произвольной кассе без подтверждения валютного обменного пункта; внешность человека
    не устанавливает его полномочий.
  norms:
  - n49_p41
fx_equipment:
  title: Обмен при неисправном обязательном оборудовании
  domain: Валютные операции
  procedure_type: operator_procedure
  actor: Банк/юридическое лицо и кассир обменного пункта
  applicability: Обычный обменный пункт; отдельно проверяется исключение для автоматизированного.
  expected_outcome: Обмен проводится при подтверждённом соответствии обязательного оснащения и условий.
  steps:
  - action: 'Обеспечить требования п.11: помещение, видеосистему с хранением 90 календарных дней и защитой архива, учётный
      комплекс/ККМ и средства проверки банкнот в УФ и на магнитные метки.'
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n49_p11
  - action: В ходе деятельности обеспечивать соответствие помещения, оборудования и персонала п.33 с учётом применимости требований
      к конкретному субъекту.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n49_p33
  - action: При возникшем несоответствии требованиям п.11 не проводить обменные операции.
    kind: required_action
    observability: partly_observable
    norms:
    - n49_p34
  exceptions:
  - kind: express_normative_exception
    condition: Автоматизированный обменный пункт.
    behavior: Учитывать исключения п.11 и 33; не применять требования рабочего места обычного кассира автоматически.
    norms:
    - n49_p11
    - n49_p33
  - kind: evidence_limit
    condition: Прибор визуально не похож на отдельную УФ-лампу.
    behavior: Проверить технические функции, а не название или корпус.
    norms:
    - n49_p11
    - n49_p34
  check:
  - Тип пункта
  - Технические документы и работоспособность
  - Архивная политика
  - Факт обмена
  limits: Форма корпуса прибора не доказывает его функции или неисправность. Требования применяются с исключениями для автоматизированных
    пунктов.
  norms:
  - n49_p11
  - n49_p33
  - n49_p34
fx_display:
  title: Информация и обменные курсы для клиентов
  domain: Валютные операции
  procedure_type: standing_condition
  actor: Юридическое лицо/обменный пункт
  applicability: Обменный пункт и дата/время действующего распоряжения о курсах установлены.
  expected_outcome: Клиенту доступна применимая информация, курсы согласованы с действующим распоряжением.
  steps:
  - action: 'Разместить доступную клиенту информацию п.39: применимую копию лицензии; для уполномоченной организации — приложение
      к ней, для банка — полученное письменное подтверждение либо ранее полученное свидетельство; сведения о контролирующем
      филиале НБ и подаче жалобы по приложению 10; действующий акт о пределах курсового отклонения; ФИО кассира и адрес сайта
      при наличии. Проверить исключения по виду пункта и способу размещения.'
    kind: required_action
    observability: context_required
    norms:
    - n49_p39
  - action: Разместить стенд курсов не менее 0,4 м в высоту и 0,4 м в ширину внутри пункта либо непосредственно возле операционной
      кассы. Не размещать его вне помещения; ограничение обзора с открытого пространства применять с учётом исключений по
      местоположению пункта. Для автоматизированного пункта допустим монитор.
    kind: required_action
    observability: context_required
    norms:
    - n49_p39
  - action: Установить курсы распоряжением с валютами, датой и временем начала действия; проводить обмен по соответствующим
      курсам.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n49_p42
  - action: Весь период действия распоряжения показывать клиентам предусмотренные курсы по всем используемым валютам.
    kind: required_action
    observability: partly_observable
    norms:
    - n49_p46
  - action: По требованию физического лица предоставить сведения о признаках годных/негодных банкнот и порядке/условиях принятия
      на инкассо неплатёжных или негодных банкнот; для автоматизированного пункта действует исключение.
    kind: conditional_action
    observability: context_required
    norms:
    - n49_p39
  exceptions:
  - kind: permitted_alternative
    condition: Автоматизированный пункт.
    behavior: Курсы допускается показывать на мониторе; информация о кассире и предусмотренная последним абзацем консультация
      кассира по требованию клиента не обязательны для автоматизированного пункта.
    norms:
    - n49_p39
  - kind: permitted_alternative
    condition: Информация п.39 пп.1), 3), 6) размещена на сайте.
    behavior: Пункт допускает такой канал; для других сведений проверить собственное требование.
    norms:
    - n49_p39
  - kind: permitted_alternative
    condition: Распоряжением установлены разные курсы в зависимости от суммы.
    behavior: Пункт 42 допускает это; сравнивать с соответствующим диапазоном суммы.
    norms:
    - n49_p42
  - kind: express_normative_exception
    condition: Пункт расположен в здании/сооружении многофункционального назначения (включая деловой центр), здании железнодорожного
      вокзала или казино, внутри аэровокзала международного аэропорта либо на территории автомобильного, морского или речного
      пограничного пункта пропуска.
    behavior: Оговорка п.39 пп.4) допускает внешний визуальный обзор стенда; она не отменяет отдельный запрет размещать сам
      стенд вне помещения.
    norms:
    - n49_p39
  - kind: express_normative_exception
    condition: Получение лицензии не требуется в случае, указанном в п.39 пп.1), либо разрешительный документ зависит от статуса
      организации/банка.
    behavior: Не требовать неприменимую копию; установить правовое основание исключения. Приложение к лицензии организации
      и письменное подтверждение/ранее полученное свидетельство банка — разные позиции.
    norms:
    - n49_p39
  check:
  - Стенд/монитор/сайт
  - Распоряжение и время
  - Вид пункта
  - Сумма операции
  limits: Необозримая часть помещения не считается отсутствующим стендом. Учитывать отдельные требования к банкам, уполномоченным
    организациям и автоматизированным пунктам.
  norms:
  - n49_p39
  - n49_p42
  - n49_p46
fx_identity:
  title: Идентификация при валютной обменной операции
  domain: Валютные операции
  procedure_type: operator_procedure
  actor: Кассир и юридическое лицо, ведущее обмен
  applicability: Обменная операция; установлены сумма в эквиваленте тенге и дата редакции.
  expected_outcome: Объём и основание фиксации данных соответствуют сумме и применимой редакции.
  steps:
  - action: Фиксировать сведения на основе предусмотренного документа или сервиса цифровых документов.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n49_p51
    - law73_p6_4
  - action: При сумме свыше эквивалента 500 000 тенге по курсу операции записать ИИН; если ИИН не присвоен — вид, дату выдачи,
      номер и срок действия документа; юридический адрес (государство, населённый пункт, улица, дом, квартира при наличии);
      полные ФИО с отчеством при наличии. При сумме не выше порога — полные ФИО и ИИН при наличии. Юридический адрес исключён
      из требования брать сведения именно из удостоверяющего документа.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n49_p51
  - action: При решении об отказе проверить основания п.53, включая непредставление требуемого документа/цифровых данных;
      не выводить идентификацию из наличия пластика.
    kind: review_check
    observability: context_required
    norms:
    - n49_p53
  exceptions:
  - kind: permitted_alternative
    condition: Предъявлен документ через сервис цифровых документов.
    behavior: Применить его равнозначность с установленными законом исключениями.
    norms:
    - law73_p6_4
  - kind: applicability_limit
    condition: Операция равна 500 000 тенге.
    behavior: Это категория «не превышающая», а не «превышающая» порог п.51.
    norms:
    - n49_p51
  check:
  - Сумма и курс
  - Документ/цифровой канал
  - Запись реестра
  - Законное основание отказа
  limits: Данные могут поступать через сервис цифровых документов. Финансовые пороги, системную проверку и причины отказа
    нельзя определять по толщине пачки.
  norms:
  - n49_p51
  - n49_p53
  - law73_p6_4
fx_receipt:
  title: Подтверждение валютного обмена чеком
  domain: Валютные операции
  procedure_type: operator_procedure
  actor: Обменный пункт, включая автоматизированный
  applicability: Обменная операция проведена.
  expected_outcome: Клиенту выдан предусмотренный контрольный чек.
  steps:
  - action: Подтвердить проведение обмена выдачей контрольного чека по п.54.
    kind: required_action
    observability: partly_observable
    norms:
    - n49_p54
  - action: Проверить факт и применимую форму выдачи чека по требованиям, на которые ссылается п.54.
    kind: review_check
    observability: context_required
    norms:
    - n49_p54
  exceptions:
  - kind: evidence_limit
    condition: Операция ещё не завершена или способ выдачи/зона передачи не виден.
    behavior: Не считать отсутствие наблюдаемого листа достаточным доказательством отсутствия чека.
    norms:
    - n49_p54
  check:
  - Завершение обмена
  - Чек или подтверждение его выдачи
  limits: Отсутствие бумажного листа само по себе не исключает допустимое электронное подтверждение; общие кассовые операции
    банка не тождественны валютному обмену.
  norms:
  - n49_p54
fx_refusal_fee:
  title: Необоснованный отказ в обмене или комиссия
  domain: Валютные операции
  procedure_type: operator_procedure
  actor: Уполномоченный банк/обменный пункт
  applicability: Известны правовой статус банкнот, наличие нужной валюты, причина отказа и вид комиссии.
  expected_outcome: Отказ и комиссия имеют подтверждённое допустимое основание; необходимые документы выданы.
  steps:
  - action: Не ограничивать приём обращающихся денежных знаков по номиналу/году и не отказывать при наличии нужных сумм, кроме
      оснований п.53.
    kind: required_action
    observability: context_required
    norms:
    - n49_p53
  - action: При отказе из-за отсутствия нужной валюты выдать по требованию клиента справку с видом/суммой, датой/временем
      и подписью, зарегистрировать её.
    kind: conditional_action
    observability: context_required
    norms:
    - n49_p53
  - action: Не взимать комиссию за покупку/продажу законного платёжного средства и обмен ранних выпусков на поздние по п.57.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n49_p57
  - action: 'Для неплатёжных/негодных банкнот применить особый порядок п.61: отношения с иностранными банками, предупреждение
      о комиссии/риске отказа и письменное согласие при инкассо; комиссия не более 10% номинала.'
    kind: conditional_action
    observability: not_visually_verifiable
    norms:
    - n49_p61
  exceptions:
  - kind: express_normative_exception
    condition: Законное основание отказа по статье 13 закона о ПОД/ФТ/ФРОМУ или непредставление документа в предусмотренном
      случае.
    behavior: Пункт 53 сохраняет исключения; их наличие проверяется отдельно и не предполагается по кадру.
    norms:
    - n49_p53
  - kind: conditional_branch
    condition: Комиссия относится к неплатёжным/негодным банкнотам.
    behavior: Это специальная ветка п.61, отличная от запрета п.57.
    norms:
    - n49_p57
    - n49_p61
  check:
  - Статус банкнот
  - Наличие валюты
  - Причина отказа
  - Тариф и согласие
  limits: Есть исключения по ПОД/ФТ и идентификации; работа с негодной валютой регулируется отдельно. Без звука, сумм и системных
    данных такой вывод часто недоступен.
  norms:
  - n49_p53
  - n49_p57
  - n49_p61
fx_note_quality:
  title: Проверка и прием негодной иностранной валюты
  domain: Валютные операции
  procedure_type: operator_procedure
  actor: Уполномоченный банк/обменный пункт
  applicability: Иностранная валюта; известен эмитент, состояние и правовой статус банкноты.
  expected_outcome: Категория и дальнейший маршрут банкноты подтверждены применимыми критериями.
  steps:
  - action: Проверять платёжность по официальным образцам/справочным материалам эмитента и признакам п.58 Правил №49.
    kind: required_action
    observability: context_required
    norms:
    - n231_p58
    - n49_p58
  - action: Отнести банкноту к годной по п.59 или негодной/неплатёжной по п.60; при неразрешимой классификации использовать
      рекомендации центрального банка эмитента по п.60-1.
    kind: required_action
    observability: context_required
    norms:
    - n49_p59
    - n49_p60
    - n49_p60_1
  - action: Неплатёжные/негодные банкноты обрабатывать по п.61; не продавать клиентам приобретённые/принятые в порядке замены,
      направлять на инкассо по установленным отношениям.
    kind: required_action
    observability: partly_observable
    norms:
    - n49_p61
  - action: При принятии на инкассо предупредить о комиссии и риске отказа, получить письменное согласие; при отказе иностранного
      банка предоставить подтверждающие документы.
    kind: conditional_action
    observability: not_visually_verifiable
    norms:
    - n49_p61
  exceptions:
  - kind: applicability_limit
    condition: Состояние не укладывается однозначно в п.59–60.
    behavior: Применить справочные рекомендации эмитента по п.60-1; не переносить критерии тенге на иностранную валюту.
    norms:
    - n49_p60_1
    - n231_p58
  - kind: evidence_limit
    condition: Обычная небольшая отметина/износ.
    behavior: Сопоставить с точными критериями п.60, включая размеры/количество повреждений; видимость пятна сама по себе
      недостаточна.
    norms:
    - n49_p60
  check:
  - Эмитент и справочник
  - Размеры/тип повреждений
  - Статус обращения
  - Согласие и документы инкассо
  limits: Не переносить критерии тенге на иностранную валюту. Негодность, подделка и сомнительность имеют разные последствия.
  norms:
  - n49_p58
  - n49_p59
  - n49_p60
  - n49_p60_1
  - n49_p61
  - n231_p58
access_control:
  title: Контроль допуска в кассовую зону
  domain: Помещения и допуск
  procedure_type: premises_audit
  actor: Банк, подразделение безопасности и ответственные за кассовые операции
  applicability: Установлены зона банка, её режим и полномочия участника.
  expected_outcome: Организация зоны и фактический допуск согласованы с установленными полномочиями.
  steps:
  - action: Обеспечить изоляцию кассового узла и устройство кассы по п.8 и 16 с учётом даты и исключений.
    kind: required_action
    observability: context_required
    norms:
    - n14_p8
    - n14_p16
    - n14_p16_transition_until_2027
    - n14_p18
  - action: Подразделению безопасности организовать пропускной и внутриобъектовый режим.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p18
  - action: Кассовые операции поручать работникам в рамках должностных обязанностей с распределением функций, исключающим
      конфликт интересов и условия хищения.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n231_p14
  - action: Сопоставить фактический вход/действие с установленным режимом и полномочиями, не определяя постороннего по внешности.
    kind: review_check
    observability: context_required
    norms:
    - n53_p18
    - n231_p14
  exceptions:
  - kind: express_normative_exception
    condition: Автоматические устройства вместо помещения кассы.
    behavior: Проверить исключение п.18 Правил №14.
    norms:
    - n14_p18
  - kind: applicability_limit
    condition: Открытие закрывающейся двери на время разрешённого прохода.
    behavior: Само по себе не доказывает нарушение устройства помещения или режима допуска.
    norms:
    - n14_p8
    - n14_p16
    - n53_p18
  check:
  - Режим и список допуска
  - Назначение зоны
  - Распределение обязанностей
  - Дата редакции
  limits: Открытая дверь не доказывает отсутствие замка; вошедший может быть сменным кассиром. Не применять требования к кладовой
    к любому рабочему столу.
  norms:
  - n231_p14
  - n14_p16
  - n14_p16_transition_until_2027
  - n14_p18
  - n14_p8
  - n53_p18
rko_pass_regime:
  title: Пропускной режим уязвимого в террористическом отношении РКО
  domain: Помещения и допуск
  procedure_type: operator_procedure
  actor: Руководитель РКО, субъект охраны и сотрудники охраны
  applicability: Подтверждено, что РКО отнесено к уязвимым в террористическом отношении.
  expected_outcome: Для применимого объекта действуют зонирование, допуск и предусмотренные процедуры охраны.
  steps:
  - action: Проверить применимость Инструкции №21 по п.1.
    kind: applicability_check
    observability: not_visually_verifiable
    norms:
    - n21_p1
  - action: 'Организовать пропускной режим по п.14–15: контроль входов/выходов, не менее двух зон, перечни допуска и запрещённых
      предметов, защиту критических зон.'
    kind: required_action
    observability: context_required
    norms:
    - n21_p14
    - n21_p15
  - action: Проводить предусмотренный п.18 досмотр техническими средствами; при выявлении перечисленных запрещённых предметов
      информировать территориальные органы внутренних дел и нацбезопасности.
    kind: required_action
    observability: context_required
    norms:
    - n21_p18
  - action: Закрепить в инструкции охраны проверки документов/целей визита и грузов, записи о посетителях, обходы, доклад
      и действия при нарушениях по п.19.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n21_p19
  exceptions:
  - kind: applicability_limit
    condition: Категория уязвимого РКО не подтверждена.
    behavior: Не переносить все требования Инструкции на любое банковское окно.
    norms:
    - n21_p1
  - kind: applicability_limit
    condition: Лицо входит в утверждённый перечень допуска или находится в общедоступной зоне.
    behavior: Оценивать соответствующий режим зоны, а не объявлять каждый вход посетителя нарушением.
    norms:
    - n21_p15
  check:
  - Статус объекта
  - Порядок допуска
  - Перечни и инструкция охраны
  - Контекст досмотра
  limits: Не считать любую кассу уязвимым объектом автоматически. Наличие формы, отсутствие формы или лицо участника не доказывают
    полномочий.
  norms:
  - n21_p1
  - n21_p14
  - n21_p15
  - n21_p18
  - n21_p19
session_timeout:
  title: Автоматическое завершение сеанса или блокировка
  domain: Информационная безопасность
  procedure_type: system_control_audit
  actor: Банк и администратор информационной системы
  applicability: Определены система/актив, критичность, применимость п.71 и отсутствие исключения п.72.
  expected_outcome: Параметры и срабатывание контроля подтверждены для применимой системы.
  steps:
  - action: 'Проверить категорию активов: для критичных применять Требования; защиту некритичных и полностью состоящих из
      них систем банк определяет самостоятельно.'
    kind: applicability_check
    observability: not_visually_verifiable
    norms:
    - n53_p34
    - n53_p35
  - action: При применимости настроить по п.71 пп.9) автоматическое завершение сеанса либо блокировку станции/ноутбука при
      неактивности более 30 минут, разблокировку — с аутентификацией.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p71
  - action: Проверить настройки и непрерывный интервал неактивности; отдельно установить условия исключений п.72.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n53_p72
  exceptions:
  - kind: express_normative_exception
    condition: Аутентификация интегрирована с соответствующей п.71 системой либо функции одной системы минимизируют риск неавторизованного
      доступа в другой.
    behavior: Пункт 72 исключает применение п.71 в перечисленных случаях; применимость исключения подтверждается.
    norms:
    - n53_p72
  - kind: evidence_limit
    condition: Краткий уход, активность неизвестна либо светится только дисплей.
    behavior: Не делать вывод о нарушении 30-минутного таймаута.
    norms:
    - n53_p71
    - n53_p72
  check:
  - Классификация актива
  - Настройки/журналы
  - Интервал неактивности
  - Архитектура аутентификации
  limits: Проверить исключения пункта 72. Короткое видео и светящийся экран не доказывают нарушение 30-минутного порога; экран
    может показывать заставку или заблокированный сеанс.
  norms:
  - n53_p34
  - n53_p35
  - n53_p71
  - n53_p72
short_absence_screen:
  title: Краткий уход от незаблокированного рабочего места
  domain: Информационная безопасность
  procedure_type: unresolved_requirement_check
  actor: Банк устанавливает меры; работник соблюдает применимые требования
  applicability: Установлены рабочая система, характер доступных данных, применимое правило и дата.
  expected_outcome: Зафиксировано, какое требование применимо; без конкретного основания нарушение не утверждается.
  steps:
  - action: Установить права доступа по функциональным обязанностям и принятые банком меры защиты рабочих станций.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n53_p36
    - n53_p53
  - action: Проверить применимость автоматического таймаута и исключений, не подменяя их немедленной ручной блокировкой.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n53_p71
    - n53_p72
  - action: Для персональных данных проверить меры предотвращения/обнаружения несанкционированного доступа и минимизации последствий.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - law94_p22_1
  - action: До конкретного вывода подтвердить правило ручной блокировки именно для кассира и системы. При отсутствии подтверждения
      сохранить незакрытый вопрос применимости.
    kind: unresolved_requirement
    observability: context_required
    norms:
    - n53_p53
    - law94_p22_1
  exceptions:
  - kind: applicability_limit
    condition: Известен только короткий уход и включённый экран.
    behavior: Общая обязанность защиты и таймаут не устанавливают универсального запрета любого краткого ухода.
    norms:
    - n53_p71
    - n53_p72
    - law94_p22_1
  check:
  - Рабочая система
  - Правило на дату события
  - Состояние сеанса и доступность данных
  - Продолжительность/активность
  limits: В публичной процедуре ForteBank 2025 есть п. 35(4), запрещающий оставлять активную сессию клиентской Онлайн-платформы
    без присмотра; в редакции 2024 это п. 35(3). Применимость к рабочему месту кассира не установлена. Кодекс этики дает общую
    обязанность конфиденциальности работников, а регламент УЦ — специальный запрет для отношений УЦ. Отдельная обязанность
    немедленной блокировки любого рабочего экрана кассира пока не подтверждена.
  norms:
  - n53_p36
  - n53_p53
  - n53_p71
  - n53_p72
  - law94_p22_1
account_sharing:
  title: Передача пароля или работа под чужой учетной записью
  domain: Информационная безопасность
  procedure_type: system_control_audit
  actor: Банк, администраторы и пользователи систем
  applicability: Подтверждены учётная запись, фактический пользователь и режим доступа; видимость работы за компьютером этого
    не устанавливает.
  expected_outcome: Учётная запись и пользователь персонализированы либо оформлено предусмотренное исключение.
  steps:
  - action: Использовать персонализированные пользовательские учётные записи.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p40
  - action: Организовать управление учётными записями/паролями и идентификацию заявителей; не допускать неправомерной передачи
      паролей по п.73 пп.1–5).
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p73
  - action: Не работать под чужой записью, кроме оформленного случая непрерывности по п.73 пп.6) с согласованием ИБ, заданным
      временем и точной идентификацией пользователя.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p73
  exceptions:
  - kind: express_normative_exception
    condition: Доступ к чужой записи предоставлен для непрерывности деятельности.
    behavior: Проверить все условия п.73 пп.6); не считать исключение разрешением свободно делиться паролем.
    norms:
    - n53_p73
  - kind: applicability_limit
    condition: Некритичные активы/система.
    behavior: Подтвердить область применения п.34–35 и локальные меры.
    norms:
    - n53_p34
    - n53_p35
  check:
  - Журнал входов
  - Согласование ИБ
  - Интервал и идентификация пользователя
  limits: Нельзя определять владельца учетной записи по лицу. Пункт 73 допускает согласованный доступ для непрерывности деятельности
    с точной идентификацией пользователя.
  norms:
  - n53_p34
  - n53_p35
  - n53_p40
  - n53_p73
third_party_system_access:
  title: Доступ третьего лица к банковской системе
  domain: Информационная безопасность
  procedure_type: system_control_audit
  actor: Банк и уполномоченное третье лицо
  applicability: Лицо не является работником или клиентом в смысле п.56; установлены работа, актив и договорное основание.
  expected_outcome: Доступ ограничен и подкреплён допустимым основанием и контролем.
  steps:
  - action: Разграничить доступ работника по обязанностям и доступ третьего лица; обеспечить безопасность соответствующих
      активов.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p36
    - n53_p56
  - action: Ограничить доступ третьего лица сроком и объёмом работ на основании договора с условиями ИБ/конфиденциальности
      и ответственности, кроме предусмотренных законом случаев.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p57
  - action: 'Предусмотреть как минимум одну меру п.59: проверку результата, присутствие работника, аудиторский след или запись
      сеанса.'
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p59
  - action: Снижать риск доступа неавторизованных или несоответствующих настройкам устройств организационными и/или техническими
      мерами.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p45
  exceptions:
  - kind: permitted_alternative
    condition: Рядом не видно сотрудника банка.
    behavior: Сопровождение — одна из альтернатив п.59; проверить иной предусмотренный контроль.
    norms:
    - n53_p59
  - kind: applicability_limit
    condition: Исключение предусмотрено законодательством либо актив некритичен.
    behavior: Проверить законное основание и область применения; не выводить полномочия из одежды.
    norms:
    - n53_p57
    - n53_p34
    - n53_p35
  check:
  - Договор/законное основание
  - Объём и срок
  - Выбранная мера контроля
  - Авторизация устройства
  limits: 'Отсутствие сопровождающего не означает нарушения: пункт 59 допускает альтернативные формы контроля. Прикосновение
    к ноутбуку не доказывает несанкционированный вход.'
  norms:
  - n53_p34
  - n53_p35
  - n53_p36
  - n53_p45
  - n53_p56
  - n53_p57
  - n53_p59
paper_protection:
  title: Защищаемые бумажные документы оставлены доступными
  domain: Информационная безопасность
  procedure_type: standing_condition
  actor: Банк и лица с доступом к защищаемым документам
  applicability: Установлены защищаемое содержание бумаги и полномочия получателя.
  expected_outcome: Документы используются и уничтожаются с применимыми мерами защиты без недоказанного универсального запрета
    бумаг на столе.
  steps:
  - action: Определить и применять организационные ограничения или технический контроль работы/вывода защищаемой информации
      на бумагу по п.76.
    kind: required_action
    observability: context_required
    norms:
    - n53_p76
  - action: Обеспечивать конфиденциальность персональных данных ограниченного доступа; не распространять без согласия либо
      иного законного основания.
    kind: required_action
    observability: context_required
    norms:
    - law94_p11_1
    - law94_p11_2
  - action: Применять необходимые меры защиты персональных данных от несанкционированного доступа и его последствий.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - law94_p22_1
  - action: При уничтожении защищаемой информации выбирать применимый к носителю способ, исключающий восстановление, по п.78.
    kind: conditional_action
    observability: context_required
    norms:
    - n53_p78
  exceptions:
  - kind: evidence_limit
    condition: Документ на столе не идентифицирован или доступ имеют уполномоченные лица.
    behavior: Нельзя автоматически считать любую бумагу нарушением; п.76 допускает альтернативные методы защиты.
    norms:
    - n53_p76
    - law94_p11_1
  - kind: applicability_limit
    condition: Этап уничтожения не наступил.
    behavior: Не требовать немедленного уничтожения рабочего документа по п.78.
    norms:
    - n53_p78
  check:
  - Содержание документа
  - Право доступа
  - Выбранная мера
  - Стадия использования/уничтожения
  limits: Обычная закрытая книга не доказывает наличие клиентских сведений. Не объявлять каждую бумагу на столе нарушением
    политики чистого стола, которой нет в предоставленных материалах.
  norms:
  - n53_p76
  - n53_p78
  - law94_p11_1
  - law94_p11_2
  - law94_p22_1
client_data_disclosure:
  title: Разглашение клиентских сведений на бумаге или экране
  domain: Информационная безопасность
  procedure_type: standing_condition
  actor: Банк, работник, собственник/оператор персональных данных
  applicability: Подтверждены сведения, их защищаемый статус, получатель и основание передачи.
  expected_outcome: Защищаемые сведения доступны только при подтверждённом допустимом основании.
  steps:
  - action: Отнести сведения к банковской тайне по ст.69 п.1 и обеспечить её сохранение по п.2.
    kind: required_action
    observability: context_required
    norms:
    - law258_p69_1
    - law258_p69_2
  - action: Для персональных данных ограниченного доступа соблюдать конфиденциальность и проверять согласие либо другое законное
      основание распространения.
    kind: required_action
    observability: context_required
    norms:
    - law94_p11_1
    - law94_p11_2
  - action: Обеспечить меры предотвращения/обнаружения несанкционированного доступа и минимизации последствий по закону и
      п.21 Правил защиты.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - law94_p22_1
    - pdn_measures_p21
  - action: При оценке передачи подтвердить содержание, получателя и отсутствие применимого законного основания, не выводить
      разглашение из нечитаемого экрана.
    kind: review_check
    observability: context_required
    norms:
    - law258_p69_2
    - law94_p11_1
  exceptions:
  - kind: applicability_limit
    condition: Есть законное основание предоставления сведений.
    behavior: Оценить его для конкретного режима тайны; не считать любую передачу бумаги разглашением.
    norms:
    - law94_p11_1
    - law258_p69_2
  check:
  - Читаемое содержание
  - Режим тайны
  - Получатель/полномочия
  - Основание передачи
  limits: Обзорный ракурс часто не позволяет прочитать экран. Законное согласие и предусмотренные законом основания раскрытия
    должны быть исключены; не делать вывод об уголовной ответственности.
  norms:
  - pdn_measures_p21
  - law94_p11_1
  - law94_p11_2
  - law94_p22_1
  - law258_p69_1
  - law258_p69_2
external_media:
  title: Защита данных при использовании внешнего носителя
  domain: Информационная безопасность
  procedure_type: system_control_audit
  actor: Банк, ИБ, администратор и уполномоченный пользователь
  applicability: Носитель подключён к банковской инфраструктуре; определены авторизация устройства, информация и выбранные
    меры защиты.
  expected_outcome: Подключение и обработка носителя соответствуют выбранным и применимым мерам защиты.
  steps:
  - action: Снижать риск доступа неавторизованных устройств и устройств с несоответствующими настройками.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p45
  - action: При записи/использовании внешних носителей применять предусмотренный организационный или программно-технический
      метод защиты по п.75.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p75
  - action: Обеспечить требования к используемому антивирусу по п.116, включая сканирование сменных носителей при подключении;
      подтверждать по настройкам/журналам.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n53_p116
  exceptions:
  - kind: permitted_alternative
    condition: Применяется разрешённый организационный метод п.75.
    behavior: 'Не считать отсутствие видимого шифрования доказательством нарушения: методы перечислены как альтернативы.'
    norms:
    - n53_p75
  - kind: evidence_limit
    condition: Устройство подключено, но его авторизация неизвестна.
    behavior: Не приравнивать любое USB-устройство к запрещённому; проверить актив и область п.34–35.
    norms:
    - n53_p45
    - n53_p34
    - n53_p35
  check:
  - Авторизация носителя
  - Настройки защиты
  - Антивирусные журналы
  - Категория актива
  limits: Нет универсального запрета любого USB-устройства. Пункт 75 предусматривает организационные и технические альтернативы;
    шифрование и сканирование не видны по корпусу.
  norms:
  - n53_p116
  - n53_p34
  - n53_p35
  - n53_p45
  - n53_p75
fire_end_shift:
  title: Приборы оставлены под напряжением после окончания смены
  domain: Пожарная безопасность
  procedure_type: operator_procedure
  actor: Ответственный за помещения/оборудование и работник по инструкции
  applicability: Подтверждены конец рабочего времени/смены, питание и назначение устройства.
  expected_outcome: После смены питание снято там, где нет предусмотренного исключения.
  steps:
  - action: По окончании рабочего времени обесточить электрические установки и приборы, не подпадающие под исключения.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p83
  - action: Сохранить питание аварийного освещения, предусмотренных установок пожаротушения/водоснабжения и сигнализации.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p83
  - action: Для иных оставленных под напряжением устройств подтвердить функциональное назначение и/или требование инструкции
      изготовителя.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - n55_p83
  exceptions:
  - kind: express_normative_exception
    condition: Непрерывное питание обусловлено функцией и/или инструкцией изготовителя.
    behavior: Пункт 83 допускает оставление под напряжением.
    norms:
    - n55_p83
  - kind: evidence_limit
    condition: Монитор светится, но питание от сети и конец смены не установлены.
    behavior: Не делать вывод об оставленном под напряжением приборе после работы.
    norms:
    - n55_p83
  check:
  - Конец смены
  - Подключение/питание
  - Модель и инструкция
  - Функция устройства
  limits: Допускается непрерывная работа по функциональному назначению или инструкции изготовителя; аварийное освещение и
    системы противопожарной защиты остаются под напряжением. Экран ноутбука на аккумуляторе не доказывает подключение к сети.
  norms:
  - n55_p83
fire_electrical_defect:
  title: Эксплуатация явно неисправного электрооборудования
  domain: Пожарная безопасность
  procedure_type: operator_procedure
  actor: Ответственный за эксплуатацию; уполномоченный персонал устраняет неисправность
  applicability: Подтверждён конкретный дефект или нарушение инструкции, имеющее отношение к требованиям п.86.
  expected_outcome: Неисправный прибор обесточен и не используется до устранения дефекта.
  steps:
  - action: Не эксплуатировать сети/приборы с перечисленными в п.86 опасными дефектами, повреждённой изоляцией, нарушенной
      защитой или иным установленным запретом.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p86
  - action: При обнаружении неисправности обесточить электроустановку/бытовой прибор.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p95
  - action: Повторно включать только после устранения неисправности.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p95
  exceptions:
  - kind: applicability_limit
    condition: Специальная подставка или терморегулятор конструкцией/инструкцией не предусмотрены.
    behavior: Учитывать условия соответствующих подпунктов п.86; не требовать несуществующий элемент от любого прибора.
    norms:
    - n55_p86
  - kind: evidence_limit
    condition: Есть только внешний износ без подтверждённой неисправности.
    behavior: Нужна диагностика/видимый конкретный дефект, а не предположение по возрасту устройства.
    norms:
    - n55_p86
    - n55_p95
  check:
  - Конкретный дефект
  - Инструкция изготовителя
  - Факт питания
  - Подтверждение устранения
  limits: Старый вид корпуса не доказывает неисправность; требования заводской инструкции и характеристики защиты не определяются
    по общему видео.
  norms:
  - n55_p86
  - n55_p95
evacuation_blocked:
  title: Загроможденный выход или заблокированная эвакуация
  domain: Пожарная безопасность
  procedure_type: standing_condition
  actor: Работодатель и ответственные за пожарную безопасность/помещение
  applicability: Подтверждено, что проход/дверь является путём или выходом эвакуации.
  expected_outcome: Эвакуация свободна и выходы открываются в применимом режиме.
  steps:
  - action: Содержать аварийные пути/выходы обозначенными и свободными; не загромождать выходы и доступ к средствам пожарной
      безопасности.
    kind: required_action
    observability: partly_observable
    norms:
    - tk_p184_3
    - n55_p24
  - action: Обеспечить свободное открывание эвакуационного выхода изнутри без ключа, кроме законных исключений.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p34
  - action: Не сужать проектные размеры путей, не блокировать двери; для специальных дверей/турникетов проверить дублирующий
      путь или предусмотренное техническое решение по п.36.
    kind: required_action
    observability: partly_observable
    norms:
    - n55_p36
  exceptions:
  - kind: express_normative_exception
    condition: Решётка установлена в помещении кассы.
    behavior: Пункт 24 пп.8) содержит исключение для касс; сама решётка не доказывает загромождение эвакуации.
    norms:
    - n55_p24
  - kind: permitted_alternative
    condition: Специальная дверь/турникет имеет предусмотренное открывание и фиксацию либо дублирующий путь.
    behavior: Оценить условия п.36; не запрещать конструкцию по её внешнему виду.
    norms:
    - n55_p36
  - kind: evidence_limit
    condition: Дверь заперта снаружи.
    behavior: Проверять открывание изнутри и назначение выхода; внешняя скважина не доказывает блокировку.
    norms:
    - n55_p34
  check:
  - План эвакуации/проект
  - Размеры прохода
  - Открывание изнутри
  - Назначение помещения
  limits: Запираемая служебная дверь кассы не обязательно эвакуационный выход. Различать требования кассовой защиты и свободного
    выхода; учитывать исключения в самих пунктах.
  norms:
  - tk_p184_3
  - n55_p24
  - n55_p34
  - n55_p36
id_collateral:
  title: Удостоверение личности принято в залог
  domain: Документы клиента
  procedure_type: standing_condition
  actor: Кассовый работник/банк; уполномоченные органы в отдельном случае
  applicability: Установлена цель удержания документа, удостоверяющего личность.
  expected_outcome: Документ не удерживается как обеспечение обязательства.
  steps:
  - action: Не принимать удостоверяющий личность документ в залог.
    kind: required_action
    observability: partly_observable
    norms:
    - law73_p23_2
  - action: При оценке изъятия отличить предусмотренное законом действие должностного лица по ст.23 п.1 от удержания банком
      в обеспечение.
    kind: review_check
    observability: context_required
    norms:
    - law73_p23_1
  - action: Подтвердить залоговую цель и условия возврата, а не только краткую передачу документа.
    kind: review_check
    observability: context_required
    norms:
    - law73_p23_2
  exceptions:
  - kind: applicability_limit
    condition: Документ предъявлен для обычной идентификации или правомерно изъят уполномоченным должностным лицом.
    behavior: Не квалифицировать по одному факту нахождения документа в чужой руке как залог.
    norms:
    - law73_p23_1
    - law73_p23_2
  check:
  - Цель передачи
  - Условия возврата
  - Полномочия изымающего
  limits: Краткая передача удостоверения кассиру для идентификации не является залогом или изъятием. Без контекста цель удержания
    документа не устанавливается.
  norms:
  - law73_p23_1
  - law73_p23_2
digital_id_exception:
  title: Цифровое удостоверение вместо пластиковой карточки
  domain: Документы клиента
  procedure_type: operator_procedure
  actor: Кассовый работник
  applicability: Предъявлены данные именно сервиса цифровых документов, а не произвольная фотография удостоверения.
  expected_outcome: Идентификация учитывает законный цифровой вариант без ложного требования пластиковой карточки.
  steps:
  - action: Учитывать равнозначность документа из сервиса цифровых документов бумажному с установленными законом исключениями.
    kind: required_action
    observability: context_required
    norms:
    - law73_p6_4
  - action: При приёме наличных использовать допустимые данные по п.19 пп.1), при выдаче — по п.31 пп.1).
    kind: required_action
    observability: context_required
    norms:
    - n231_p19
    - n231_p31
  - action: Проверяющему установить канал предъявления; не считать отсутствие пластика пропуском идентификации.
    kind: review_check
    observability: context_required
    norms:
    - law73_p6_4
    - n231_p19
    - n231_p31
  exceptions:
  - kind: evidence_limit
    condition: Показана обычная фотография либо источник цифровых данных неизвестен.
    behavior: Не приравнивать автоматически к сервису цифровых документов; правомерность канала требует подтверждения.
    norms:
    - law73_p6_4
  check:
  - Источник цифрового документа
  - Этап идентификации
  - Применимая операция
  limits: Отсутствие предъявления физической карточки нельзя само по себе размечать как нарушение. Обычная фотография документа
    не автоматически равна документу из установленного сервиса.
  norms:
  - n231_p19
  - n231_p31
  - law73_p6_4
ls_local_duties:
  title: Трудовой распорядок, обязанности и уход на перерыв
  domain: Трудовое законодательство
  procedure_type: document_audit
  actor: Работодатель и работник
  applicability: Известны трудовая функция, договор, акты работодателя и время/причина отсутствия.
  expected_outcome: Обязанности и режим отдыха установлены, доведены и соблюдаются в соответствующих обстоятельствах.
  steps:
  - action: Работодателю утвердить правила трудового распорядка с режимом рабочего времени/отдыха и дисциплиной.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p63_1
    - tk_p63_2
  - action: Ознакомить работника с относящимися к работе актами; работнику выполнять обязанности по договору и актам.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p23_2_6
    - tk_p22_2_1
  - action: Предусмотреть перерыв для отдыха/питания не менее 30 минут; время и длительность определить по ст.81 п.2.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p81_1
    - tk_p81_2
  - action: Для работ, где обычный перерыв невозможен, обеспечить отдых и питание в рабочее время в оборудованном месте по
      установленному перечню и порядку.
    kind: conditional_action
    observability: not_visually_verifiable
    norms:
    - tk_p81_3
  exceptions:
  - kind: express_normative_exception
    condition: Непрерывная работа или подтверждённый разрешённый перерыв.
    behavior: Применить ст.81 п.3 либо установленный режим; отсутствие работника само по себе не нарушение.
    norms:
    - tk_p81_1
    - tk_p81_2
    - tk_p81_3
  check:
  - Договор и правила
  - Ознакомление
  - График/перечень работ
  - Причина отсутствия
  limits: Уход сам по себе не доказывает нарушение. Статья 81 предусматривает перерыв для отдыха и питания не менее получаса,
    а время и порядок определяются договорами и правилами распорядка. Для непрерывной работы предусмотрен особый порядок.
    Правомерный перерыв не отменяет отдельной обязанности завершить обслуживание или защитить ценности, если такая обязанность
    установлена.
  norms:
  - tk_p22_2_1
  - tk_p23_2_6
  - tk_p63_1
  - tk_p63_2
  - tk_p81_1
  - tk_p81_2
  - tk_p81_3
ls_cyber_policy:
  title: Обязанность соблюдать требования кибербезопасности и ознакомление с актами работодателя
  domain: Трудовое законодательство и ИБ
  procedure_type: document_audit
  actor: Работодатель и работник
  applicability: Известны акты по кибербезопасности для должности и системы на дату события.
  expected_outcome: Применимые требования доведены, а оценка поведения опирается на их установленное содержание.
  steps:
  - action: Работодателю ознакомить работников с требованиями своих актов по кибербезопасности и контролировать исполнение.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p23_2_25_1
  - action: Работнику соблюдать требования безопасности, включая кибербезопасность, на рабочем месте.
    kind: required_action
    observability: context_required
    norms:
    - tk_p22_2_3
  - action: Для конкретного отклонения установить содержание требования, его применимость и наблюдаемое несоблюдение.
    kind: review_check
    observability: not_visually_verifiable
    norms:
    - tk_p22_2_3
    - tk_p23_2_25_1
  exceptions:
  - kind: applicability_limit
    condition: Конкретное правило немедленной блокировки для кассира не найдено.
    behavior: Общие обязанности не дополнять вымышленным сроком или действием; сохранить вопрос применимости.
    norms:
    - tk_p22_2_3
    - tk_p23_2_25_1
  check:
  - Акт работодателя
  - Ознакомление
  - Система и дата
  - Фактическое действие
  limits: Трудовой кодекс даёт общую обязанность и требует ознакомления с актами работодателя и внутреннего контроля. Он не
    устанавливает здесь отдельного универсального правила немедленно блокировать любой экран при кратком уходе. Это дополнение
    к обоснованию Х-28, а не закрытие пробела в локальном правиле ForteBank.
  norms:
  - tk_p22_2_3
  - tk_p23_2_25_1
ls_property_care:
  title: Бережное отношение к имуществу и сообщение об угрозе его сохранности
  domain: Трудовое законодательство
  procedure_type: general_obligation_review
  actor: Работник
  applicability: Подтверждены имущество работодателя/работников и конкретная угроза его сохранности.
  expected_outcome: Имущество используется бережно, о возникшей угрозе сообщено при наличии основания.
  steps:
  - action: Бережно относиться к имуществу работодателя и работников.
    kind: required_action
    observability: context_required
    norms:
    - tk_p22_2_4
  - action: Сообщить о возникшей ситуации, угрожающей жизни/здоровью людей или сохранности имущества, и о простое в предусмотренном
      ст.22 п.2 пп.5) порядке.
    kind: required_action
    observability: context_required
    norms:
    - tk_p22_2_5
  - action: При оценке установить, какое действие связано с конкретной угрозой; не выводить обязательное место ключа из общей
      обязанности.
    kind: review_check
    observability: context_required
    norms:
    - tk_p22_2_4
    - tk_p22_2_5
  exceptions:
  - kind: evidence_limit
    condition: Нет подтверждённой угрозы, принадлежности имущества или наблюдения сообщения.
    behavior: Общая обязанность не доказывает нарушение конкретного работника по одному предмету на столе.
    norms:
    - tk_p22_2_4
    - tk_p22_2_5
  check:
  - Принадлежность
  - Характер угрозы
  - Канал сообщения
  - Действия работника
  limits: Общая обязанность не задаёт место хранения каждого ключа, печати или сумки. Для кассовых ценностей первичны специальные
    правила №231, включая пункт 80 и внутренний порядок. Пустая сумка, открытие сейфа при операции или отсутствие видимого
    сообщения не доказывают нарушение либо ущерб.
  norms:
  - tk_p22_2_4
  - tk_p22_2_5
ls_confidentiality:
  title: Неразглашение охраняемой законом тайны работником
  domain: Трудовое законодательство и ИБ
  procedure_type: general_obligation_review
  actor: Работник
  applicability: Сведения получены по работе и относятся к охраняемой законом тайне.
  expected_outcome: Работник сохраняет установленную законом тайну; конкретный вывод подкреплён содержанием и фактом передачи.
  steps:
  - action: Не разглашать государственную, служебную, коммерческую и иную охраняемую законом тайну, ставшую известной в связи
      с трудовыми обязанностями.
    kind: required_action
    observability: context_required
    norms:
    - tk_p22_2_6
  - action: При оценке установить защищаемое содержание, получателя и факт разглашения; не подменять их наличием бумаги или
      светящегося экрана.
    kind: review_check
    observability: context_required
    norms:
    - tk_p22_2_6
  exceptions:
  - kind: evidence_limit
    condition: Сведения не идентифицированы или правовой режим и факт разглашения неизвестны.
    behavior: Недостаточно данных для вывода по общей трудовой обязанности.
    norms:
    - tk_p22_2_6
  check:
  - Категория сведений
  - Получатель
  - Содержание и обстоятельства передачи
  limits: Нечитаемый экран или закрытая книга не доказывают ни содержание сведений, ни разглашение. Статья не превращает каждую
    бумагу на столе в нарушение политики чистого стола и не заменяет специальные нормы банковской тайны.
  norms:
  - tk_p22_2_6
ls_hazard_notification:
  title: Сообщение об опасной ситуации и приостановление опасной работы
  domain: Охрана труда
  procedure_type: operator_procedure
  actor: Работник и работодатель — разные обязанности
  applicability: Установлена реальная угроза жизни/здоровью или опасная аварийная ситуация.
  expected_outcome: Работник сообщил, работодатель выполнил применимые меры прекращения и предотвращения опасности.
  steps:
  - action: Работнику незамедлительно сообщать о травмах, признаках профзаболевания и угрозе жизни/здоровью в объёме ст.181
      п.2 пп.2).
    kind: required_action
    observability: context_required
    norms:
    - tk_p181_2_2
  - action: Работодателю приостанавливать работу, если её продолжение создаёт угрозу жизни/здоровью.
    kind: required_action
    observability: context_required
    norms:
    - tk_p23_2_13
  - action: Работодателю принимать неотложные меры для предотвращения развития аварийной ситуации и воздействия травмирующих
      факторов на других лиц.
    kind: required_action
    observability: context_required
    norms:
    - tk_p182_2_15
  exceptions:
  - kind: evidence_limit
    condition: Сообщение сделано вне кадра или по цифровому каналу.
    behavior: Не считать отсутствующим по одному молчанию/жесту; проверить фактический канал и время.
    norms:
    - tk_p181_2_2
  check:
  - Подтверждённая угроза
  - Время обнаружения
  - Сообщение
  - Действия работодателя
  limits: Работник сообщает об угрозе, работодатель приостанавливает опасную работу и предотвращает развитие аварии. Сообщение
    может быть вне кадра или по цифровому каналу. Внешний износ прибора без установленной опасности недостаточен; ответственность
    разных участников не смешивается.
  norms:
  - tk_p181_2_2
  - tk_p182_2_15
  - tk_p23_2_13
ls_equipment_safety:
  title: Безопасность рабочего оборудования и техническая исправность электроустановок
  domain: Охрана труда и электробезопасность
  procedure_type: document_and_visual_review
  actor: Работодатель, ответственные за условия труда и эксплуатацию
  applicability: Известны вид оборудования, применимые нормы и установленный дефект/защита.
  expected_outcome: Для конкретного оборудования подтверждены исправность и требуемая защита.
  steps:
  - action: Обеспечить соответствие оборудования нормам безопасности, наличие предусмотренных технических документов, предупреждений
      и защит по ст.184 п.2.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p184_2
  - action: Работодателю обеспечить безопасные условия и учитывать установленную ответственность по ст.184 п.2-1.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p184_2_1
  - action: Эксплуатировать электроустановки в исправном состоянии и безопасных условиях по п.4 Правил №222.
    kind: required_action
    observability: context_required
    norms:
    - n222_p4
  exceptions:
  - kind: applicability_limit
    condition: Обычному устройству конструкцией не требуется предполагаемое ограждение/сигнализация.
    behavior: Сначала установить требования к этому типу оборудования; не выводить дефект из отсутствия произвольного элемента.
    norms:
    - tk_p184_2
  check:
  - Тип/паспорт
  - Применимые нормы
  - Диагностика и защитные средства
  - Ответственный субъект
  limits: За ненадлежащее создание условий безопасности труда отвечает работодатель. Наличие и параметры защит проверяются
    по требованиям к данному виду оборудования; отсутствие видимого паспорта или ограждения на обычном ноутбуке не доказывает
    нарушение. Блокировка пользовательского сеанса не является отключением электрического питания.
  norms:
  - tk_p184_2
  - tk_p184_2_1
  - n222_p4
ls_danger_zone_access:
  title: Ограничение доступа посторонних в опасную рабочую зону
  domain: Охрана труда и допуск
  procedure_type: premises_audit
  actor: Работодатель
  applicability: Опасная зона определена по характеру работы и риску для работников.
  expected_outcome: Подтверждённая опасная зона обозначена и защищена от доступа посторонних.
  steps:
  - action: Обозначить опасную зону ясными знаками и обеспечить устройства, ограничивающие доступ посторонних.
    kind: required_action
    observability: partly_observable
    norms:
    - tk_p184_4
  - action: Проверить границы, характер опасности и действие ограничения доступа.
    kind: review_check
    observability: context_required
    norms:
    - tk_p184_4
  exceptions:
  - kind: applicability_limit
    condition: Помещение — касса, но конкретная опасная зона по условиям труда не установлена.
    behavior: Не присваивать категорию только по наличию сейфа или денег; применимость трудовой нормы подтвердить отдельно.
    norms:
    - tk_p184_4
  check:
  - Классификация опасности
  - Границы и знаки
  - Устройства доступа
  limits: Кассовая зона не признаётся опасной в смысле статьи 184 только из-за наличия денег или сейфа. Для обычного допуска
    в кассу применяются специальные банковские правила. По внешности вошедшего его полномочия не устанавливаются.
  norms:
  - tk_p184_4
ls_instruction_lifecycle:
  title: Разработка, утверждение и пересмотр инструкции по охране труда
  domain: Документальная проверка охраны труда
  procedure_type: document_audit
  actor: Работодатель; служба охраны труда и согласующие лица
  applicability: Известны профессии/работы, условия труда и действующая инструкция.
  expected_outcome: Инструкция разработана, согласована, утверждена и своевременно пересмотрена/продлена.
  steps:
  - action: Разработать инструкции как акты работодателя для профессий/работ по перечню с учётом нормативов, технологии и
      документации изготовителя.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p182_2_16
    - n927_p2
    - n927_p3
    - n927_p5
  - action: Согласовать инструкцию со службой охраны труда/ответственным, заинтересованными подразделениями и представителями
      работников; утвердить работодателем.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p17
  - action: Пересматривать не реже раза в три года в редакции с 01.07.2026 и досрочно при предусмотренных изменениях законодательства,
      техники или результатах расследования.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p19
  - action: Если условия не изменились, оформить предусмотренное продление отметкой «Пересмотрено», ФИО, датой и подписью
      ответственного.
    kind: conditional_action
    observability: not_visually_verifiable
    norms:
    - n927_p20
  exceptions:
  - kind: permitted_alternative
    condition: Условия труда не изменились в установленный срок.
    behavior: Пункт 20 предусматривает продление с отметкой; отсутствие полностью нового текста не доказывает просрочку.
    norms:
    - n927_p19
    - n927_p20
  - kind: evidence_limit
    condition: Инструкция не опубликована в интернете.
    behavior: Проверить её наличие у работодателя; неопубликованность не равна отсутствию.
    norms:
    - n927_p2
    - n927_p17
  check:
  - Перечень профессий
  - Основания и инструкция
  - Согласования
  - Даты/отметки
  limits: Приказ №927 регулирует содержание и жизненный цикл акта работодателя. Он не является готовой инструкцией кассира
    ForteBank. В редакции с 01.07.2026 пересмотр — не реже одного раза в три года; при неизменных условиях предусмотрено продление
    с отметкой. Отсутствие инструкции в интернете не доказывает её отсутствия у работодателя.
  norms:
  - tk_p182_2_16
  - n927_p17
  - n927_p19
  - n927_p2
  - n927_p20
  - n927_p3
  - n927_p5
ls_shift_shutdown:
  title: Порядок отключения оборудования и передачи рабочего места после смены
  domain: Охрана труда и завершение смены
  procedure_type: operator_procedure
  actor: Работодатель задаёт инструкцию; работник исполняет её
  applicability: Подтверждено окончание работы и применимая инструкция для устройства/профессии.
  expected_outcome: Инструкция задаёт завершение/передачу, а действия соответствуют установленному режиму.
  steps:
  - action: Включить в инструкцию раздел требований по окончании работы.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p10_5
  - action: Установить порядок безопасного отключения/остановки и иной предусмотренной обработки оборудования; при непрерывном
      процессе — передачи смене.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p15_1
  - action: Установить порядок сдачи рабочего места и сообщения о выявленных недостатках.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p15_2
    - n927_p15_5
  - action: Работнику выполнять применимые требования инструкции по охране труда.
    kind: required_action
    observability: context_required
    norms:
    - tk_p181_2_1
  exceptions:
  - kind: permitted_alternative
    condition: Непрерывный процесс.
    behavior: Пункт 15 прямо предусматривает передачу по смене; нельзя требовать безусловного отключения всего.
    norms:
    - n927_p15_1
  check:
  - Инструкция
  - Конец смены
  - Режим устройства
  - Передача и уведомление
  limits: Непрерывный процесс прямо предполагает передачу смене вместо безусловного отключения всего оборудования. Приказ
    №927 требует описать процедуру в инструкции; сам не задаёт её для конкретной кассы. Для оставленной под напряжением техники
    прямое публичное основание — пункт 83 Правил пожарной безопасности с его исключениями.
  norms:
  - tk_p181_2_1
  - n927_p10_5
  - n927_p15_1
  - n927_p15_2
  - n927_p15_5
ls_workplace_preparation:
  title: Подготовка и безопасное содержание рабочего места
  domain: Охрана труда
  procedure_type: operator_procedure
  actor: Работодатель и работник
  applicability: Известны действующая инструкция, характер работы и этап подготовки/приёма смены.
  expected_outcome: Рабочее место подготовлено и содержится в соответствии с применимой инструкцией.
  steps:
  - action: Предусмотреть подготовку рабочего места и проверку оборудования/защитных устройств в инструкции.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p12_1
    - n927_p12_2
  - action: Для непрерывной работы предусмотреть порядок приёма смены; включить безопасное содержание рабочего места во время
      работы.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n927_p12_4
    - n927_p13_4
  - action: Работнику выполнять установленные требования и предусмотренные проверки.
    kind: required_action
    observability: context_required
    norms:
    - tk_p181_2_1
  exceptions:
  - kind: evidence_limit
    condition: Подготовка была до начала ролика или операция не требует приёма непрерывной смены.
    behavior: Не считать отсутствие соответствующего действия в фрагменте подтверждённым пропуском.
    norms:
    - n927_p12_1
    - n927_p12_2
    - n927_p12_4
  check:
  - Инструкция и стадия
  - Проверки оборудования
  - Приём смены
  limits: Это требования к содержанию локальной инструкции и её соблюдению. Из них нельзя вывести единый запрет любой чашки,
    личного предмета или бумаги на столе. Для личных вещей в кассовом узле отдельно проверяется пункт 12 №231. Невидимая на
    коротком ролике проверка не считается пропущенной.
  norms:
  - tk_p181_2_1
  - n927_p12_1
  - n927_p12_2
  - n927_p12_4
  - n927_p13_4
ls_training:
  title: Обучение, инструктажи и документальный допуск к работе
  domain: Документальная проверка охраны труда
  procedure_type: document_audit
  actor: Работодатель, организатор обучения, инструктирующий и работник
  applicability: Установлены категория работника, профессия, вид работ, даты и применимая программа.
  expected_outcome: Обучение, инструктажи и допуск подтверждены по категории, срокам и документам.
  steps:
  - action: Работодателю организовать обучение/инструктажи за свой счёт; работнику пройти предусмотренное обучение, инструктажи
      и проверку знаний.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - tk_p182_2_2
    - tk_p181_2_8
  - action: 'По разделу для работников: обучение вновь принятых/переведённых с проверкой знаний — не позднее месяца; очередное
      — не реже раза в год; к работе без требуемой проверки не допускать.'
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n1019_p4
    - n1019_p5
    - n1019_p6
  - action: Установить перечни профессий/работ и форму обучения по п.7; проводить вводный инструктаж для категорий п.56.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n1019_p7
    - n1019_p56
  - action: Проверить оформленные освобождения от первичного инструктажа и категории повторного; повторный инструктаж проводить
      не реже раза в полугодие с учётом п.62.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n1019_p61
    - n1019_p62
  - action: Записывать инструктажи и допуск в журнал с подписями; электронный журнал удостоверять ЭЦП по п.71.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n1019_p71
  exceptions:
  - kind: express_normative_exception
    condition: Перемещение в пределах профессии с сохранением условий труда.
    behavior: Пункт 6 не требует повторного обучения и проверки знаний при указанных условиях.
    norms:
    - n1019_p6
  - kind: express_normative_exception
    condition: Оформленное освобождение определённой категории от первичного инструктажа.
    behavior: Проверить решение и утверждённый перечень п.61; оно не освобождает автоматически от всех видов обучения.
    norms:
    - n1019_p61
  - kind: permitted_alternative
    condition: Категории, указанные в оговорке п.62, либо электронный журнал.
    behavior: Учитывать исключение повторного инструктажа и допустимость журнала с ЭЦП; отсутствие бумажной книги не доказательство.
    norms:
    - n1019_p62
    - n1019_p71
  check:
  - Категория/перечни
  - Протоколы и сроки
  - Журнал/ЭЦП
  - Решения об исключениях
  limits: Не пройденное обучение не устанавливается по неуверенному движению на видео. Пункт 61 допускает оформленное освобождение
    определённых работников от первичного инструктажа; оно не возникает автоматически из названия должности и не равно освобождению
    от всего обучения. В пункте 6 есть исключение для перемещения с сохранением условий; пункт 62 также содержит оговорку
    о категориях. Журнал по пункту 71 может быть бумажным или электронным с ЭЦП.
  norms:
  - tk_p181_2_8
  - tk_p182_2_2
  - n1019_p4
  - n1019_p5
  - n1019_p56
  - n1019_p6
  - n1019_p61
  - n1019_p62
  - n1019_p7
  - n1019_p71
ls_electrical_roles:
  title: Ответственные лица и подготовленный персонал для эксплуатации электроустановок
  domain: Электробезопасность
  procedure_type: document_audit
  actor: Руководитель потребителя/банка и ответственные за электроустановки
  applicability: Речь о технической эксплуатации электроустановок, а не обычном пользовании ноутбуком.
  expected_outcome: Эксплуатация поручена подготовленным и надлежаще назначенным исполнителям.
  steps:
  - action: Организовать эксплуатацию подготовленным электротехническим персоналом либо по договору со специализированной
      организацией.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n246_p3
  - action: Юридическому лицу назначить ответственного за электроустановки и заместителя по п.4, с учётом предусмотренных
      исключений.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n246_p4
  - action: Назначить ответственных структурных подразделений по представлению и закрепить распределение обязанностей в должностных
      инструкциях.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n246_p7
  exceptions:
  - kind: express_normative_exception
    condition: Установленная мощность электроустановок не превышает 10 кВА.
    behavior: Пункт 4 не требует замещающего работника; это не общее освобождение юридического лица от ответственного.
    norms:
    - n246_p4
  - kind: permitted_alternative
    condition: Эксплуатация передана специализированной организации.
    behavior: Пункт 3 допускает договор; проверить договор и распределение ответственности, не считать отсутствие собственного
      электрика нарушением.
    norms:
    - n246_p3
  - kind: applicability_limit
    condition: Исключения для физических лиц.
    behavior: Не переносить их на банк как юридическое лицо.
    norms:
    - n246_p4
  check:
  - Приказы/договор
  - Квалификация
  - Мощность
  - Должностные инструкции
  limits: Обычное пользование ноутбуком не делает кассира электротехническим персоналом. Допустимо обслуживание специализированной
    организацией. У потребителя мощностью не более 10 кВА пункт 4 освобождает от назначения заместителя, а не автоматически
    самого ответственного; исключения для физических лиц нельзя переносить на банк.
  norms:
  - n246_p3
  - n246_p4
  - n246_p7
ls_electrical_room_access:
  title: Доступ, запирающие устройства и ключи помещений электроустановок
  domain: Электробезопасность и допуск
  procedure_type: operator_procedure
  actor: Оперативный/административно-технический персонал и допущенные работники
  applicability: Подтверждено помещение электроустановки, камера/щит/сборка и режим работ.
  expected_outcome: Доступ и ключи электроустановок контролируются по полномочиям и режиму работ.
  steps:
  - action: Единоличный осмотр выполнять лицам по п.19; иных работников допускать с сопровождающим по п.20, контролирующим
      их безопасность.
    kind: required_action
    observability: context_required
    norms:
    - n222_p19
    - n222_p20
  - action: Оборудовать двери запирающими устройствами; при производстве работ камеры, щиты и сборки не запирать.
    kind: required_action
    observability: partly_observable
    norms:
    - n222_p26
  - action: Учитывать и нумеровать ключи, хранить в запираемом ящике с запасным комплектом; выдавать под расписку уполномоченным
      лицам.
    kind: required_action
    observability: context_required
    norms:
    - n222_p27
  - action: Возвращать ключи по окончании работ/осмотра и учитывать выдачу/возврат в предусмотренном журнале.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n222_p27
  exceptions:
  - kind: express_normative_exception
    condition: Нет местного оперативного персонала.
    behavior: Ключи могут возвращаться не позднее следующего рабочего дня после осмотра или полного окончания работ.
    norms:
    - n222_p27
  - kind: express_normative_exception
    condition: Идут работы в камере, щите или сборке.
    behavior: Пункт 26 предусматривает незапирание; открытое состояние само по себе не нарушение.
    norms:
    - n222_p26
  - kind: applicability_limit
    condition: Ключ относится к денежному сейфу или кассовой двери.
    behavior: Эта электротехническая процедура не применяется без идентификации объекта.
    norms:
    - n222_p19
    - n222_p26
    - n222_p27
  check:
  - Назначение помещения/ключа
  - Допуск и группа
  - Режим работ
  - Журнал выдачи
  limits: Не переносить эти правила на дверь кассы или ключ от денежного сейфа. Пункт 26 предусматривает незапирание камер,
    щитов и сборок при производстве работ. Для возврата ключей пункт 27 различает наличие местного оперативного персонала;
    возможен возврат на следующий рабочий день. Тип ключа и режим обслуживания по виду связки не устанавливаются.
  norms:
  - n222_p19
  - n222_p20
  - n222_p26
  - n222_p27
ls_electrical_documents:
  title: Инструкции изготовителя и техническая документация электрооборудования
  domain: Документальная проверка электробезопасности
  procedure_type: document_audit
  actor: Потребитель электроустановок/работодатель и ответственные за эксплуатацию
  applicability: Известны оборудование, профессии и комплект эксплуатационных документов.
  expected_outcome: Комплект технических документов и перечни существуют и соответствуют оборудованию/работам.
  steps:
  - action: Вести журнал оборудования с техническими данными/инвентарными номерами и приложенными документами изготовителя,
      испытаний, ремонта и обслуживания по п.99 пп.1).
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n246_p99_1
  - action: Иметь эксплуатационные инструкции и инструкции по безопасности/охране труда по п.99 пп.6); при разработке учитывать
      нормы, технологию и документацию изготовителя.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n246_p99_6
    - n927_p5
  - action: Утвердить/иметь предусмотренный перечень профессий и рабочих мест, требующих отнесения к группе 1 по электробезопасности.
    kind: required_action
    observability: not_visually_verifiable
    norms:
    - n246_p99_13
  exceptions:
  - kind: applicability_limit
    condition: Проверяется основание непрерывного питания ноутбука или требование группы 1 к кассиру.
    behavior: Пункт 99 не устанавливает их автоматически; нужны конкретная инструкция устройства и перечень профессий/мест.
    norms:
    - n246_p99_1
    - n246_p99_13
    - n927_p5
  check:
  - Инвентарный журнал
  - Паспорта и инструкции
  - Протоколы
  - Перечень профессий
  limits: Эти документы помогают проверить режим непрерывной работы и требования безопасности. Сам пункт 99 не объявляет любой
    ноутбук оборудованием непрерывной работы и не доказывает исключение из пункта 83 пожарных правил. Нельзя требовать группу
    I от всех кассиров без проверки перечня профессий и рабочих мест.
  norms:
  - n246_p99_1
  - n246_p99_13
  - n246_p99_6
  - n927_p5
