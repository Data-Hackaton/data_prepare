    именуемой в дальнейшем «Служба инкассации»; 2) При доставке Службой инкассации инкассированных денег в Банк прием и пересчет
    наличных денег осуществляется в порядке, установленном законодательством РК;'
  requirement: Для инкассированных денег зачисление производится не позднее следующего операционного дня; порядок приёма и
    пересчёта отнесён к законодательству.
