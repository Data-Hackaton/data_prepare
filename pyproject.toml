[project]
name = "data-prepare"
version = "0.1.0"
description = "Подготовка датасета Datathon 26: распаковка, имена, дубли, разметка, CVAT"
authors = [
    { name = "Nik", email = "byluginnikita@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cvat-sdk==2.79.0",
    "numpy==2.3.4",
    "openpyxl>=3.1.5",
    "pyarrow==22.0.0",
    "pyyaml==6.0.3",
    "transitions==0.9.3",
]

[project.scripts]
prepare = "data_prepare.prepare:main"
contact-sheets = "data_prepare.contact_sheets:main"
reference-actions = "data_prepare.reference_actions:main"
sample-frames = "data_prepare.sample_frames:main"
cvat-io = "data_prepare.cvat_io:main"
build-datasets = "data_prepare.build_datasets:main"
review-import = "data_prepare.review_import:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
