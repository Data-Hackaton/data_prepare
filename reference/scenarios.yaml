# Эталонный порядок действий (L2) по 19 видео без нарушений. Описание сцен — docs/norm.md.
# Шаг: action + actor (+ object, target). required: false — шаг бывает не в каждом экземпляре.
# Порядок шагов в экземпляре должен совпадать с порядком в шаблоне (пропуски необязательных допустимы, повторы — тоже).
# Инварианты проверяются на каждом экземпляре сценария; это кандидаты в правила decision.
# norm — id из norms.yaml; null — норматив не подтверждён, в отчёт без ссылки не выводим.
# title — тип нарушения в ответе жюри и в интерфейсе.
# severity — статус события, на котором сработало правило: violation (нарушение) или warning (предупреждение);
# по умолчанию violation, если есть norm, иначе warning (data_prepare/sop_events.py).

vocabulary:
  actors: [cashier, client, collector, visitor]  # visitor — второй посетитель, пока обслуживается клиент
  objects: [banknotes, id_card, bag, phone, document, foreign_object, computer]
  targets: [cash_machine, safe, safe_top, bag, desk, client, cashier, door]
  actions:
    person_enter: человек входит в комнату через дверь
    person_leave: человек выходит из комнаты
    give: передаёт предмет через стол (object → target)
    inspect: рассматривает предмет, подняв к глазам
    put: кладёт предмет (object → target); put … target desk — «положил на стол», должно быть «убрал»
    take: берёт предмет (object ← target); take … target desk — «убрал со стола»
    sort_banknotes: раскладывает купюры по стопкам на столе
    count_by_hand: пересчитывает купюры руками
    safe_open: открывает дверцу сейфа
    safe_close: закрывает дверцу сейфа
    open_bag: вскрывает инкассаторскую сумку
    use_laptop: работает за компьютером
    screen_lock: блокирует экран или закрывает ноутбук
    paperwork: оформляет бумаги на столе
    phone_call: говорит по мобильному телефону
    lights_off: выключает свет
    split_bundle: делит одну пачку на две части (в руках была одна пачка — стало две)
    keep: оставляет деньги при себе — не в машинку, не в сейф, не клиенту

scenarios:
  client_service:
    title: Обслуживание клиента — приём или выдача наличных
    steps:
      - {action: person_enter, actor: client, required: true}
      - {action: give, actor: client, object: [id_card, document], target: cashier, required: false}
      - {action: inspect, actor: cashier, object: id_card, required: false}
      - {action: give, actor: client, object: banknotes, target: cashier, required: false}
      - {action: put, actor: cashier, object: banknotes, target: cash_machine, required: false}
      - {action: take, actor: cashier, object: banknotes, target: cash_machine, required: false}
      - {action: put, actor: cashier, object: banknotes, target: desk, required: false}
      - {action: take, actor: cashier, object: banknotes, target: desk, required: false}
      - {action: use_laptop, actor: cashier, required: false}
      - {action: paperwork, actor: cashier, required: false}
      - {action: safe_open, actor: cashier, required: false}
      - {action: put, actor: cashier, object: banknotes, target: safe, required: false}
      - {action: take, actor: cashier, object: banknotes, target: safe, required: false}
      - {action: safe_close, actor: cashier, required: false}
      - {action: give, actor: cashier, object: [banknotes, id_card, document], target: client, required: false}
      - {action: person_leave, actor: client, required: false}
    invariants:
      - {title: Сейф открыт дольше обычного, kind: max_duration, from: safe_open, to: safe_close, sec: 20, norm: null, why: сейф открыт только на время закладки или выемки; в эталоне до ~11 с}
      - {title: Клиент ушёл при открытом сейфе, kind: before, first: safe_close, then: {action: person_leave, actor: client}, norm: null, why: клиент уходит при закрытом сейфе}
      - {title: Деньги в сейф без пересчёта на машинке, kind: before, first: {action: put, target: cash_machine}, then: {action: put, target: safe}, norm: null, why: деньги идут в сейф после машинки}
      - {title: Присвоение части наличных, kind: forbidden, action: split_bundle, norm: null, severity: violation, why: при клиенте пачку целиком отдают или кладут в сейф; по стопкам раскладывают только без посетителей (X-1)}
      - {title: Присвоение части наличных, kind: forbidden, action: keep, norm: null, severity: violation, why: деньги не остаются у кассира (X-1)}
      - {title: Пересчёт наличных после ухода клиента, kind: forbidden_after, after: {action: person_leave, actor: client}, action: {action: put, object: banknotes, target: cash_machine}, norm: n231_p20, why: деньги пересчитываются в присутствии клиента (X-34)}
      - {title: Пересчёт наличных после ухода клиента, kind: forbidden_after, after: {action: person_leave, actor: client}, action: count_by_hand, norm: n231_p20, why: деньги пересчитываются в присутствии клиента}
      - {title: Личные вещи на кассовом столе, kind: forbidden, action: {action: put, object: foreign_object, target: desk}, norm: n231_p12, why: личные вещи хранятся вне кассового узла}
      # предупреждение, не нарушение: детектор путает телефон у лица с удостоверением, поднятым к глазам (X-5)
      - {title: Телефон кассира при обслуживании клиента, kind: forbidden, action: phone_call, norm: null, severity: warning, why: при клиенте кассир не пользуется личным телефоном; примера в датасете нет (в X-2 у кассира купюры, не телефон; в X-14 телефон без клиента — норма)}
      - {title: Постороннее лицо у кассы во время обслуживания, kind: forbidden, action: {action: person_enter, actor: visitor}, norm: null, severity: violation, why: пока обслуживается клиент, у кассы нет других посетителей (X-18)}
      - {title: Кассир ушёл до окончания обслуживания, kind: before, first: {action: person_leave, actor: client}, then: {action: person_leave, actor: cashier}, norm: n231_p22, why: кассир не покидает рабочее место, пока клиент не обслужен}

  collection:
    title: Инкассация — передача и вскрытие сумок
    steps:
      - {action: person_enter, actor: collector, required: false}
      - {action: give, actor: collector, object: bag, target: cashier, required: false}
      - {action: inspect, actor: cashier, object: document, required: false}
      - {action: open_bag, actor: cashier, required: false}
      - {action: take, actor: cashier, object: banknotes, target: bag, required: false}
      - {action: put, actor: cashier, object: bag, target: safe_top, required: false}
      - {action: put, actor: cashier, object: banknotes, target: cash_machine, required: false}
      - {action: sort_banknotes, actor: cashier, required: false}
      - {action: safe_open, actor: cashier, required: false}
      - {action: put, actor: cashier, object: banknotes, target: safe, required: false}
      - {action: safe_close, actor: cashier, required: false}
      - {action: use_laptop, actor: cashier, required: false}
    invariants:
      - {title: Сейф открыт дольше обычного, kind: max_duration, from: safe_open, to: safe_close, sec: 20, norm: null, why: сейф открыт только на время закладки; в эталоне до ~11 с}
      - {title: Присвоение части наличных, kind: forbidden, action: keep, norm: null, why: деньги не остаются у кассира}
      - {title: Деньги в сейф без пересчёта на машинке, kind: before, first: {action: put, target: cash_machine}, then: {action: put, target: safe}, norm: null, why: пачки идут в сейф после пересчёта}
      - {title: Личные вещи на кассовом столе, kind: forbidden, action: {action: put, object: foreign_object, target: desk}, norm: n231_p12, why: личные вещи хранятся вне кассового узла}

  cash_handling:
    title: Работа с наличностью без посетителей
    steps:
      - {action: person_enter, actor: cashier, required: false}
      - {action: safe_open, actor: cashier, required: false}
      - {action: take, actor: cashier, object: banknotes, target: safe, required: false}
      - {action: safe_close, actor: cashier, required: false}
      - {action: put, actor: cashier, object: banknotes, target: cash_machine, required: true}
      - {action: sort_banknotes, actor: cashier, required: false}
      - {action: paperwork, actor: cashier, required: false}
      - {action: use_laptop, actor: cashier, required: false}
    invariants:
      - {title: Сейф открыт дольше обычного, kind: max_duration, from: safe_open, to: safe_close, sec: 20, norm: null, why: сейф открыт только на время выемки; в эталоне до ~11 с}
      - {title: Присвоение части наличных, kind: forbidden, action: keep, norm: null, why: деньги не остаются у кассира}
      - {title: Личные вещи на кассовом столе, kind: forbidden, action: {action: put, object: foreign_object, target: desk}, norm: n231_p12, why: личные вещи хранятся вне кассового узла (X-40)}

  leave_workplace:
    title: Уход кассира с рабочего места
    steps:
      - {action: use_laptop, actor: cashier, required: false}
      - {action: paperwork, actor: cashier, required: false}
      - {action: screen_lock, actor: cashier, required: false}  # в чистых X-12, X-23, X-27, X-29 — до работы с сейфом
      - {action: safe_open, actor: cashier, required: false}
      - {action: put, actor: cashier, object: [banknotes, document], target: safe, required: false}
      - {action: safe_close, actor: cashier, required: false}
      - {action: lights_off, actor: cashier, required: false}
      - {action: person_leave, actor: cashier, required: true}
    invariants:
      - {title: Кассир ушёл при открытом сейфе, kind: before, first: safe_close, then: {action: person_leave, actor: cashier}, if_present: safe_open, norm: null, why: кассир уходит при закрытом сейфе}
      - {title: Компьютер с активной сессией без присмотра, kind: before, first: screen_lock, then: {action: person_leave, actor: cashier}, if_present: use_laptop, norm: null, severity: violation, why: перед уходом кассир блокирует экран или закрывает ноутбук (X-11, X-28; в чистых X-12, X-29 — блокирует)}
      - {title: Сейф открыт дольше обычного, kind: max_duration, from: safe_open, to: safe_close, sec: 20, norm: null, why: сейф открыт только на время закладки; в эталоне до ~11 с}
      - {title: Присвоение части наличных, kind: forbidden, action: keep, norm: null, why: деньги не остаются у кассира}
      - {title: Личные вещи на кассовом столе, kind: forbidden, action: {action: put, object: foreign_object, target: desk}, norm: n231_p12, why: личные вещи хранятся вне кассового узла}

# Проверки через все экземпляры видео подряд.
video_invariants:
  # «Положил — убрал»: всё, что положили на стол при одном клиенте, убирают до следующего клиента.
  # Срабатывает в момент, когда приходит следующий клиент или кладутся его деньги, а деньги прошлого ещё на столе.
  - kind: desk_carryover
    title: Деньги предыдущего клиента на кассовом столе
    object: banknotes
    min_age_sec: 3  # положенное за секунды до прихода клиента — его же деньги (X-39)
    triggers:
      - {action: person_enter, actor: client}
      - {action: give, actor: client, object: banknotes}
      - {action: put, object: banknotes, target: desk}
    norm: n231_p20
    why: на рабочем месте кассира только наличные текущего клиента, ранее принятые хранятся в сейфе (X-4, X-38)
  # То же при уходе кассира: деньги и инкассаторская сумка не остаются на столе (X-15, X-26). any_instance —
  # срабатывает и на том, что положено в этом же экземпляре.
  - kind: desk_carryover
    title: Наличные на столе при уходе кассира
    object: [banknotes, bag]
    any_instance: true
    triggers:
      - {action: person_leave, actor: cashier}
    norm: n231_p20
    why: ранее принятые наличные хранятся в устройствах, закрывающихся на ключ, а не на столе

# Правила, которые ещё не проверяются на эталоне: нужен признак из L1 или подтверждённый норматив.
pending_rules: []
