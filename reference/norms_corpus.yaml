    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 61
  url: https://adilet.zan.kz/rus/docs/V1500012665#z248
  quote: 61. Лица, трудовые обязанности которых не связаны с применением, эксплуатацией, обслуживанием, испытанием, наладкой
    и ремонтом оборудования, использованием электрифицированного или иного механизированного ручного инструмента, хранением
    и применением сырья и материалов, освобождаются решением организатора обучения от прохождения первичного инструктажа на
    рабочем месте. Перечень профессий и должностей работников, освобождаемых от прохождения первичного инструктажа на рабочем
    месте, утверждается работодателем.
  heading: Глава 4. Порядок и сроки проведения инструктирования по вопросам безопасности и охраны труда работников, руководителей
    и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:61
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p62:
  short: МЗСР №1019 от 25.12.2015, пункт 62
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 62
  url: https://adilet.zan.kz/rus/docs/V1500012665#z249
  quote: 62. Повторный инструктаж проходят работники независимо от квалификации, образования, стажа, характера выполняемой
    работы не реже одного раза в полугодие в рабочее время (за исключением категорий работников, определенных руководителем,
    подлежащих обучению по безопасности и охраны труда).
  heading: Глава 4. Порядок и сроки проведения инструктирования по вопросам безопасности и охраны труда работников, руководителей
    и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:62
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p7:
  short: МЗСР №1019 от 25.12.2015, пункт 7
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 7
  url: https://adilet.zan.kz/rus/docs/V1500012665#z112
  quote: 7. Список профессий (должностей) и перечень работ, по которым проводится обучение, а также порядок и форму обучения
    устанавливает работодатель, исходя из характера профессии, вида работ, специфики производства и условий труда по согласованию
    с представителями работников (при их наличии).
  heading: Глава 2. Порядок и сроки проведения обучения и проверки знаний в области безопасности и охраны труда работников,
    за исключением руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:7
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n1019_p71:
  short: МЗСР №1019 от 25.12.2015, пункт 71
  document: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности
    и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  act: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019. Зарегистрирован
    в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12665.
  clause: пункт 71
  url: https://adilet.zan.kz/rus/docs/V1500012665#z267
  quote: '71. Запись о проведении первичного инструктажа на рабочем месте, повторного, внепланового, целевого инструктажей
    и допуске к работе делается работником, проводившим инструктаж в журнале регистрации инструктажа по безопасности и охране
    труда на рабочем месте (далее – Журнал регистрации инструктажа) по форме согласно Приложению 17 к настоящим Правилам с
    обязательной подписью инструктируемого и инструктирующего.

    Журнал регистрации инструктажа ведется в бумажном либо электронном формате с учетом требований Цифрового кодекса Республики
    Казахстан. При ведении журнала регистрации инструктажа в электронном формате, внесенные в него сведения удостоверяются
    посредством ЭЦП.

    При регистрации внепланового инструктажа указывается причина его проведения.

    Журнал регистрации инструктажа заполняется работником, ответственным за обеспечение безопасности и охраны труда, прошедшим
    обучение и проверку знаний требований безопасности и охраны труда, при наличии сертификата по форме согласно Приложению
    1 к настоящим Правилам.'
  heading: Глава 4. Порядок и сроки проведения инструктирования по вопросам безопасности и охраны труда работников, руководителей
    и лиц, ответственных за обеспечение безопасности и охраны труда
  spec: V1500012665:71
  source_sha256: ce1ba6e612d77c7be257d3fd4ff18c15c009824d382ed7a6e9411715def0af18
  source: corpus 2026-10-17
n230_p10:
  short: НБРК №230, пункт 10
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 10
  url: https://adilet.zan.kz/rus/docs/V1700016120#z36
  quote: '10. Ветхими банкнотами являются банкноты, имеющие следующие повреждения:

    1) залитые красящими веществами;

    2) имеющие посторонние надписи, в том числе:

    обработанные специальным химическим порошком, которые видны при ультрафиолетовом свете;

    перекрывающие машиночитаемые признаки;

    3) разорванные банкноты, склеенные или несклеенные части которых бесспорно принадлежат одной и той же банкноте и вместе
    составляют площадь не менее 70% (семидесяти процентов) от установленного Национальным Банком размера банкноты;

    4) утратившие от угла или края более 1% (одного процента) площади, но при этом сохранившие не менее 70% (семидесяти процентов)
    от установленного Национальным Банком размера банкноты;

    5) имеющие надрывы, склеенные прозрачной липкой лентой;

    6) имеющие отверстия, проколы и дыры от 3 (трех) и более миллиметров в диаметре, за исключением случаев, когда наличие
    проколов на банкноте свидетельствует о ее погашении;

    7) имеющие потертости, которые привели к утрате изображения банкноты;

    8) обожженные и прожженные, но при этом сохранившие не менее 70% (семидесяти процентов) от установленного Национальным
    Банком размера банкноты;

    9) имеющие загрязнение поверхности лицевой и (или) оборотной сторон, которые привели к снижению изображения и яркости
    банкноты. Под загрязнением подразумевается состояние банкнот, которое характеризуется потемнением поверхности банкноты
    вследствие наличия пыли, грязи, масел и других загрязняющих веществ;

    10) имеющие разрыхление и потерявшие жесткость бумаги;

    11) окрашенные специальными красками, используемыми в приспособлениях для хранения и безопасной перевозки банкнот.

    Сноска. Пункт 10 - в редакции постановления Правления Национального Банка РК от 05.07.2024

    № 37

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 2. Определение платежности банкнот и монет национальной валюты Республики Казахстан, имеющих силу законного
    средства платежа
  spec: V1700016120:10
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p11:
  short: НБРК №230, пункт 11
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 11
  url: https://adilet.zan.kz/rus/docs/V1700016120#z49
  quote: '11. Дефектными (поврежденными) монетами являются монеты, имеющие следующие повреждения:

    1) сплющенные, продырявленные, погнутые, надпиленные, ломаные, потертые (кроме монет, подвергнутых механической обработке
    (рифлению);

    2) травленные в кислоте, с напоем каких-либо металлов;

    3) поврежденные при воздействии высокой температуры;

    4) изменившие свой первоначальный цвет, но сохранившие письменные и (или) цифровые знаки на аверсе (лицевой стороне),
    реверсе (оборотной стороне) или гурте (боковой поверхности).'
  heading: Глава 2. Определение платежности банкнот и монет национальной валюты Республики Казахстан, имеющих силу законного
    средства платежа
  spec: V1700016120:11
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p12:
  short: НБРК №230, пункт 12
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 12
  url: https://adilet.zan.kz/rus/docs/V1700016120#z54
  quote: 12. Поступившие в уполномоченные банки платежные ветхие банкноты, дефектные (поврежденные) монеты отсортировываются,
    в обращение не выпускаются, передаются в филиалы Национального Банка и обмениваются на банкноты и монеты, годные к обращению.
  heading: Глава 2. Определение платежности банкнот и монет национальной валюты Республики Казахстан, имеющих силу законного
    средства платежа
  spec: V1700016120:12
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p15:
  short: НБРК №230, пункт 15
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 15
  url: https://adilet.zan.kz/rus/docs/V1700016120#z57
  quote: 15. Платежные ветхие банкноты и дефектные (поврежденные) монеты принимаются уполномоченными банками для всех видов
    платежей и переводов денег без ограничений.
  heading: Глава 2. Определение платежности банкнот и монет национальной валюты Республики Казахстан, имеющих силу законного
    средства платежа
  spec: V1700016120:15
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p24:
  short: НБРК №230, пункт 24
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 24
  url: https://adilet.zan.kz/rus/docs/V1700016120#z73
  quote: 24. Поддельные банкноты и монеты не подлежат обмену, возврату клиенту и передаются в правоохранительные органы Республики
    Казахстан.
  heading: Глава 3. Банкноты и монеты, не являющиеся законным платежным средством в Республике Казахстан
  spec: V1700016120:24
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p25:
  short: НБРК №230, пункт 25
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 25
  url: https://adilet.zan.kz/rus/docs/V1700016120#z74
  quote: '25. Неплатежными являются банкноты, утратившие 50% (пятьдесят) и более процентов от установленного Национальным
    Банком размера, банкноты, имеющие надпись "ҮЛГІ", "ОБРАЗЕЦ", "SPECIMEN", "МУЛЯЖ", а также банкноты, имеющие фрагменты
    подлинных банкнот и имеющие срезы.

    Сноска. Пункт 25 - в редакции постановления Правления Национального Банка РК от 05.07.2024

    № 37

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 3. Банкноты и монеты, не являющиеся законным платежным средством в Республике Казахстан
  spec: V1700016120:25
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p28:
  short: НБРК №230, пункт 28
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 28
  url: https://adilet.zan.kz/rus/docs/V1700016120#z77
  quote: 28. Банкноты и монеты, не являющиеся законным платежным средством, не подлежат к приему для осуществления платежей
    и переводов денег.
  heading: Глава 3. Банкноты и монеты, не являющиеся законным платежным средством в Республике Казахстан
  spec: V1700016120:28
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p29:
  short: НБРК №230, пункт 29
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 29
  url: https://adilet.zan.kz/rus/docs/V1700016120#z79
  quote: 29. Сомнительными банкнотами и монетами являются банкноты, сохранившие более 50% (пятидесяти процентов) площади установленных
    Национальным Банком размеров банкнот, имеющие повреждения, затрудняющие определение подлинности банкнот, и монеты, имеющие
    повреждения, искажения, затрудняющие определение подлинности монет.
  heading: Глава 4. Осуществление операций по определению платежности банкнот и монет и отдельных операций с ними после определения
    платежности и подлинности
  spec: V1700016120:29
  source_sha256: 8822ff8258ba5a1badf6f39cb41f5bb783e0d66efa637e5e6aa14e09c7d8f3f7
  source: corpus 2026-10-17
n230_p30:
  short: НБРК №230, пункт 30
  document: Об утверждении Правил определения платежности банкнот и монет национальной валюты Республики Казахстан
  act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 26 декабря 2017 года № 16120.
  clause: пункт 30
  url: https://adilet.zan.kz/rus/docs/V1700016120#z80
  quote: 30. Сомнительные банкноты и монеты принимаются уполномоченными банками и направляются на экспертизу в филиалы Национального
    Банка для определения подлинности и возможности обмена.
  heading: Глава 4. Осуществление операций по определению платежности банкнот и монет и отдельных операций с ними после определения
    платежности и подлинности
