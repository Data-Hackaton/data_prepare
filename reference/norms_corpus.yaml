    лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  act: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14. Зарегистрировано в Министерстве
    юстиции Республики Казахстан 27 февраля 2020 года № 20075.
  clause: пункт 8
  url: https://adilet.zan.kz/rus/docs/V2000020075#z49
  quote: '8. Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним
    закрывающимся служебным входом.

    Допускается оборудовать дополнительный закрывающийся вход для осуществления погрузочно-разгрузочных работ с наличными
    деньгами и ценностями в боксе или на погрузочно-разгрузочной площадке.'
  heading: Глава 3. Порядок устройства помещений банков, инкассаторских организаций, предназначенных для осуществления кассовых
    операций, операций по инкассации банкнот, монет и ценностей
  spec: V2000020075:8
  source_sha256: 89b91567941acfa3d4fca1d374f04b1716cdf20fab43bd4d50ca7074b17ee16d
  source: corpus 2026-10-17
n55_p24:
  short: МЧС №55 от 21.02.2022, пункт 24
  document: Об утверждении Правил пожарной безопасности
  act: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 21 февраля 2022 года № 55. Зарегистрирован в Министерстве
    юстиции Республики Казахстан 21 февраля 2022 года № 26867.
  clause: пункт 24
  url: https://adilet.zan.kz/rus/docs/V2200026867#z65
  quote: '24. В зданиях и сооружениях (за исключением индивидуальных жилых домов) не допускается:

    1) хранить и складировать в подвалах, цокольных этажах, чердаках, технических этажах, технических помещениях, вентиляционных
    камерах легковоспламеняющиеся и горючие жидкости, взрывчатые вещества, пиротехнические изделия, баллоны с горючими газами,
    товары в аэрозольной упаковке, целлулоиду, взрывопожароопасные, горючие вещества и материалы;

    2) использовать и применять подвалы, цокольные этажи, чердаки, технические этажи и помещения, вентиляционные камеры не
    по целевому назначению, кроме случаев, предусмотренных проектной документацией;

    3) эксплуатировать лифтовые холлы не по целевому назначению;

    4) снимать предусмотренные проектом двери эвакуационных выходов из поэтажных коридоров, холлов, фойе, тамбуров и лестничных
    клеток, а также двери, препятствующие распространению опасных факторов пожара на путях эвакуации;

    5) производить изменения объемно-планировочных решений, в результате которых ухудшаются условия безопасной эвакуации людей,
    ограничивается доступ к огнетушителям, пожарным кранам, средствам пожарной безопасности или уменьшается зона действия
    автоматических систем противопожарной защиты (автоматической пожарной сигнализации, стационарной автоматической установки
    пожаротушения, системы дымоудаления, системы оповещения и управления эвакуацией);

    6) загромождать двери, люки, переходы в смежные секции и выходы на эвакуационные лестницы, демонтировать межбалконные
    лестницы, а также заваривать люки на балконах и лоджиях квартир;

    7) оставлять неубранным промасленный обтирочный материал;

    8) устанавливать решетки на окнах всех этажей здания и приямках у окон подвалов (за исключением помещений объектов уголовно-исполнительной
    системы и специальных учреждений, обеспечивающих временную изоляцию от общества, складов, касс, головных станций телевидения,
    оружейных комнат, секретных частей учреждений, хранения и обращения прекурсоров);

    9) остеклять балконы, лоджии и галереи, ведущие к незадымляемым лестничным клеткам, а также устанавливать на них решетки;

    10) устраивать в лестничных клетках, площадках и коридорах кладовые (подсобные помещения), а также хранить под лестничными
    маршами и на лестничных площадках вещи, мебель, горючие материалы. Под лестничными маршами в первом и цокольном этажах
    допускается устройство помещений для узлов управления центрального отопления, водомерных узлов и электрощитовых, выгороженных
    перегородками из негорючих материалов;

    11) устраивать в производственных и складских помещениях зданий (кроме зданий V степени огнестойкости) встроенные помещения,
    кроме случаев, предусмотренных проектной документацией;

    12) загромождать и закрывать проходы к средствам обеспечения пожарной безопасности и пожаротушения, а также к местам крепления
    спасательных устройств.

    Сноска. Пункт 24 с изменениями, внесенными приказами Министра по чрезвычайным ситуациям РК от 01.02.2023

    № 55

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); от 10.05.2023

    № 239

    (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).'
  heading: Глава 1. Организационно-технические мероприятия по обеспечению пожарной безопасности
  spec: V2200026867:24
  source_sha256: 78fe2bd7a62a24920d4ab05ca186a3ee6075dc4a1b119f34166fabda0875e02e
  source: corpus 2026-10-17
n55_p34:
  short: МЧС №55 от 21.02.2022, пункт 34
  document: Об утверждении Правил пожарной безопасности
  act: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 21 февраля 2022 года № 55. Зарегистрирован в Министерстве
    юстиции Республики Казахстан 21 февраля 2022 года № 26867.
  clause: пункт 34
  url: https://adilet.zan.kz/rus/docs/V2200026867#z94
  quote: 34. Запоры на дверях эвакуационных выходов обеспечивают возможность их свободного открывания изнутри без ключа, за
    исключением случаев, устанавливаемых законодательством Республики Казахстан.
  heading: Глава 1. Организационно-технические мероприятия по обеспечению пожарной безопасности
  spec: V2200026867:34
  source_sha256: 78fe2bd7a62a24920d4ab05ca186a3ee6075dc4a1b119f34166fabda0875e02e
  source: corpus 2026-10-17
n55_p36:
  short: МЧС №55 от 21.02.2022, пункт 36
  document: Об утверждении Правил пожарной безопасности
  act: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 21 февраля 2022 года № 55. Зарегистрирован в Министерстве
    юстиции Республики Казахстан 21 февраля 2022 года № 26867.
  clause: пункт 36
  url: https://adilet.zan.kz/rus/docs/V2200026867#z97
  quote: '36. При эксплуатации эвакуационных путей и выходов не допускается:

    1) устраивать препятствия, сужающие проектные размеры эвакуационных путей и выходов (в том числе проходов, коридоров,
    тамбуров, галереи, лифтовых холлов, лестничных площадок, маршей лестниц, дверей, эвакуационных люков), а также забивать
    (заваривать) двери эвакуационных выходов;

    2) устраивать на путях эвакуации пороги (за исключением порогов в дверных проемах), раздвижные и подъемно-опускные двери
    и ворота без возможности вручную открыть их изнутри и заблокировать в открытом состоянии, вращающиеся двери и турникеты,
    а также другие устройства, препятствующие свободной эвакуации людей, при отсутствии иных (дублирующих) путей эвакуации
    либо технических решений, позволяющих вручную открыть и заблокировать в открытом состоянии указанные устройства. Допускается
    в дополнение к ручному способу применение автоматического или дистанционного способа открывания и блокирования устройств.

    3) применять горючие материалы, не соответствующие классу пожарной опасности для отделки, облицовки и окраски полов, стен,
    потолков, лестниц и лестничных маршей на путях эвакуации, за исключением зданий V степени огнестойкости;

    4) фиксировать самозакрывающиеся двери лестничных клеток, коридоров, холлов и тамбуров в открытом положении, а также снимать
    их;

    5) остеклять или закрывать воздушные зоны незадымляемых лестничных клеток;

    6) заменять армированное стекло обычным в остеклениях дверей и фрамуг.'
  heading: Глава 1. Организационно-технические мероприятия по обеспечению пожарной безопасности
  spec: V2200026867:36
  source_sha256: 78fe2bd7a62a24920d4ab05ca186a3ee6075dc4a1b119f34166fabda0875e02e
  source: corpus 2026-10-17
n55_p83:
  short: МЧС №55 от 21.02.2022, пункт 83
  document: Об утверждении Правил пожарной безопасности
  act: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 21 февраля 2022 года № 55. Зарегистрирован в Министерстве
    юстиции Республики Казахстан 21 февраля 2022 года № 26867.
  clause: пункт 83
  url: https://adilet.zan.kz/rus/docs/V2200026867#z175
  quote: '83. Электрические установки и электрические приборы в помещениях по окончании рабочего времени (смены) обесточиваются.

    Остаются под напряжением аварийное освещение, установки пожаротушения и противопожарного водоснабжения, пожарная и охранно-пожарная
    сигнализация. Электрические установки и электротехнические изделия (в том числе в жилых помещениях) допускается оставлять
    под напряжением, если это обусловлено их функциональным назначением и (или) предусмотрено требованиями инструкции по эксплуатации
    заводов-изготовителей.'
  heading: Глава 3. Порядок обеспечения пожарной безопасности при содержании электроустановок зданий и сооружений
  spec: V2200026867:83
  source_sha256: 78fe2bd7a62a24920d4ab05ca186a3ee6075dc4a1b119f34166fabda0875e02e
  source: corpus 2026-10-17
n55_p86:
  short: МЧС №55 от 21.02.2022, пункт 86
  document: Об утверждении Правил пожарной безопасности
  act: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 21 февраля 2022 года № 55. Зарегистрирован в Министерстве
    юстиции Республики Казахстан 21 февраля 2022 года № 26867.
  clause: пункт 86
  url: https://adilet.zan.kz/rus/docs/V2200026867#z179
  quote: '86. При эксплуатации электрических установок не допускается:

    1) использовать электрические сети и приемники электрической энергии с нарушением требований безопасности, изложенных
    в инструкции завода-изготовителя, электрические приемники с неисправностями, которые могут привести к пожару (вызвать
    искрение, короткое замыкание, сверхдопустимый нагрев изоляции кабелей и проводов, отказ автоматических систем управления,
    противоаварийной и противопожарной защиты), а также эксплуатировать электрические провода и кабели с поврежденной или
    потерявшей защитные свойства изоляцией;

    2) пользоваться приемниками электрической энергии с нарушением конструкции и систем защиты, предусмотренных заводом-изготовителем,
    в том числе поврежденными и незакрепленными электроустановочными изделиями;

    3) применять электронагревательные приборы при отсутствии или неисправности терморегуляторов, предусмотренных конструкцией;

    4) пользоваться электроутюгами, электроплитками, электрочайниками и другими электронагревательными приборами без специальных
    подставок (цоколей питания, нагревательных дисков), исключающих опасность возникновения пожара, если их наличие предусмотрено
    инструкцией завода-изготовителя;

    5) применять нестандартные (самодельные) электронагревательные приборы, использовать некалиброванные плавкие вставки,
    самодельные аппараты защиты от перегрузки и короткого замыкания;

    6) размещать (складировать) у электрических щитов, электрических двигателей и пусковой аппаратуры пожароопасные и (или)
    взрывопожароопасные вещества и материалы;

    7) применять во взрывоопасных и пожароопасных зонах электрическое оборудование, не имеющее обозначения уровня и вида защиты
    от взрыва и (или) пожара завода-изготовителя.'
  heading: Глава 3. Порядок обеспечения пожарной безопасности при содержании электроустановок зданий и сооружений
  spec: V2200026867:86
  source_sha256: 78fe2bd7a62a24920d4ab05ca186a3ee6075dc4a1b119f34166fabda0875e02e
  source: corpus 2026-10-17
n55_p95:
  short: МЧС №55 от 21.02.2022, пункт 95
  document: Об утверждении Правил пожарной безопасности
  act: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 21 февраля 2022 года № 55. Зарегистрирован в Министерстве
    юстиции Республики Казахстан 21 февраля 2022 года № 26867.
  clause: пункт 95
  url: https://adilet.zan.kz/rus/docs/V2200026867#z205
  quote: 95. При обнаружении неисправностей электроустановок и бытовых электроприборов производится обесточивание. Их повторное
    включение допускается после устранения неисправностей.
  heading: Глава 3. Порядок обеспечения пожарной безопасности при содержании электроустановок зданий и сооружений
  spec: V2200026867:95
  source_sha256: 78fe2bd7a62a24920d4ab05ca186a3ee6075dc4a1b119f34166fabda0875e02e
  source: corpus 2026-10-17
pdn_measures_p21:
  short: Правила мер защиты персональных данных, пункт 21
  document: Об утверждении Правил осуществления собственником и (или) оператором, а также третьим лицом мер по защите персональных
    данных
  act: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 июня 2023
    года № 179/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 июня 2023 года № 32810.
  clause: пункт 21
  url: https://adilet.zan.kz/rus/docs/V2300032810#z110
  quote: '21. Собственник и (или) оператор, а также третье лицо обязаны принимать необходимые меры по защите персональных
    данных в соответствии с Законом и настоящими Правилами обеспечивающие:

    1) предотвращение несанкционированного доступа к персональным данным;

    2) своевременное обнаружение фактов несанкционированного доступа к персональным данным, если такой несанкционированный
    доступ не удалось предотвратить;

    3) минимизацию неблагоприятных последствий несанкционированного доступа к персональным данным;

    4) предоставление доступа государственной технической службе к цифровым объектам, использующим, хранящим, обрабатывающим
    и распространяющим персональные данные ограниченного доступа, содержащиеся в цифровых ресурсах, для осуществления обследования
    обеспечения защищенности процессов хранения, обработки и распространения персональных данных ограниченного доступа, содержащихся
    в цифровых ресурсах в порядке, определяемом уполномоченным органом.

    5) регистрацию и учет действий, предусмотренных подпунктами 3), 4), 5) и 6) пункта 4 статьи 8 Закона.'
  heading: Глава 2. Порядок осуществления собственником и (или) оператором, а также третьим лицом мер по защите персональных
    данных
  spec: V2300032810:21
  source_sha256: 41a9e8dc6ca98196c247c373dbc50c66a8cfaa04f9695181636865198abd2efb
  source: corpus 2026-10-17
n21_p1:
  short: АРРФР №21, пункт 1
  document: Об утверждении Инструкции по организации антитеррористической защиты расчетно-кассовых отделений банков второго
    уровня, уязвимых в террористическом отношении
